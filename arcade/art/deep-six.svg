<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="presentation">
<!-- DEEP SIX — cabinet art, drawn.
     The live game carries six inline <svg>s and every one is a 24x24 UI glyph
     (curl'd 2026-09-13); no og:image, nothing liftable. Drawn tile.
     This is the one game that is NOT a warm room, so it is cut from the walk-in
     ramp instead of the brass one — the only cold ramp in theme.css §02, which
     is exactly what "the other fleet, six fathoms down" wants and is still the
     site's own palette rather than a new colour.
     (Token names are written here without their leading double dash — an XML
      comment may not contain one. Put the two dashes back to grep theme.css.)
       #0a1016 ice-900  #121a22 ice-800  #1d2831 ice-700
       #2b3a45 ice-600  #9fb6c4 ice-300  #8ef0d0 lcd
     Motif: a sonar plate — depth rings, the sweep, a bearing grid, one contact. -->
<defs>
<linearGradient id="ds-deep" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#1d2831"/><stop offset="1" stop-color="#0a1016"/>
</linearGradient>
<linearGradient id="ds-sweep" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#8ef0d0" stop-opacity=".42"/>
<stop offset="1" stop-color="#8ef0d0" stop-opacity="0"/>
</linearGradient>
</defs>
<rect width="320" height="200" fill="url(#ds-deep)"/>
<!-- the swell, above -->
<path d="M0 26c26-10 52-10 78 0s52 10 78 0 52-10 78 0 52 10 86 0" fill="none" stroke="#9fb6c4" stroke-width="1.4" opacity=".3"/>
<path d="M0 40c26-9 52-9 78 0s52 9 78 0 52-9 78 0 52 9 86 0" fill="none" stroke="#9fb6c4" stroke-width="1.2" opacity=".16"/>
<!-- the plate: depth rings -->
<g fill="none" stroke="#9fb6c4" opacity=".34">
<circle cx="160" cy="124" r="22" stroke-width="1"/>
<circle cx="160" cy="124" r="42" stroke-width="1"/>
<circle cx="160" cy="124" r="62" stroke-width="1"/>
<circle cx="160" cy="124" r="82" stroke-width="1"/>
</g>
<!-- the bearing grid -->
<g stroke="#2b3a45" stroke-width="1">
<path d="M160 42v164M78 124h164M102 66l116 116M218 66L102 182"/>
</g>
<!-- the sweep -->
<path d="M160 124L246 96a88 88 0 0 1 8 28z" fill="url(#ds-sweep)"/>
<path d="M160 124l88-30" stroke="#8ef0d0" stroke-width="1.6" opacity=".72"/>
<!-- the contact, and its return -->
<circle cx="206" cy="100" r="4.5" fill="#8ef0d0"/>
<circle cx="206" cy="100" r="11" fill="none" stroke="#8ef0d0" stroke-width="1.2" opacity=".45"/>
<circle cx="206" cy="100" r="19" fill="none" stroke="#8ef0d0" stroke-width="1" opacity=".18"/>
<!-- the hull that is not coming back up -->
<path d="M112 162c14-9 40-11 58-4l-4 9c-18-6-40-4-52 3z" fill="#9fb6c4" opacity=".4"/>
<path d="M138 158l4-13 6 1-3 13z" fill="#9fb6c4" opacity=".35"/>
</svg>
