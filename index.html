  <!-- ═══════════════════════════════════════════════════════════════════════
       THE ONE DECISION: RESTAURANT, OR POCKET LIST?
       ═══════════════════════════════════════════════════════════════════════
       The client: "The mobile site just looks super rough, if I'm honest." He
       asked whether to build a separate m. subdomain; he edits the tool list
       weekly and two codebases would silently drift, so the answer is this —
       one URL, one tool list, two front ends, chosen here.

       WHY THIS RUNS HERE AND NOT IN A MODULE. assets/app.6452725cdb.js is type="module",
       which is deferred by definition: it cannot run until the document has
       parsed, by which point the page has painted. A decision made there would
       show the wrong site first and swap it — a flash of the whole cinema on a
       phone, which is worse than the problem. This is a synchronous inline
       script above the stylesheet, so <html data-view> is stamped before a
       single pixel is composited and theme.css §19 can style the first frame.

       THE PREDICATE — capability, not user agent.
           (pointer: coarse) and ((max-width: 500px)
                               or ((max-width: 1000px) and (max-height: 500px)))

       UA sniffing is out: it is unreliable, Chrome is actively reducing what it
       exposes, and an iPad has spent years claiming to be a Mac. `pointer:
       coarse` reports the PRIMARY input, so it separates a finger from a narrow
       desktop window (a 400px-wide Chrome window on a laptop stays `fine` and
       keeps the restaurant), and a touchscreen laptop with a trackpad also
       reports `fine`. The two size clauses catch a phone in portrait AND in
       landscape.

       THE 500px IS NOT THE 600px THAT WAS ASKED FOR, and here is the evidence.
       Verified against real logical viewports:

         POCKET, correctly (portrait / landscape, CSS px)
           iPhone SE 2-3        375x667  / 667x375
           iPhone 13 mini       375x812  / 812x375
           iPhone 15 / 14 / 13  393x852  / 852x393
           iPhone 15 Pro Max    430x932  / 932x430
           iPhone 16 Pro Max    440x956  / 956x440
           Galaxy S21/S24       360x800  / 800x360
           Pixel 8 / 8 Pro      412x915  / 915x412  (448 wide on the Pro)
         FULL SITE, correctly
           iPad mini 6          744x1133 / 1133x744
           iPad 10th / Air 11   820x1180 / 1180x820
           iPad Pro 11          834x1210 / 1210x834
           iPad Air 13 / Pro 13 1024x1366 / 1366x1024
           any desktop, any window width, because the pointer is fine

       At 600px the iPad HALF-AND-HALF SPLIT VIEW falls into the pocket list —
       570 CSS px on an 11-inch iPad in landscape, 561 on an iPad mini. The
       client's stores run iPads and the brief is explicit that they keep the
       cinematic site; handing them the flat list the moment a rep splits the
       screen is a real regression on their primary device. Nothing is lost by
       tightening it: the widest phone in portrait is 448 CSS px, so 500 keeps
       ~50px of headroom (enough for an Android "smallest display size" setting,
       which inflates the CSS px count by about 10%), and no shipping phone is
       between 500 and 600. 500 is also ALREADY the phone band in this build —
       theme.css §06e and the PLATE_SIZES constant in cinema.js both cut over at
       exactly `(max-width: 500px)` and `(max-width: 1000px) and
       (max-height: 500px)`. One definition of "phone", three places that agree.

       WHERE THE CALL IS STILL WRONG, honestly:
         · A folded-open Galaxy Z Fold (inner screen ~673x841 CSS) is a phone
           and gets the restaurant. It is also a 7.6-inch screen with a phone's
           memory budget. The escape hatch at the foot of the pocket list works
           in both directions and `?view=pocket` forces it.
         · A 600x960 Android tablet (Nexus 7 class, Fire 7) is a tablet and gets
           the pocket list at 600 — under 500 it correctly gets the full site.
         · iPhone Safari with "Request Desktop Website" reports a 980px-wide
           viewport and gets the restaurant. That is the setting doing what it
           says; `?view=pocket` or the link in the footer overrides it.
         · An iPad in Slide Over (320-375 CSS px) gets the pocket list. At that
           width it is the right answer, but it IS an iPad.

       PRECEDENCE, and why it is this way round:
         1. ?view=full | ?view=pocket   forces, for THIS VISIT ONLY, and is not
                                        written to storage — so a link the
                                        client sends to show someone the other
                                        side does not strand that person's phone
                                        in the wrong mode for ever.
         2. localStorage 'ccc-view'     the rep's own remembered choice, written
                                        only when they tap one of the two escape
                                        hatches. Wrapped in try/catch: reading
                                        localStorage THROWS outright in some
                                        Safari configurations, and an exception
                                        here would leave the page unstyled.
         3. the predicate above.
       data-view-source records which of the three answered, for support calls.

       AND, ONCE THE ANSWER IS "full", THE CINEMA'S MODULES GO ON THE WIRE HERE.
       The restaurant is sixteen modules four imports deep (app -> cinema ->
       engine/overlay/screens/… -> preflight/coldstore/…), and each level used
       to be discovered only when the level above it had arrived and parsed:
       three extra round trips before boot could start. The list below is every
       module cinema.js reaches by a STATIC import, as <link rel=modulepreload>,
       so they all start with the stylesheet (measured, iPad LTE: modules done
       −504 ms, boot −593 ms). It is FULL VIEW ONLY — a phone takes the pocket
       list and must not pay for the cinema — and it is decided in this script
       because this is the one place the view is known before the parser moves
       on. `?view=full` forcing still works: it is the same attribute.

       THE LIST IS WRITTEN BY build/fingerprint.mjs, never by hand. It holds
       hashed filenames, so a typed list is stale on the next build; the build
       recomputes the import closure and rewrites everything between the marker
       and its `]` on every run, and fails if a name in it does not exist. A
       stale entry would only be a wasted fetch — the imports themselves never
       read this list — but the build does not ship one. Safari 17+ honours
       modulepreload; an older engine ignores the tag and loads exactly as
       before.
       ═══════════════════════════════════════════════════════════════════════ -->

       ═══════════════════════════════════════════════════════════════════════
       HISTORY, because every rule below was paid for. This used to be a
       render-blocking <link> to fonts.googleapis.com ABOVE the two inline

       scripts above, a media="print" onload link, and removing theme.css §00's
       @import. That made a hung host harmless, but the fonts stayed LATE: the
       Google CSS was fetched at the lowest priority, behind the module waterfall,
       and the files it named were requested only once text was laid out after
       boot — fonts ready 3.7 s on LTE, a visible swap, and the ticket rail's
       layout shift (the page's only CLS source). Two extra origins, two extra
       TLS handshakes, 43% of a phone's bytes.

       NOW: the same four Latin files Google serves (Archivo roman/italic, Bodoni
       Moda roman/italic — variable, OFL; assets/fonts/OFL.txt) live in
       assets/fonts/ and are declared right here. build/fingerprint.mjs hashes
       them like any other asset and rewrites both URLs below, so they cache for
       good. What is unchanged, deliberately:
         · nothing here is render-blocking and nothing is ABOVE the view script;
         · font-display: swap — text paints at once in the §02 fallback stacks
           and the webfont replaces it (FOUT, never invisible text);
         · the descriptors are Google's, byte for byte, so nothing is set in a
           different weight, width or style than it was;
         · unicode-range stays the Latin range Google uses: a glyph outside it
           (an arrow, a check mark) falls back to a system face exactly as it
           always has.
       There is no third-party font host left to hang, so the "hung font host"
       failure class is gone rather than defended against.

       THREE OF THE FOUR ARE PRELOADED. The two Bodoni Moda faces are in the
       CRITICAL HINTS at the top of <head> — the curtain's masthead is set in
       them and waits for them. Archivo roman is preloaded here: it carries the
       ticket rail and every word of UI, and is otherwise discovered only when
       boot lays out the rail, which is what made the rail re-flow when it
       swapped. It sits after the cinema modules in request order on purpose:
       boot needs the modules first and the font by the time the rail is built.
       Archivo italic is declared only so nothing is ever synthesised, and is
       never fetched unless used. `crossorigin` is required on a font preload
       even on the same origin — without it the preload is not reused and the
       file downloads twice.

       STATION PAGES under tools/ carry their own copy of these faces with
       ../../ URLs (printouts, arcade), or of their own family (porting-guide:
       Inter; casino: DM Sans + Manrope). Keep the descriptors in step. -->

  <!-- M1 · THE CURTAIN'S OWN RULES. The markup and the reasoning are in <body>,
       on #curtain. Everything here is keyed off <html data-view>, which the
       first script above has already stamped: `full` pins the curtain over the
       page, `pocket` and `floor` never show it, and NO data-view (scripting
       off) leaves it in the flow as the page's own hero, above the <noscript>
       list. Motion is transform/opacity only; tiers follow contract C5
       (html[data-motion] full|lite|off, absent = full) and reduced motion. -->
  <style>
    .ccc-curtain {
      position: relative;
      block-size: 100svh;
      overflow: hidden;
      /* .plate-wrap solves its cover box in cqw against its container — on the
         live hero that is .stage; here it is the curtain, the same 100% x 100svh. */
      container-type: inline-size;
      background: var(--ink-950, #05070a);
      pointer-events: none;
      /* The hero's resting frame, as engine.js writes it at scrollY 0: p 0,
         enter 1, bloom 0, push-in 1, and the parallax drift at its start
         (drift −1 → x −DRIFT_X_PCT for the first room, y +DRIFT_Y_PCT). Given
         these, theme.css's own formulas produce the same grade, glow, vignette
         and crop as the live hero. KEEP IN STEP with engine.js if those change. */
      --p: 0; --enter: 1; --bloom: 0;
      /* v29: engine.js writes the FINE tier and .plate-wrap re-derives the
         public names from it (theme.css §01/§06), so the rest values go here
         too — unset, bloom-fine falls to its @property initial 1 (lit). */
      --p-fine: 0; --enter-fine: 1; --bloom-fine: 0; --exit-fine: 0;
      --plate-scale: 1; --plate-x: -1.4; --plate-y: 1.8;
      --focus-x: 0.5; --focus-y: 0.45; --glow-x: 50%; --glow-y: 20%;
    }
    /* theme.css §06d's framing for .room / .room[data-room="hero"], which the
       curtain (not a .room) has to state itself. KEEP IN STEP with it. */
    @media (min-width: 901px) and (min-aspect-ratio: 8 / 7) {
      .ccc-curtain { --overscan-k: 1.04; --art-y: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .ccc-curtain { --overscan-k: 1; }
    }
    html[data-view="full"] .ccc-curtain { position: fixed; inset: 0; z-index: 150; }
    html[data-view="pocket"] .ccc-curtain,
    html[data-view="floor"] .ccc-curtain { display: none; }
    .ccc-curtain picture { display: contents; }
    /* theme.css §17 grades a narrow-band room's vignette for its screens band
       and zeroes it on a `.stage` that has none — the hero's case. The curtain
       is not a .stage, so it states the hero's value itself. */
    .ccc-curtain .plate-vig { --band-h: 0px; }

    /* The rise starts at opacity .01, not 0. It looks identical, and it is the
       difference between Chromium counting the name as painted at first paint
       and not counting it at all: text whose first paint is at opacity 0 under
       an animation is ignored by FCP/LCP, so those metrics used to report the
       live hero's title after boot while this one was already on screen. */
    @keyframes ccc-curtain-rise   { from { opacity: .01; transform: translate3d(0, var(--m-rise-2, 14px), 0); } }
    @keyframes ccc-curtain-appear { from { opacity: .01; } }
    /* THE NAME WAITS FOR ITS FONT, THEN RISES. Until the two Bodoni Moda faces
       it is set in have loaded (or 1.2 s have passed — the script adds
       .is-type), the masthead is not shown at all. Shown in a fallback serif
       and then swapped, its line boxes and its §07 ground (sized in % of the
       title's own width) move — measured, that was the curtain's only layout
       shift. Hidden, the swap happens off screen and the rise starts on the
       real letterforms. The plate is not held back; only the type. */
    html[data-view="full"] .ccc-curtain:not(.is-type) .hero-inner { visibility: hidden; }
    html[data-view="full"] .ccc-curtain.is-type .hero-title > span {
      animation: ccc-curtain-rise var(--m-t-5, 560ms) var(--m-ease-cine, cubic-bezier(.16, 1, .3, 1)) 120ms both;
    }
    html[data-view="full"] .ccc-curtain.is-type .hero-title > span:nth-child(2) { animation-delay: 210ms; }
    html[data-view="full"] .ccc-curtain.is-type .hero-title > span:nth-child(3) { animation-delay: 300ms; }
    html[data-view="full"] .ccc-curtain.is-type.is-lite .hero-title > span {
      animation-name: ccc-curtain-appear; animation-duration: 200ms; animation-timing-function: linear;
    }
    .ccc-curtain.is-off .hero-title > span { animation: none; }

    .ccc-curtain.is-up {
      opacity: 0;
      transition: opacity var(--m-t-4, 360ms) var(--m-ease-out, cubic-bezier(.22, .61, .24, 1));
    }
    .ccc-curtain.is-up.is-lite { transition-duration: 200ms; transition-timing-function: linear; }

    @media (prefers-reduced-motion: reduce) {
      .ccc-curtain .hero-title > span { animation: none !important; }
      .ccc-curtain.is-up { transition: none; }
    }
  </style>

  <!-- ═══════════════════════════════════════════════════════════════════════
       THE SERVICE WORKER, AND THE THREE THINGS IT IS NOT ALLOWED TO DO
       ═══════════════════════════════════════════════════════════════════════
       There was no service worker and no manifest, so a rep who warmed this
       page and then walked into a stockroom got net::ERR_INTERNET_DISCONNECTED
       on reload — with the whole 7.5 KB tool list sitting inline in the very
       document the browser refused to show them. sw.js fixes that and nothing
       else; read its header for the rules, of which the load-bearing three are:

         · it never intercepts a CROSS-ORIGIN request, so no TOOL can ever come
           out of it — every tool is on another origin, so that is a property of
           the code rather than a policy that can drift;
         · content-hashed URLs are cache-first (they are immutable by
           construction — that is what build/fingerprint.mjs is for) and
           everything whose URL does not move, index.html included, is
           network-first, so a deploy still lands the moment there is a network;
         · it precaches nothing, so it can never name a hashed filename that the
           next build has already pruned.

       REGISTERED HERE, NOT IN A MODULE, AND AFTER `load`.
       In the <head> because it must not depend on assets/app.6452725cdb.js — the deploy
       window where a hashed module 404s is one of the cases this is meant to
       survive. After `load` because registration competes for the same
       connection as the hero plate, and the offline floor is for the NEXT
       visit, never this one.

       ?nosw=1 IS THE ESCAPE HATCH and it is not optional garnish: a service
       worker that cannot be removed from the address bar is a liability on a
       site nobody can SSH into. It unregisters the worker and deletes its
       caches, then leaves the page alone.

       Everything is inside try/catch and behind feature tests: file:// (Jeff's
       USB stick) and any non-secure origin have no navigator.serviceWorker at
       all, and must boot exactly as before. -->
  <script>
    (function () {
      if (!('serviceWorker' in navigator)) return;
      var nosw = false;
      try { nosw = new URLSearchParams(location.search).has('nosw'); } catch (e) {}
      if (nosw) {
        try {
          // Tell the worker that controls THIS page to stand down first (sw.js
          // handles {ccc:'unregister'}): unregistering alone leaves it in
          // control until the page closes, and a still-controlling worker
          // re-filled its cache after the delete below (links audit: `regs 0,
          // caches 1`). Then unregister, then drop the caches — in that order,
          // so a worker cannot be re-populating a cache while it is deleted.
          try {
            var ctl = navigator.serviceWorker.controller;
            if (ctl) ctl.postMessage({ ccc: 'unregister' });
          } catch (e) {}
          navigator.serviceWorker.getRegistrations()
            .then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); })
            .then(function () {
              if (!window.caches || !caches.keys) return null;
              return caches.keys().then(function (ks) {
                return Promise.all(ks.map(function (k) { return caches.delete(k); }));
              });
            })
            .catch(function () {});
        } catch (e) {}
        return;
      }
      // https:// or localhost only — the API is absent elsewhere, but asking
      // for it on a file:// review build throws in some builds of WebKit.
      if (location.protocol !== 'https:' && location.hostname !== 'localhost'
          && location.hostname !== '127.0.0.1') return;
      window.addEventListener('load', function () {
        try { navigator.serviceWorker.register('sw.js', { scope: './' }).catch(function () {}); }
        catch (e) { /* registration refused: the site is exactly as it was */ }
      });
    })();
  </script>

  <!-- ═══════════════════════════════════════════════════════════════════════
       M1 · THE CURTAIN — THE FIRST FRAME IS THE RESTAURANT, NOT BLACK
       ═══════════════════════════════════════════════════════════════════════
       #kitchen is empty until every cinema module has downloaded and boot has
       built all eight rooms, so a cold iPad used to look at a black page with a
       hairline for 2.7 s (LTE) to 4.9 s (an older iPad). This is the hero,
       as static HTML: the storefront plate and the three-line masthead, painted
       from the first frame with nothing but theme.css. The name rises in (M1:
       560 ms, 90 ms apart); boot happens underneath; when the engine has painted
       its own first hero frame (contract C3, `ccc:first-frame`) the curtain
       dissolves (360 ms) into a picture it is built to match, and is removed.

       WHY IT MATCHES WITHOUT A SECOND COPY OF THE STYLING. It uses theme.css's
       own .plate-wrap / .plate / .plate-glow / .plate-vig / .hero-inner /
       .hero-title rules, fed the engine's resting values for the hero (see the
       <style> after theme.css). It is deliberately NOT a `.room` and has no ids:
       engine.js collects `.room` elements and every other query in the codebase
       is scoped to a room, so nothing can mistake this for the kitchen. Keep it
       that way — a global querySelector('.plate-wrap') would find this first.

       THE PLATE IS THE PRELOADED ONE, NEVER A SECOND DOWNLOAD. The <source>
       carries the hero preload's exact media, srcset and sizes, so it picks the
       URL the preload already fetched. On a phone the media does not match and
       the <img> keeps its 1x1 placeholder: no request at all (and the pocket
       view never shows this element anyway).

       IT FAILS OPEN, every way it can:
         · no JavaScript — no data-view, so it sits in the flow as the page's
           hero, static, with the <noscript> list below it;
         · the phone — data-view="pocket": never displayed, removed at once;
         · a boot failure — app.js's fallback list and the inline floor both
           set data-view="floor", which hides it and removes it at once;
         · a boot that never signals — 4 s after the kitchen is built it lifts
           anyway, and 12 s after this script ran it lifts whatever happened;
         · it never takes a click (pointer-events: none) and is aria-hidden:
           the live page underneath is the one that is read and operated.
       <html data-curtain> records what lifted it, for support calls. -->
  <div class="ccc-curtain" id="curtain" aria-hidden="true">
    <div class="plate-wrap">

  <!-- The restaurant: a hero section, then the seven rooms in scroll order.
       Filled by app.js §3 from rooms.js geometry and tools.json copy.

       tabindex="-1" IS FOR THE SKIP LINK, and it is not decoration. Following
       `href="#kitchen"` moves the DOCUMENT to this element but only moves FOCUS
       to it if it is focusable. Chromium papers over the difference with its
       sequential-focus-navigation starting point, so the next Tab lands inside
       the kitchen anyway; WebKit frequently does not move the VoiceOver cursor
       to a non-focusable fragment target, and VoiceOver on Safari is what these
       users actually run — the skip link silently did nothing for them. One
       attribute makes <main> a real focus target on every engine. It stays
       untabbable: -1 means programmatic focus only, so it adds no tab stop. -->
  <main id="kitchen" tabindex="-1"></main>

  <script>
    (function () {
      var d = document.documentElement, c = document.getElementById('curtain');
      if (!c) return;
      var done = false, safety = 0, cap = 0, moView = null, moKitchen = null;
      var raf = window.requestAnimationFrame
        ? function (f) { window.requestAnimationFrame(f); }
        : function (f) { window.setTimeout(f, 16); };

      /* Contract C5: html[data-motion] (full|lite|off), stamped by the first
         script in <head> and owned by assets/motion.js from boot on. The
         fallbacks below only matter if that script did not run: the same
         early signals, read-only. Reduced motion is always off. */
      function tier() {
        var ok = { full: 1, lite: 1, off: 1 };
        var m = d.getAttribute('data-motion');
        if (!ok[m]) { m = null; try { m = new URLSearchParams(location.search).get('motion'); } catch (e) {} }
        if (!ok[m]) { m = null; try { m = window.sessionStorage.getItem('ccc-motion'); } catch (e) {} }
        if (!ok[m]) m = 'full';
        try { if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) m = 'off'; } catch (e) {}
        return m;
      }
      function drop() { if (c.parentNode) c.parentNode.removeChild(c); }
      function stop() {
        window.clearTimeout(safety); window.clearTimeout(cap);
        try { document.removeEventListener('ccc:first-frame', onFrame); } catch (e) {}
        try { if (moView) moView.disconnect(); if (moKitchen) moKitchen.disconnect(); } catch (e) {}
      }
      function lift(why) {
        if (done) return;
        done = true;
        stop();
        d.setAttribute('data-curtain', why);
        var t = tier();
        if (t === 'off' || d.getAttribute('data-view') !== 'full') { drop(); return; }
        // Two frames: the frame that raised the signal is on screen before the
        // fade starts, so the dissolve is onto a painted hero, never onto black.
        raf(function () { raf(function () {
          if (t === 'lite') c.classList.add('is-lite');
          c.classList.add('is-up');
          c.addEventListener('transitionend', function (e) { if (e.target === c) drop(); });
          window.setTimeout(drop, (t === 'lite' ? 200 : 360) + 300);
        }); });
      }
      function onFrame() { lift('first-frame'); }
      function viewChanged() { if (d.getAttribute('data-view') !== 'full') lift('view-' + d.getAttribute('data-view')); }

      var t0 = tier();
      if (t0 !== 'full') c.classList.add('is-' + t0);
      if (d.getAttribute('data-view') !== 'full') { lift('view-' + d.getAttribute('data-view')); return; }

      // The masthead is shown once its faces are in (see the note on .is-type).
      var typed = false;
      function type() { if (!typed) { typed = true; c.classList.add('is-type'); } }
      window.setTimeout(type, 1200);
      try {
        Promise.all([document.fonts.load('430 100px "Bodoni Moda"'),
                     document.fonts.load('italic 430 100px "Bodoni Moda"')]).then(type, type);
      } catch (e) { type(); }

      document.addEventListener('ccc:first-frame', onFrame);
      cap = window.setTimeout(function () { lift('cap'); }, 12000);
      try {
        moView = new MutationObserver(viewChanged);
        moView.observe(d, { attributes: true, attributeFilter: ['data-view'] });
        var k = document.getElementById('kitchen');
        moKitchen = new MutationObserver(function () {
          if (!k.firstElementChild || safety) return;
          safety = window.setTimeout(function () { lift('timeout'); }, 4000);
        });
        if (k) moKitchen.observe(k, { childList: true });
      } catch (e) {
        safety = window.setTimeout(function () { lift('timeout'); }, 4000);
      }
    })();
  </script>

  <!-- ═══════════════════════════════════════════════════════════════════════
       THE ENTRY POINT, AND WHAT HAPPENS WHEN THE ENTRY POINT ITSELF IS GONE
       ═══════════════════════════════════════════════════════════════════════
       assets/app.6452725cdb.js wraps its own boot in a try/catch and draws a flat list of
       every tool if any module it imports fails — but it cannot draw anything
       if IT is the file that 404'd, and that is not hypothetical: on
       2026-08-31 assets/app.6452725cdb.js was live-404ing on
       cookcountycooks.com while index.html, served with cache-control:
       max-age=600, was still naming it. build/fingerprint.mjs had emitted the
       next build's hashed names and pruned the previous build's; for up to ten
       minutes every browser holding the old HTML asked for a file that no
       longer existed. What that gave a rep mid-conversation was a page whose
       only link was "Skip to the kitchen", pointing at an empty <main>.

       The entry below catches that case — its import() of app.js rejects — and
       calls the floor. (It used to be a <script type="module" src> with an
       `onerror`; see the note on the entry itself for why it is an inline
       module now. A rejected import() covers everything `onerror` did, plus an
       app.js that loads but throws while it evaluates.) The handler below is a
       DELIBERATE, MINIMAL DUPLICATE of app.js's renderFloor(): a <ul> of real
       <a href>, grouped by room, built from the tool list that is already
       inline in this document three <script>s above. It is inline because a
       floor with a dependency is not a floor — anything it imported could be
       the very file that is missing.

       Keep it boring. It is not meant to be the site; it is meant to be the
       thing that is never nothing. -->
  <script>
    window.__cccFloor = function () {
      try {
        if (document.documentElement.dataset.view === 'floor') return;   // already drawn
        var main = document.getElementById('kitchen');
        var data = (window.__CCC_INLINE__ && window.__CCC_INLINE__.tools) || null;
        if (!main) return;
        document.documentElement.dataset.view = 'floor';

        // freshUrl(), inlined: stamp cross-origin only, never our own hashed
        // assets. assets/freshurl.js carries the client's own words on why.
        function stamp(u) {
          try {
            var x = new URL(u, location.href);
            if (x.origin === location.origin) return x.href;
            x.searchParams.set('_ccc', String(Date.now()));
            return x.href;
          } catch (e) { return u; }
        }
        function node(tag, cls, text) {
          var n = document.createElement(tag);
          if (cls) n.className = cls;
          if (text != null) n.textContent = text;
          return n;
        }

        var wrap = node('div', 'floor');
        var head = node('div', 'floor-head');
        head.appendChild(node('p', 'kicker', 'Cook County Cooks'));
        head.appendChild(node('h1', 't-sub', 'Every tool, one tap away'));
        head.appendChild(node('p', 'micro',
          'The kitchen could not be loaded on this visit, so here is the plain list. Every link is live.'));
        var again = node('p');
        var a0 = node('a', 'chip', 'Try the full site again');
        a0.href = location.pathname + location.search;
        again.appendChild(a0);
        head.appendChild(again);
        wrap.appendChild(head);

        var tools = (data && data.tools) || [];
        var rooms = (data && data.rooms) || [];
        var byRoom = {}, order = [], i, t;
        for (i = 0; i < tools.length; i++) {
          t = tools[i];
          if (!t || !t.url) continue;
          var key = t.room || 'other';
          if (!byRoom[key]) { byRoom[key] = []; order.push(key); }
          byRoom[key].push(t);
        }
        var labels = {};
        for (i = 0; i < rooms.length; i++) if (rooms[i] && rooms[i].id) labels[rooms[i].id] = rooms[i].label;
        var seq = [];
        for (i = 0; i < rooms.length; i++) if (rooms[i] && byRoom[rooms[i].id]) seq.push(rooms[i].id);
        for (i = 0; i < order.length; i++) if (seq.indexOf(order[i]) === -1) seq.push(order[i]);

        for (i = 0; i < seq.length; i++) {
          var id = seq[i];
          var sec = node('section');
          sec.appendChild(node('h2', 'kicker', labels[id] || id));
          var ul = node('ul');
          for (var j = 0; j < byRoom[id].length; j++) {
            t = byRoom[id][j];
            var li = node('li');
            var a = node('a', 'tool-row');
            a.href = stamp(t.url);
            a.rel = 'noopener';
            a.appendChild(node('span', 'tool-row-name', t.label || t.slug));
            if (t.blurb) a.appendChild(node('span', 'tool-row-blurb', t.blurb));
            li.appendChild(a);
            ul.appendChild(li);
          }
          sec.appendChild(ul);
          wrap.appendChild(sec);
        }
        if (!seq.length) {
          wrap.appendChild(node('p', 'micro',
            'The tool list is not in this page either. Reload to fetch a fresh copy of the site.'));
        }
        main.replaceChildren ? main.replaceChildren(wrap) : (main.innerHTML = '', main.appendChild(wrap));
      } catch (e) { /* a floor that throws is not a floor; fail silent */ }
    };
  </script>
  <!-- THE ENTRY — ONE PAINTED FRAME FIRST, THEN app.js (full view only).
       With the cinema's modules preloaded (see the first script in <head>)
       they are all on hand the moment parsing ends, and a plain
       <script type="module" src> then runs app.js and the whole boot — one long
       task, 0.4–0.9 s on a store iPad, 2–3 s on an older one — with no chance
       for the browser to paint in between. Measured: the curtain, which is
       ready at that point, first reached the screen AFTER boot in two of three
       iPad runs. So the entry waits for one frame (rAF, then a task, i.e.
       after that frame's paint) and only then imports app.js. Cost: one frame.
       The pocket view has no curtain and imports at once. A hidden tab does not
       run rAF, so a 250 ms timer races it and boot is never held for a frame
       that is not coming.
       app.js is still found by the preload scanner — it is <link
       rel="modulepreload">'d in CRITICAL HINTS at the top of <head> — so
       nothing is fetched later than before. The import path is rewritten to the
       hashed name by build/fingerprint.mjs like every other reference. -->
  <script type="module">
    (function () {
      var started = false;
      function go() {
        if (started) return;
        started = true;
        import('./assets/app.6452725cdb.js').catch(function (err) {
          try { console.error('[entry] assets/app.6452725cdb.js did not load; drawing the plain list.', err); } catch (e) {}
          if (window.__cccFloor) window.__cccFloor();
        });
      }
      var d = document.documentElement;
      if (d.getAttribute('data-view') !== 'full' || !window.requestAnimationFrame ||
          document.visibilityState === 'hidden') { go(); return; }
      window.setTimeout(go, 250);
      window.requestAnimationFrame(function () { window.setTimeout(go, 0); });
    })();
  </script>
