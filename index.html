  <!-- ═══════════════════════════════════════════════════════════════════════
       THE ONE DECISION: RESTAURANT, OR POCKET LIST?
       ═══════════════════════════════════════════════════════════════════════
       The client: "The mobile site just looks super rough, if I'm honest." He
       asked whether to build a separate m. subdomain; he edits the tool list
       weekly and two codebases would silently drift, so the answer is this —
       one URL, one tool list, two front ends, chosen here.

       WHY THIS RUNS HERE AND NOT IN A MODULE. assets/app.e8d15b710b.js is type="module",
       which is deferred by definition: it cannot run until the document has
       parsed, by which point the page has painted. A decision made there would
       show the wrong site first and swap it — a flash of the whole cinema on a
       phone, which is worse than the problem. This is a synchronous inline
       script above the stylesheet, so <html data-view> is stamped before a
       single pixel is composited and theme.css §19 can style the first frame.

       THE PREDICATE — capability, not user agent.
           (pointer: coarse) and ((max-width: 500px)
                               or ((max-width: 1000px) and (max-height: 500px)))

       UA sniffing is out: it is unreliable, Chrome is actively reducing what it
       exposes, and an iPad has spent years claiming to be a Mac. `pointer:
       coarse` reports the PRIMARY input, so it separates a finger from a narrow
       desktop window (a 400px-wide Chrome window on a laptop stays `fine` and
       keeps the restaurant), and a touchscreen laptop with a trackpad also
       reports `fine`. The two size clauses catch a phone in portrait AND in
       landscape.

       THE 500px IS NOT THE 600px THAT WAS ASKED FOR, and here is the evidence.
       Verified against real logical viewports:

         POCKET, correctly (portrait / landscape, CSS px)
           iPhone SE 2-3        375x667  / 667x375
           iPhone 13 mini       375x812  / 812x375
           iPhone 15 / 14 / 13  393x852  / 852x393
           iPhone 15 Pro Max    430x932  / 932x430
           iPhone 16 Pro Max    440x956  / 956x440
           Galaxy S21/S24       360x800  / 800x360
           Pixel 8 / 8 Pro      412x915  / 915x412  (448 wide on the Pro)
         FULL SITE, correctly
           iPad mini 6          744x1133 / 1133x744
           iPad 10th / Air 11   820x1180 / 1180x820
           iPad Pro 11          834x1210 / 1210x834
           iPad Air 13 / Pro 13 1024x1366 / 1366x1024
           any desktop, any window width, because the pointer is fine

       At 600px the iPad HALF-AND-HALF SPLIT VIEW falls into the pocket list —
       570 CSS px on an 11-inch iPad in landscape, 561 on an iPad mini. The
       client's stores run iPads and the brief is explicit that they keep the
       cinematic site; handing them the flat list the moment a rep splits the
       screen is a real regression on their primary device. Nothing is lost by
       tightening it: the widest phone in portrait is 448 CSS px, so 500 keeps
       ~50px of headroom (enough for an Android "smallest display size" setting,
       which inflates the CSS px count by about 10%), and no shipping phone is
       between 500 and 600. 500 is also ALREADY the phone band in this build —
       theme.css §06e and the PLATE_SIZES constant in cinema.js both cut over at
       exactly `(max-width: 500px)` and `(max-width: 1000px) and
       (max-height: 500px)`. One definition of "phone", three places that agree.

       WHERE THE CALL IS STILL WRONG, honestly:
         · A folded-open Galaxy Z Fold (inner screen ~673x841 CSS) is a phone
           and gets the restaurant. It is also a 7.6-inch screen with a phone's
           memory budget. The escape hatch at the foot of the pocket list works
           in both directions and `?view=pocket` forces it.
         · A 600x960 Android tablet (Nexus 7 class, Fire 7) is a tablet and gets
           the pocket list at 600 — under 500 it correctly gets the full site.
         · iPhone Safari with "Request Desktop Website" reports a 980px-wide
           viewport and gets the restaurant. That is the setting doing what it
           says; `?view=pocket` or the link in the footer overrides it.
         · An iPad in Slide Over (320-375 CSS px) gets the pocket list. At that
           width it is the right answer, but it IS an iPad.

       PRECEDENCE, and why it is this way round:
         1. ?view=full | ?view=pocket   forces, for THIS VISIT ONLY, and is not
                                        written to storage — so a link the
                                        client sends to show someone the other
                                        side does not strand that person's phone
                                        in the wrong mode for ever.
         2. localStorage 'ccc-view'     the rep's own remembered choice, written
                                        only when they tap one of the two escape
                                        hatches. Wrapped in try/catch: reading
                                        localStorage THROWS outright in some
                                        Safari configurations, and an exception
                                        here would leave the page unstyled.
         3. the predicate above.
       data-view-source records which of the three answered, for support calls.
       ═══════════════════════════════════════════════════════════════════════ -->
  <script>
    (function () {
      var POCKET_MQ = '(pointer: coarse) and ((max-width: 500px) or ((max-width: 1000px) and (max-height: 500px)))';
      var d = document.documentElement;
      var q = null, saved = null, auto = 'full';
      try { q = new URLSearchParams(location.search).get('view'); } catch (e) {}
      if (q !== 'full' && q !== 'pocket') q = null;
      try { saved = localStorage.getItem('ccc-view'); } catch (e) {}
      if (saved !== 'full' && saved !== 'pocket') saved = null;
      try { auto = window.matchMedia(POCKET_MQ).matches ? 'pocket' : 'full'; } catch (e) {}
      d.setAttribute('data-view', q || saved || auto);
      d.setAttribute('data-view-auto', auto);
      d.setAttribute('data-view-source', q ? 'query' : (saved ? 'stored' : 'auto'));
    })();
  </script>

    /* INLINE DATA BOOTSTRAP — do not "clean this up" into a fetch.
       fetch()/XHR against a file:// URL is always CORS-mode and browsers refuse
       it outright for a null origin, even for a JSON file sitting in the same
       directory. Jeff and the district managers review this build by opening
       index.html straight off a USB stick / a Downloads folder, so the app has
       to boot with zero network. Both payloads are inlined verbatim from
       tools.json and headchefs.json; app.js falls back to fetching those two
       files out of data/ and headchefs/ if this block is ever removed.

       `freezer` is NOT a third payload — it is the SEALED one. The fourteen
       Walk-In Freezer tools are AES-256-GCM ciphertext; the key is
       PBKDF2-HMAC-SHA256 over the manager password at the iteration count named
       inside it. There is nothing in there to read without the password, which
       is the whole point: the manager tools are not hidden in this file, they
       are not in this file. Written by build/seal-freezer.mjs on every build —
       do not hand-edit it, re-seal.

       ON THE FILENAMES BELOW: every assets/ and plates/ URL in this document
       carries a content hash — the first ten hex digits of its own SHA-256.
       build/fingerprint.mjs writes them from the readable source names on every
       build, so a changed file is always a new URL and a stale browser cache
       cannot serve last week's art under this week's markup. Edit the SOURCE
       file in assets/ or plates/, never a hashed copy, then re-run the build. */

       This was a plain render-blocking <link rel="stylesheet">, and it sat
       ABOVE every script in this head. A stylesheet that is still pending
       blocks SCRIPT EXECUTION as well as rendering, and a parser-inserted
       script that cannot run stops the parser dead — so a fonts.googleapis.com
       request that HANGS never let the document reach <body> at all.

       Measured 2026-08-31, font request hung (connection accepted, never
       answered — which is precisely what a store's guest wifi and a captive
       portal do):
           BEFORE   t=1s / 10s / 30s   document.body: MISSING (bodyLen -1),
                                       <html data-view>: never stamped,
                                       nothing painted, readyState "loading"
           AFTER    t=1s               body present, data-view stamped,
                                       the kitchen built, the page usable
       Fast FAILURE was never the problem (with the font host refusing
       outright the view was decided at 92ms). It is the HANG that killed it.

       Three changes, and all three are load-bearing:
         1. THE TWO INLINE SCRIPTS MOVED ABOVE THIS TAG. Neither of them needs
            one byte of CSS — the first stamps <html data-view>, the second
            assigns an object — so they now run before a stylesheet has even
            been requested. Nothing else about them changed.
         2. media="print" + onload="this.media='all'". A stylesheet whose
            media does not match is still DOWNLOADED (at low priority) but is
            neither render-blocking nor script-blocking; flipping the media in
            onload applies it the instant it arrives. The <noscript> copy keeps
            the webfont for a browser with scripting off, where there is no
            boot left to protect.
         3. theme.css §00's own @import of this same URL IS GONE. It was the
            other half of the hazard and, on its own, still fatal: a sheet is
            not "loaded" until its @imports settle, whatever media they carry,
            so a hung import kept theme.css blocking scripts and app.js never
            ran. Measured with 1 and 2 already in place: @import unscoped and
            @import … print BOTH left <main id="kitchen"> with 0 children at
            1s, 10s and 30s; with the import removed the kitchen was built at
            1s. See the note in theme.css §00 — DO NOT PUT IT BACK. This <link>
            is now the only place the webfont is requested from.

  <!-- PLATE PRELOAD — THE HERO ONLY.
       The hero is the LCP element, so it gets the one preload and the one high
       priority. `pass` used to be preloaded here as well; it is not any more.
       It is now loading="lazy" in app.js, and preloading a lazy image is a
       contradiction that fetches it eagerly anyway — measurement showed Chrome's
       lazy threshold is generous enough that pass AND host land at first paint
       regardless, so the preload was doing nothing except taking bandwidth off
       the hero. The other seven plates are lazy; preloading all eight would cost
       ~1.6MB of contention on a store iPad for imagery nobody has scrolled to.

       imagesrcset/imagesizes must mirror the <img> in app.js EXACTLY — the same
       three candidates and the same sizes expression — or the preload misses
       and the browser fetches the plate twice. The sizes value describes the
       plate's COVER box (theme.css §06), not the viewport, EXCEPT in the phone
       band, where it deliberately under-declares to 440px so an iPhone takes
       the 1400 cut instead of the 2400; app.js's PLATE_SIZES carries the whole
       derivation and the measurements behind it. Copy that constant here
       verbatim, in the same order — `sizes` takes the FIRST matching branch, so
       the two phone conditions must stay ahead of the aspect-ratio ones.

       THE `media` ATTRIBUTE IS THE PHONE'S HALF OF THE POCKET BUILD, and it is
       not decoration. A `<link rel="preload">` whose media query does not match
       is NEVER FETCHED — unlike a media-mismatched stylesheet, which browsers
       download anyway at low priority. That property is the only way to keep
       the hero off a phone without deleting the tag and rebuilding it from
       script, which would take the preload SCANNER off it for everybody else
       and cost the iPads their LCP.

       The condition is the exact NEGATION of the pocket predicate in the script
       below — De Morgan on `coarse AND (w<=500 OR (w<=1000 AND h<=500))`:

           NOT coarse            ->  (pointer: fine), (pointer: none)
           NOT (w<=500 OR ...)   ->  (min-width: 1001px)
                                 ->  (min-width: 501px) and (min-height: 501px)

       Checked: iPhone 393x852 and 852x393 match nothing -> no fetch. iPad
       820x1180 and 1180x820, iPad in half-and-half Split View at 570x820, and
       every desktop match -> fetched exactly as before. A browser too old to
       understand `pointer` fails those two terms and still matches on width, so
       it keeps the preload. IF YOU CHANGE THE PREDICATE, CHANGE THIS TOO. -->
  <link rel="preload" as="image" href="plates/hero.197e175d93.webp"
        media="(pointer: fine), (pointer: none), (min-width: 1001px), (min-width: 501px) and (min-height: 501px)"
        imagesrcset="plates/hero@1400.24df9e8171.webp 1400w, plates/hero@1800.e298cedad8.webp 1800w, plates/hero.197e175d93.webp 2400w"
        imagesizes="(max-width: 500px) 440px, (max-width: 1000px) and (max-height: 500px) 440px, (min-aspect-ratio: 2400/1340) 110vw, 197vh" fetchpriority="high">

  <link rel="stylesheet" href="assets/theme.2d7c2c8824.css">

  <!-- ═══════════════════════════════════════════════════════════════════════
       THE SERVICE WORKER, AND THE THREE THINGS IT IS NOT ALLOWED TO DO
       ═══════════════════════════════════════════════════════════════════════
       There was no service worker and no manifest, so a rep who warmed this
       page and then walked into a stockroom got net::ERR_INTERNET_DISCONNECTED
       on reload — with the whole 7.5 KB tool list sitting inline in the very
       document the browser refused to show them. sw.js fixes that and nothing
       else; read its header for the rules, of which the load-bearing three are:

         · it never intercepts a CROSS-ORIGIN request, so no TOOL can ever come
           out of it — every tool is on another origin, so that is a property of
           the code rather than a policy that can drift;
         · content-hashed URLs are cache-first (they are immutable by
           construction — that is what build/fingerprint.mjs is for) and
           everything whose URL does not move, index.html included, is
           network-first, so a deploy still lands the moment there is a network;
         · it precaches nothing, so it can never name a hashed filename that the
           next build has already pruned.

       REGISTERED HERE, NOT IN A MODULE, AND AFTER `load`.
       In the <head> because it must not depend on assets/app.e8d15b710b.js — the deploy
       window where a hashed module 404s is one of the cases this is meant to
       survive. After `load` because registration competes for the same
       connection as the hero plate, and the offline floor is for the NEXT
       visit, never this one.

       ?nosw=1 IS THE ESCAPE HATCH and it is not optional garnish: a service
       worker that cannot be removed from the address bar is a liability on a
       site nobody can SSH into. It unregisters the worker and deletes its
       caches, then leaves the page alone.

       Everything is inside try/catch and behind feature tests: file:// (Jeff's
       USB stick) and any non-secure origin have no navigator.serviceWorker at
       all, and must boot exactly as before. -->
  <script>
    (function () {
      if (!('serviceWorker' in navigator)) return;
      var nosw = false;
      try { nosw = new URLSearchParams(location.search).has('nosw'); } catch (e) {}
      if (nosw) {
        try {
          // Unregister FIRST, then drop the caches — in that order, so a worker
          // cannot be re-populating a cache while it is being deleted.
          navigator.serviceWorker.getRegistrations()
            .then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); })
            .then(function () {
              if (!window.caches || !caches.keys) return null;
              return caches.keys().then(function (ks) {
                return Promise.all(ks.map(function (k) { return caches.delete(k); }));
              });
            })
            .catch(function () {});
        } catch (e) {}
        return;
      }
      // https:// or localhost only — the API is absent elsewhere, but asking
      // for it on a file:// review build throws in some builds of WebKit.
      if (location.protocol !== 'https:' && location.hostname !== 'localhost'
          && location.hostname !== '127.0.0.1') return;
      window.addEventListener('load', function () {
        try { navigator.serviceWorker.register('sw.js', { scope: './' }).catch(function () {}); }
        catch (e) { /* registration refused: the site is exactly as it was */ }
      });
    })();
  </script>

  <!-- ═══════════════════════════════════════════════════════════════════════
       THE ENTRY POINT, AND WHAT HAPPENS WHEN THE ENTRY POINT ITSELF IS GONE
       ═══════════════════════════════════════════════════════════════════════
       assets/app.e8d15b710b.js wraps its own boot in a try/catch and draws a flat list of
       every tool if any module it imports fails — but it cannot draw anything
       if IT is the file that 404'd, and that is not hypothetical: on
       2026-08-31 assets/app.e8d15b710b.js was live-404ing on
       cookcountycooks.com while index.html, served with cache-control:
       max-age=600, was still naming it. build/fingerprint.mjs had emitted the
       next build's hashed names and pruned the previous build's; for up to ten
       minutes every browser holding the old HTML asked for a file that no
       longer existed. What that gave a rep mid-conversation was a page whose
       only link was "Skip to the kitchen", pointing at an empty <main>.

       A <script> element fires `error` when its module fails to load, which is
       exactly and only this case, so that is the hook. The handler below is a
       DELIBERATE, MINIMAL DUPLICATE of app.js's renderFloor(): a <ul> of real
       <a href>, grouped by room, built from the tool list that is already
       inline in this document three <script>s above. It is inline because a
       floor with a dependency is not a floor — anything it imported could be
       the very file that is missing.

       Keep it boring. It is not meant to be the site; it is meant to be the
       thing that is never nothing. -->
  <script>
    window.__cccFloor = function () {
      try {
        if (document.documentElement.dataset.view === 'floor') return;   // already drawn
        var main = document.getElementById('kitchen');
        var data = (window.__CCC_INLINE__ && window.__CCC_INLINE__.tools) || null;
        if (!main) return;
        document.documentElement.dataset.view = 'floor';

        // freshUrl(), inlined: stamp cross-origin only, never our own hashed
        // assets. assets/freshurl.js carries the client's own words on why.
        function stamp(u) {
          try {
            var x = new URL(u, location.href);
            if (x.origin === location.origin) return x.href;
            x.searchParams.set('_ccc', String(Date.now()));
            return x.href;
          } catch (e) { return u; }
        }
        function node(tag, cls, text) {
          var n = document.createElement(tag);
          if (cls) n.className = cls;
          if (text != null) n.textContent = text;
          return n;
        }

        var wrap = node('div', 'floor');
        var head = node('div', 'floor-head');
        head.appendChild(node('p', 'kicker', 'Cook County Cooks'));
        head.appendChild(node('h1', 't-sub', 'Every tool, one tap away'));
        head.appendChild(node('p', 'micro',
          'The kitchen could not be loaded on this visit, so here is the plain list. Every link is live.'));
        var again = node('p');
        var a0 = node('a', 'chip', 'Try the full site again');
        a0.href = location.pathname + location.search;
        again.appendChild(a0);
        head.appendChild(again);
        wrap.appendChild(head);

        var tools = (data && data.tools) || [];
        var rooms = (data && data.rooms) || [];
        var byRoom = {}, order = [], i, t;
        for (i = 0; i < tools.length; i++) {
          t = tools[i];
          if (!t || !t.url) continue;
          var key = t.room || 'other';
          if (!byRoom[key]) { byRoom[key] = []; order.push(key); }
          byRoom[key].push(t);
        }
        var labels = {};
        for (i = 0; i < rooms.length; i++) if (rooms[i] && rooms[i].id) labels[rooms[i].id] = rooms[i].label;
        var seq = [];
        for (i = 0; i < rooms.length; i++) if (rooms[i] && byRoom[rooms[i].id]) seq.push(rooms[i].id);
        for (i = 0; i < order.length; i++) if (seq.indexOf(order[i]) === -1) seq.push(order[i]);

        for (i = 0; i < seq.length; i++) {
          var id = seq[i];
          var sec = node('section');
          sec.appendChild(node('h2', 'kicker', labels[id] || id));
          var ul = node('ul');
          for (var j = 0; j < byRoom[id].length; j++) {
            t = byRoom[id][j];
            var li = node('li');
            var a = node('a', 'tool-row');
            a.href = stamp(t.url);
            a.rel = 'noopener';
            a.appendChild(node('span', 'tool-row-name', t.label || t.slug));
            if (t.blurb) a.appendChild(node('span', 'tool-row-blurb', t.blurb));
            li.appendChild(a);
            ul.appendChild(li);
          }
          sec.appendChild(ul);
          wrap.appendChild(sec);
        }
        if (!seq.length) {
          wrap.appendChild(node('p', 'micro',
            'The tool list is not in this page either. Reload to fetch a fresh copy of the site.'));
        }
        main.replaceChildren ? main.replaceChildren(wrap) : (main.innerHTML = '', main.appendChild(wrap));
      } catch (e) { /* a floor that throws is not a floor; fail silent */ }
    };
  </script>
  <script type="module" src="assets/app.e8d15b710b.js" onerror="window.__cccFloor()"></script>
