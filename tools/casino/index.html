<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="theme-color" content="#050608">
<meta name="description" content="Blufox Casino & Lounge — seven 3D tables and machines dealt by Ace. Play chips only: nothing to buy, nothing to win.">
<title>Blufox Casino & Lounge</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23070a0e'/%3E%3Ctext x='32' y='42' text-anchor='middle' font-family='Georgia' font-size='30' fill='%23e3c77e'%3EC3%3C/text%3E%3C/svg%3E">
<link rel="preload" as="image" href="assets/img/lounge-still.webp" media="(min-width: 700px)" crossorigin="anonymous">
<link rel="preload" as="image" href="assets/img/lounge-still-m.webp" media="(max-width: 699px)" crossorigin="anonymous">
<link rel="modulepreload" href="js/vendor/three.min.mjs">
<style>
@font-face{font-family:'Bodoni Moda';font-style:normal;font-weight:400 900;font-display:swap;src:url(assets/fonts/bodoni-moda-latin.woff2) format('woff2')}
@font-face{font-family:'Bodoni Moda';font-style:italic;font-weight:400 900;font-display:swap;src:url(assets/fonts/bodoni-moda-italic-latin.woff2) format('woff2')}
@font-face{font-family:'Archivo';font-style:normal;font-weight:100 900;font-stretch:62% 125%;font-display:swap;src:url(assets/fonts/archivo-latin.woff2) format('woff2')}
</style>
<link rel="stylesheet" href="casino.css">
<script type="module" src="js/main.mjs"></script>
</head>
<body>
<div id="app" data-view="boot">
  <div id="stage" aria-hidden="true"></div>
  <div id="anchors" aria-hidden="true"></div>
  <div id="vignette" aria-hidden="true"></div>

  <header id="topbar">
    <button id="home" class="brand" aria-label="Back to the lobby">
      <span class="brand-back" aria-hidden="true">‹</span>
      <span class="brand-mark">C<sup>3</sup></span>
      <span class="brand-type">BLUFOX<small>CASINO &amp; LOUNGE</small></span>
    </button>
    <div id="gametitle" aria-live="polite"></div>
    <div class="top-right">
      <button id="bank" class="bank" aria-label="Your play chips"><i class="coin" aria-hidden="true"></i><span id="balance">10,000</span></button>
      <button id="btn-challenges" class="ico" aria-label="Daily challenges"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 15.6 6.6 18.5l1.2-6L3.3 8.3l6.1-.7z"/></svg><b id="chal-badge" hidden>0</b></button>
      <button id="btn-board" class="ico" aria-label="Leaderboard"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h10v3h3v3a5 5 0 0 1-5 5h-.3A5 5 0 0 1 13 16.9V19h3v2H8v-2h3v-2.1A5 5 0 0 1 9.3 14H9a5 5 0 0 1-5-5V6h3zm0 5H6v1a3 3 0 0 0 1.4 2.5zM18 8h-1v3.5A3 3 0 0 0 18 9z"/></svg></button>
      <button id="btn-sound" class="ico" aria-label="Sound"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path class="w" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke-width="1.8"/></svg></button>
      <button id="btn-help" class="ico" aria-label="Rules and help"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 16h-2v-2h2zm2.1-7.7-.9.9A3.4 3.4 0 0 0 13 14h-2v-.5a4 4 0 0 1 1.2-2.8l1.2-1.3A2 2 0 1 0 10 8H8a4 4 0 1 1 7.1 2.3z"/></svg></button>
    </div>
  </header>

  <section id="lobby" aria-label="Choose a game">
    <div class="lobby-hero">
      <p class="eyebrow">THE C<sup>3</sup> PRIVATE LOUNGE · CHICAGO</p>
      <h1>A little luck. <em>A lot of game.</em></h1>
      <p class="lede">Seven tables, one host. Ace deals, you play — with play chips only.</p>
    </div>
    <div id="lobby-strip" class="lobby-strip"></div>
    <div id="tiles" class="tiles"></div>
    <p class="fine">Free play chips only · No purchases · No cash value · Your chips are saved on this device</p>
  </section>

  <div id="status" aria-live="polite"></div>
  <section id="console" aria-label="Table controls">
    <div id="betinfo" class="betinfo"></div>
    <div id="rack" class="rack" role="group" aria-label="Chip value"></div>
    <div id="actions" class="actions"></div>
  </section>

  <div id="banner" class="banner" aria-live="assertive"></div>
  <div id="toast" class="toast" aria-live="polite"></div>
  <div id="sheet" class="sheet"></div>

  <div id="loader">
    <div class="ld-mark">C<sup>3</sup></div>
    <div class="ld-title">BLUFOX <em>Casino &amp; Lounge</em></div>
    <div class="ld-bar"><i id="ld-fill"></i></div>
    <div id="ld-msg" class="ld-msg">Setting the tables…</div>
  </div>
  <noscript><p class="noscript">The casino needs JavaScript to deal cards and spin the wheel.</p></noscript>
</div>
</body>
</html>
