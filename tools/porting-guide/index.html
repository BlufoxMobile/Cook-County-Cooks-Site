<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#000000">
<title>PortPro — Porting Guide</title>
<!-- PortPro v3 (2026-10-03) — rebuilt in the CSG How To theme (black, brass, Bodoni Moda + Archivo).
     Everything is in this one file: the carrier data (DATA, researched 2026-10-03 from each
     carrier's own help pages, with third-party fallbacks labelled), the page, and a vendored
     QR encoder (qrcode-generator 2.0.4, MIT, Kazuhiko Arase). No third-party host is requested,
     so nothing can hold this document's `load`, which the site viewer (overlay.js) waits on.
     Fonts are the site's self-hosted Archivo + Bodoni Moda; build/fingerprint.mjs rewrites the
     ../../assets/fonts/*.woff2 names. To change a carrier, edit its row in DATA below.
     The page no longer uses assets/porting-guide.46fabd5ff5.css (the old Tailwind build); it is orphaned. -->
<style>
@font-face{font-family:'Archivo';font-style:normal;font-weight:300 700;font-stretch:62% 125%;font-display:swap;src:url(../../assets/fonts/archivo-latin.e3a28eade2.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Bodoni Moda';font-style:normal;font-weight:400 900;font-display:swap;src:url(../../assets/fonts/bodoni-moda-latin.c032219ef6.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Bodoni Moda';font-style:italic;font-weight:400 700;font-display:swap;src:url(../../assets/fonts/bodoni-moda-italic-latin.b737328c13.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
:root{
  --ink:#000;--ink-1:#07090c;--ink-2:#0d1116;--ink-3:#151b22;
  --line:rgba(255,255,255,.08);--line-2:rgba(255,255,255,.14);
  --text:#f2efe8;--text-2:#b9b4aa;--text-3:#7d7a74;
  --brass:#d4a94f;--brass-2:#f0cf86;--brass-dim:rgba(212,169,79,.16);
  --major:#5cc8ff;--prepaid:#ffb05c;--cable:#ff7eb6;--mvno:#b48cff;--voip:#5be3a0;--all:#d4a94f;
  --k-account:#5cc8ff;--k-pin:#f0cf86;--k-unlock:#5be3a0;--k-help:#c9c3ff;
  --warn:#ff8a65;--ok:#5be3a0;
  --display:'Bodoni Moda',Didot,'Times New Roman',serif;
  --sans:'Archivo',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --r:4px;--gut:16px;--max:1180px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:150px}
body{margin:0;background:var(--ink);color:var(--text);font:400 16px/1.6 var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(900px 500px at 85% -10%,rgba(212,169,79,.10),transparent 60%),radial-gradient(700px 500px at -10% 110%,rgba(92,200,255,.06),transparent 60%)}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--brass-2);outline-offset:2px;border-radius:2px}
.wrap{position:relative;z-index:1;max-width:var(--max);margin:0 auto;padding:0 var(--gut)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.hair{height:1px;background:linear-gradient(90deg,transparent,var(--brass) 20%,var(--brass) 80%,transparent);opacity:.45}

/* ---------- header ---------- */
header.top{position:sticky;top:0;z-index:20;background:rgba(0,0,0,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:14px;height:64px}
.brand{display:flex;align-items:baseline;gap:10px;text-decoration:none;white-space:nowrap}
.brand b{font:700 24px/1 var(--display)}
.brand b em{color:var(--brass-2)}
.brand span{font:600 10px/1 var(--sans);letter-spacing:.28em;text-transform:uppercase;color:var(--text-3)}
.search{position:relative;flex:1;max-width:520px;margin-left:auto}
.search input{width:100%;height:44px;padding:0 44px 0 42px;background:var(--ink-2);border:0;box-shadow:inset 0 0 0 1px var(--line-2);border-radius:999px;color:var(--text);font:500 15px var(--sans);-webkit-appearance:none;appearance:none}
.search input::-webkit-search-cancel-button{display:none}
.search input::placeholder{color:var(--text-3)}
.search input:focus{outline:none;box-shadow:inset 0 0 0 1px var(--brass)}
.search svg{position:absolute;left:15px;top:13px;width:18px;height:18px;stroke:var(--text-3)}
.search kbd{position:absolute;right:12px;top:11px;font:500 11px var(--mono);color:var(--text-3);border:1px solid var(--line-2);border-radius:4px;padding:2px 6px}
.search .clear{position:absolute;right:4px;top:2px;width:40px;height:40px;border-radius:50%;color:var(--text-2);display:none;font-size:20px}
.search.has .clear{display:block}.search.has kbd{display:none}
nav.cats{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:0 0 12px}
nav.cats::-webkit-scrollbar{display:none}
nav.cats a{flex:none;display:flex;align-items:center;gap:8px;height:38px;padding:0 16px;border-radius:999px;text-decoration:none;color:var(--text-2);font:600 14px var(--sans);box-shadow:inset 0 0 0 1px var(--line);transition:.15s}
nav.cats a i{width:8px;height:8px;border-radius:50%;background:var(--c)}
nav.cats a:hover{color:var(--text);box-shadow:inset 0 0 0 1px var(--line-2)}
nav.cats a[aria-current]{color:#000;background:var(--c);box-shadow:none}
nav.cats a[aria-current] i{background:#000}
nav.cats .gap{flex:none;width:1px;margin:8px 4px;background:var(--line-2)}

/* ---------- home ---------- */
.hero{padding:56px 0 34px}
.eyebrow{font:600 12px/1 var(--sans);letter-spacing:.28em;text-transform:uppercase;color:var(--brass)}
.hero h1{font:700 clamp(42px,8.4vw,92px)/.98 var(--display);letter-spacing:-.015em;margin:18px 0 18px;max-width:15ch}
.hero h1 em{background:linear-gradient(100deg,var(--brass) 0%,var(--brass-2) 40%,#fff6dc 50%,var(--brass-2) 60%,var(--brass) 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sheen 5s ease-in-out infinite}
@keyframes sheen{0%,100%{background-position:100% 0}50%{background-position:0 0}}
.hero p{max-width:58ch;color:var(--text-2);font-size:18px;margin:0}
.stats{display:flex;gap:28px;flex-wrap:wrap;margin-top:28px}
.stats div{display:flex;flex-direction:column}
.stats b{font:700 40px/1 var(--display);color:var(--text)}
.stats span{font:600 11px var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--text-3);margin-top:6px}
.quickpick{display:flex;flex-wrap:wrap;gap:8px;margin-top:26px}
.quickpick a{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px 0 6px;border-radius:999px;text-decoration:none;font:600 14px var(--sans);color:var(--text);box-shadow:inset 0 0 0 1px var(--line-2);background:var(--ink-1);transition:.15s}
.quickpick a:hover{box-shadow:inset 0 0 0 1px var(--c);transform:translateY(-1px)}
.mono{flex:none;display:grid;place-items:center;border-radius:50%;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c);font:700 12px/1 var(--sans);letter-spacing:.02em;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 45%,transparent)}
.quickpick .mono{width:28px;height:28px;font-size:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:14px}
.cat-card{position:relative;display:flex;flex-direction:column;gap:10px;min-height:180px;padding:24px;border-radius:6px;text-decoration:none;background:linear-gradient(160deg,var(--ink-2),var(--ink-1));box-shadow:inset 0 0 0 1px var(--line);overflow:hidden;transition:transform .2s,box-shadow .2s}
.cat-card::after{content:"";position:absolute;right:-60px;top:-60px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,var(--c),transparent 70%);opacity:.18;transition:.3s}
.cat-card:hover{transform:translateY(-2px);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 55%,transparent)}
.cat-card:hover::after{opacity:.32}
.cat-card .ico{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c)}
.cat-card .ico svg{width:24px;height:24px}
.cat-card h3{font:700 30px/1.05 var(--display);margin:6px 0 0}
.cat-card p{margin:0;color:var(--text-2);font-size:15px}
.cat-card .n{margin-top:auto;font:600 12px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--c)}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:56px 0 16px;flex-wrap:wrap}
.section-h h2{font:700 30px/1.1 var(--display);margin:0}
.section-h span,.section-h a{color:var(--text-3);font-size:14px}
.section-h a{color:var(--brass-2);text-decoration:none;font-weight:600}

/* ---------- carrier list ---------- */
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,360px),1fr));gap:10px}
.g-row{position:relative;overflow:hidden;display:flex;gap:14px;align-items:flex-start;padding:18px;border-radius:6px;text-decoration:none;background:var(--ink-1);box-shadow:inset 0 0 0 1px var(--line);transition:.15s}
.g-row:hover{background:var(--ink-2);box-shadow:inset 0 0 0 1px var(--line-2)}
.g-row .mono{width:42px;height:42px;font-size:13px}
.g-row h4{margin:0 0 4px;font:600 17px/1.3 var(--sans)}
.g-row p{margin:0;color:var(--text-2);font-size:14px;line-height:1.5}
.g-row .meta{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:6px;font:600 11px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;padding:5px 8px;border-radius:3px;background:var(--ink-3);color:var(--text-2);white-space:nowrap}
.tag.ok{background:rgba(91,227,160,.12);color:var(--ok)}
.tag.call{background:rgba(255,138,101,.12);color:var(--warn)}
.tag.pic{background:var(--brass-dim);color:var(--brass-2)}
.tag svg{width:12px;height:12px}
.cat-card,.g-row{--mx:50%;--my:50%}
.cat-card::before,.g-row::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .25s;background:radial-gradient(260px circle at var(--mx) var(--my),color-mix(in srgb,var(--c,var(--brass)) 22%,transparent),transparent 60%)}
.cat-card:hover::before,.g-row:hover::before{opacity:1}

/* ---------- category page ---------- */
.cat-head{padding:44px 0 24px;border-bottom:1px solid var(--line);margin-bottom:24px}
.cat-head h1{font:700 clamp(40px,7vw,72px)/1 var(--display);margin:12px 0 10px}
.cat-head h1 em{color:var(--c);font-style:normal}
.cat-head p{margin:0;color:var(--text-2);font-size:17px}

/* ---------- carrier page ---------- */
.crumbs{display:flex;gap:8px;align-items:center;padding:26px 0 0;font-size:14px;color:var(--text-3);flex-wrap:wrap}
.crumbs a{text-decoration:none;color:var(--text-2)}.crumbs a:hover{color:var(--text)}
.g-head{padding:18px 0 22px;display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center}
.g-head .mono{width:84px;height:84px;font:700 26px/1 var(--display)}
.g-head h1{font:700 clamp(34px,6vw,60px)/1.04 var(--display);margin:10px 0 0}
.g-head .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
@media(max-width:640px){.g-head{grid-template-columns:1fr;gap:12px}.g-head .mono{width:60px;height:60px;font-size:19px}}
.glance{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:0 0 22px}
@media(max-width:820px){.glance{grid-template-columns:1fr}}
.fact{position:relative;display:flex;flex-direction:column;gap:8px;padding:18px;border-radius:6px;text-decoration:none;background:linear-gradient(160deg,var(--ink-2),var(--ink-1));box-shadow:inset 0 0 0 1px var(--line);overflow:hidden;transition:.2s}
.fact::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--k)}
.fact:hover{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--k) 50%,transparent);transform:translateY(-2px)}
.fact small{font:700 11px var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--k)}
.fact p{margin:0;font-size:15px;line-height:1.45;color:var(--text)}
.fact .big{font:700 22px/1.1 var(--mono);color:var(--brass-2);letter-spacing:.02em}
.links{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 26px}
.qlink{position:relative;display:inline-flex;align-items:center;gap:10px;min-height:46px;padding:8px 16px 8px 12px;border-radius:999px;text-decoration:none;font:600 14px/1.25 var(--sans);background:var(--ink-1);box-shadow:inset 0 0 0 1px var(--line-2);transition:.15s;max-width:100%}
.qlink:hover{box-shadow:inset 0 0 0 1px var(--k);transform:translateY(-1px);color:#fff}
.qlink .k{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--k) 18%,transparent);color:var(--k)}
.qlink .k svg{width:14px;height:14px}
.qlink .l{min-width:0}
.qlink .l small{display:block;font:500 11px var(--sans);color:var(--text-3);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46ch}
.qlink .cam{flex:none;display:inline-flex;align-items:center;gap:4px;font:700 10px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--brass-2);background:var(--brass-dim);padding:4px 7px;border-radius:999px}
.qlink .cam svg{width:12px;height:12px}
.qlink .x{color:var(--text-3)}
.layout{display:grid;grid-template-columns:1fr;gap:32px;padding-bottom:80px}
@media(min-width:980px){.layout{grid-template-columns:minmax(0,1fr) 270px}}
aside.side{display:none}
@media(min-width:980px){aside.side{display:block;position:sticky;top:140px;align-self:start}}
.toc h5,.qr h5{margin:0 0 10px;font:600 11px var(--sans);letter-spacing:.24em;text-transform:uppercase;color:var(--text-3)}
.toc a{display:block;padding:7px 0 7px 14px;border-left:1px solid var(--line-2);text-decoration:none;color:var(--text-2);font-size:14px}
.toc a:hover,.toc a.on{color:var(--text);border-color:var(--c)}
.qr{margin-top:26px;padding:16px;border-radius:8px;background:var(--ink-1);box-shadow:inset 0 0 0 1px var(--line)}
.qr .code{background:#fff;border-radius:6px;padding:10px;width:100%;max-width:200px;aspect-ratio:1}
.qr .code svg{display:block;width:100%;height:100%}
.qr p{margin:10px 0 0;color:var(--text-2);font-size:13px;line-height:1.45}
.qr-inline{display:flex;gap:16px;align-items:center;margin:0 0 26px}
.qr-inline .qr{margin:0;display:flex;gap:14px;align-items:center;width:100%}
.qr-inline .code{width:120px;flex:none}
@media(min-width:980px){.qr-inline{display:none}}
.g-sec{margin-bottom:44px;--c:var(--k)}
.g-sec h2{display:flex;align-items:center;gap:12px;font:700 28px/1.15 var(--display);margin:0 0 6px}
.g-sec h2::before{content:"";width:22px;height:2px;background:var(--k)}
.g-sec .intro{color:var(--text-2);margin:0 0 16px;font-size:17px}
ol.steps{list-style:none;margin:0;padding:0;display:grid;gap:10px}
ol.steps>li{position:relative;display:grid;grid-template-columns:52px 1fr;gap:14px;padding:16px 18px;border-radius:6px;background:var(--ink-1);box-shadow:inset 0 0 0 1px var(--line);transition:background .25s,box-shadow .25s}
ol.steps>li.hit{box-shadow:inset 0 0 0 1px var(--brass);animation:glow 1.6s}
@keyframes glow{0%{background:rgba(212,169,79,.18)}100%{background:var(--ink-1)}}
.num{position:relative;display:grid;place-items:center;width:44px;height:44px;border-radius:50%;font:700 19px var(--display);color:#000;background:var(--k);transition:transform .2s cubic-bezier(.3,1.6,.5,1),background .2s}
.num:hover{transform:scale(1.08)}
.num svg{position:absolute;width:22px;height:22px;opacity:0;transform:scale(.4);transition:.25s cubic-bezier(.3,1.6,.5,1)}
.num span{transition:.2s}
li.done .num{background:var(--ok);animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
li.done .num span{opacity:0;transform:scale(.4)}
li.done .num svg{opacity:1;transform:scale(1)}
@keyframes pop{40%{transform:scale(1.25);box-shadow:0 0 0 10px rgba(91,227,160,.18)}}
li.done{background:rgba(91,227,160,.035)!important;box-shadow:inset 0 0 0 1px rgba(91,227,160,.28)!important}
li.done .do{color:var(--text-2)}
.step-body{min-width:0;align-self:center}
.step-body .do{margin:0;font-size:17px;line-height:1.5}
.sep{display:inline-block;margin:0 .3em;color:var(--brass);font-style:normal;font-weight:700}
code,.code-in{font:500 .9em var(--mono);background:var(--ink-3);color:var(--brass-2);padding:2px 6px;border-radius:3px;white-space:nowrap}
.step-body a,.panel a,.callout a,.tbl a,.fact a{color:var(--brass-2);text-decoration:underline;text-decoration-color:rgba(240,207,134,.4);text-underline-offset:2px;word-break:break-word}
.callout{margin-top:12px;padding:12px 14px;border-radius:4px;font-size:15px;background:var(--ink-2);box-shadow:inset 3px 0 0 var(--brass)}
.callout.warn{box-shadow:inset 3px 0 0 var(--warn)}
.callout.ok{box-shadow:inset 3px 0 0 var(--ok)}
.callout .lbl{display:block;font:700 11px var(--sans);letter-spacing:.18em;text-transform:uppercase;margin-bottom:4px;color:var(--brass-2)}
.callout.warn .lbl{color:var(--warn)}
.callout.ok .lbl{color:var(--ok)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px;margin-top:14px}
.kv div{padding:12px 14px;border-radius:6px;background:var(--ink-2);box-shadow:inset 0 0 0 1px var(--line)}
.kv small{display:block;font:700 10px var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--k);margin-bottom:4px}
.kv p{margin:0;font-size:15px;line-height:1.45}
.unconf{color:var(--text-3);font-style:italic}
.panel{padding:20px;border-radius:6px;background:var(--ink-1);box-shadow:inset 0 0 0 1px var(--line);margin-bottom:28px}
.panel h3{margin:0 0 10px;font:700 22px var(--display)}
.panel ul{margin:0;padding-left:20px;color:var(--text-2)}
.panel li+li{margin-top:7px}
.panel.sources ul{font-size:13px;columns:2 300px;column-gap:28px}
.panel.sources li{break-inside:avoid;word-break:break-all}
.phone{display:inline-flex;align-items:center;gap:10px;height:46px;padding:0 18px;border-radius:999px;background:var(--brass);color:#120d03!important;text-decoration:none!important;font:700 16px var(--sans);letter-spacing:.02em;margin:6px 8px 0 0}
.phone svg{width:16px;height:16px}
.conf{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:6px;margin:0 0 22px;font-size:14px;color:var(--text-2);background:var(--ink-1);box-shadow:inset 0 0 0 1px var(--line)}
.conf b{color:var(--text)}
.conf i{flex:none;width:10px;height:10px;border-radius:50%;margin-top:6px;background:var(--cc);box-shadow:0 0 12px var(--cc)}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
.pager a{padding:16px;border-radius:6px;text-decoration:none;box-shadow:inset 0 0 0 1px var(--line)}
.pager a:hover{box-shadow:inset 0 0 0 1px var(--line-2)}
.pager small{display:block;color:var(--text-3);font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.pager .nx{text-align:right}

/* progress dock + walkthrough (same as CSG How To) */
.dock{position:sticky;top:112px;z-index:15;margin:0 0 26px;padding:12px 14px;border-radius:8px;background:rgba(10,13,17,.86);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:inset 0 0 0 1px var(--line-2),0 10px 30px rgba(0,0,0,.4);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.dock .meter{flex:1;min-width:140px}
.dock .meter small{display:flex;justify-content:space-between;font-size:12px;color:var(--text-3);letter-spacing:.06em;margin-bottom:6px}
.dock .meter small b{color:var(--text)}
.bar-o{height:6px;border-radius:99px;background:var(--ink-3);overflow:hidden}
.bar-i{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--c),var(--ok));transition:width .6s cubic-bezier(.16,1,.3,1)}
.go{display:inline-flex;align-items:center;gap:10px;height:46px;padding:0 20px;border-radius:999px;background:var(--c);color:#000;font-weight:700;font-size:15px;letter-spacing:.02em;position:relative;overflow:hidden;transition:transform .15s}
.go:hover{transform:translateY(-1px)}
.go::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);transform:translateX(-120%);animation:sweep 3.2s 1s ease-in-out infinite}
@keyframes sweep{60%,100%{transform:translateX(120%)}}
.go svg{width:18px;height:18px}
.ghost{height:46px;padding:0 14px;border-radius:999px;color:var(--text-2);font-size:14px;box-shadow:inset 0 0 0 1px var(--line-2)}
.ghost:hover{color:var(--text)}
@media(max-width:640px){.dock{top:148px;padding:10px 12px;gap:10px}.go{flex:1;justify-content:center}.ghost{display:none}}
#wk{position:fixed;inset:0;z-index:70;display:none;flex-direction:column;background:radial-gradient(1200px 600px at 50% -10%,color-mix(in srgb,var(--c) 14%,transparent),transparent 60%),#000;color:var(--text)}
#wk.on{display:flex;animation:wkIn .5s cubic-bezier(.16,1,.3,1)}
@keyframes wkIn{from{opacity:0;transform:scale(1.04)}}
.wk-top{display:flex;align-items:center;gap:14px;padding:14px var(--gut);border-bottom:1px solid var(--line)}
.wk-top .t{flex:1;min-width:0}
.wk-top .t b{display:block;font:700 18px var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk-top .t small{color:var(--c);font:600 11px var(--sans);letter-spacing:.18em;text-transform:uppercase}
.wk-x{width:44px;height:44px;border-radius:50%;background:var(--ink-3);font-size:22px;flex:none}
.wk-prog{height:4px;background:var(--ink-3)}
.wk-prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--c),var(--ok));transition:width .5s cubic-bezier(.16,1,.3,1);box-shadow:0 0 18px var(--c)}
.wk-stage{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:22px var(--gut) 30px}
.wk-card{max-width:860px;margin:0 auto;--c:var(--k)}
.wk-card.in-r{animation:inR .45s cubic-bezier(.16,1,.3,1)}
.wk-card.in-l{animation:inL .45s cubic-bezier(.16,1,.3,1)}
@keyframes inR{from{opacity:0;transform:translateX(60px);filter:blur(8px)}}
@keyframes inL{from{opacity:0;transform:translateX(-60px);filter:blur(8px)}}
.wk-count{display:flex;align-items:center;gap:12px;color:var(--text-3);font:600 12px var(--sans);letter-spacing:.16em;text-transform:uppercase}
.wk-count .big{display:grid;place-items:center;width:58px;height:58px;border-radius:50%;background:var(--k);color:#000;font:700 26px var(--display);letter-spacing:0;animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
.wk-text{font:600 clamp(22px,3.4vw,32px)/1.3 var(--sans);margin:18px 0 6px;letter-spacing:-.005em}
.wk-text a{color:var(--brass-2)}
.wk-nav{display:flex;gap:10px;padding:12px var(--gut) calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:rgba(0,0,0,.6)}
.wk-nav button{height:56px;border-radius:12px;font-weight:700;font-size:16px}
.wk-back{width:120px;box-shadow:inset 0 0 0 1px var(--line-2);color:var(--text-2)}
.wk-back:disabled{opacity:.35}
.wk-next{flex:1;background:var(--c);color:#000;display:flex;align-items:center;justify-content:center;gap:10px}
.wk-next svg{width:20px;height:20px}
.wk-hint{color:var(--text-3);font-size:12px;text-align:center;margin-top:18px}
.wk-done{text-align:center;padding:10vh 0}
.wk-done .ring{width:120px;height:120px;margin:0 auto 26px;border-radius:50%;display:grid;place-items:center;background:var(--ok);color:#000;animation:pop .7s cubic-bezier(.3,1.6,.5,1);position:relative}
.wk-done .ring::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--ok);animation:ripple 1.6s ease-out infinite}
@keyframes ripple{to{inset:-40px;opacity:0}}
.wk-done .ring svg{width:56px;height:56px}
.wk-done h2{font:700 clamp(32px,6vw,54px)/1.05 var(--display);margin:0 0 10px}
.wk-done p{color:var(--text-2)}
.spark{position:fixed;width:8px;height:8px;border-radius:2px;pointer-events:none;z-index:80;animation:spark 1.1s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}

/* ---------- search ---------- */
.s-head{padding:40px 0 20px}
.s-head h1{font:700 clamp(32px,5vw,48px)/1.1 var(--display);margin:0}
.s-head p{color:var(--text-2);margin:8px 0 0}
.hits{display:grid;gap:10px;padding-bottom:80px}
.hit{display:block;padding:18px;border-radius:6px;text-decoration:none;background:var(--ink-1);box-shadow:inset 0 0 0 1px var(--line)}
.hit:hover{background:var(--ink-2)}
.hit .where{display:flex;gap:8px;align-items:center;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--c);font-weight:600}
.hit h4{margin:6px 0 4px;font:600 18px/1.3 var(--sans)}
.hit p{margin:0;color:var(--text-2);font-size:15px}
mark{background:rgba(240,207,134,.25);color:var(--brass-2);border-radius:2px;padding:0 2px}


/* ---------- quick table ---------- */
.tbl{margin-top:14px;border-radius:6px;overflow:auto;box-shadow:inset 0 0 0 1px var(--line);max-height:76vh}
.tbl table{width:100%;border-collapse:collapse;font-size:14px;min-width:980px}
.tbl th{position:sticky;top:0;z-index:1;text-align:left;font:600 11px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--brass);background:var(--ink-2);padding:12px 14px;border-bottom:1px solid var(--line-2)}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--text-2);line-height:1.45}
.tbl td:first-child{color:var(--text);font-weight:600;white-space:nowrap}
.tbl td:first-child a{color:var(--text);text-decoration:none;display:flex;align-items:center;gap:10px}
.tbl td:first-child .mono{width:28px;height:28px;font-size:10px}
.tbl tbody tr:nth-child(even) td{background:rgba(255,255,255,.015)}
.tbl tbody tr:hover td{background:rgba(212,169,79,.06)}
@media(max-width:640px){
  .tbl{box-shadow:none;overflow:visible;max-height:none}
  .tbl table{min-width:0}
  .tbl thead{display:none}
  .tbl table,.tbl tbody,.tbl tr,.tbl td{display:block;width:100%}
  .tbl tr{margin-bottom:10px;border-radius:6px;background:var(--ink-1);box-shadow:inset 0 0 0 1px var(--line);padding:6px 0}
  .tbl td{border:0;padding:6px 14px}
  .tbl td::before{content:attr(data-h);display:block;font:600 10px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--brass)}
  .tbl td:first-child::before{content:none}
  .tbl tbody tr:nth-child(even) td{background:none}
}

/* ---------- motion ---------- */
#view{view-transition-name:view}
::view-transition-old(view){animation:vtOut .28s cubic-bezier(.4,0,1,1) both}
::view-transition-new(view){animation:vtIn .55s cubic-bezier(.16,1,.3,1) both}
@keyframes vtOut{to{opacity:0;transform:translateY(-14px) scale(.985);filter:blur(6px)}}
@keyframes vtIn{from{opacity:0;transform:translateY(28px) scale(.975);filter:blur(10px)}}
#view.enter{animation:vtIn .55s cubic-bezier(.16,1,.3,1) both}
.rise{animation:rise .6s cubic-bezier(.16,1,.3,1) both;animation-delay:calc(min(var(--i,0),14) * 40ms)}
@keyframes rise{from{opacity:0;transform:translateY(22px) scale(.98)}}

/* ---------- screen-by-screen reels (v3.1) ---------- */
.reel{margin-top:18px;border-radius:10px;background:linear-gradient(160deg,var(--ink-2),var(--ink-1));box-shadow:inset 0 0 0 1px var(--line-2),0 18px 50px rgba(0,0,0,.45);overflow:hidden}
.reel-h{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.reel-h .ci{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--k) 18%,transparent);color:var(--k)}
.reel-h .ci svg{width:18px;height:18px}
.reel-h div{flex:1;min-width:0}
.reel-h b{display:block;font:700 16px/1.25 var(--sans)}
.reel-h small{display:block;color:var(--text-3);font-size:12px;letter-spacing:.04em}
.rb{flex:none;font:700 10px var(--sans);letter-spacing:.14em;text-transform:uppercase;padding:5px 8px;border-radius:999px;background:var(--ink-3);color:var(--text-2)}
.rb.Official{background:rgba(91,227,160,.12);color:var(--ok)}
.reel-b{display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr);gap:22px;padding:18px;align-items:center}
@media(max-width:720px){.reel-b{grid-template-columns:1fr;gap:14px;padding:14px}}
.stage{display:grid;place-items:center;min-height:200px;touch-action:pan-y}
.dev{position:relative;border-radius:30px;padding:9px;background:#0b0d10;box-shadow:inset 0 0 0 1.5px #2a2f37,0 0 0 1px #000,0 24px 60px rgba(0,0,0,.6),0 0 80px color-mix(in srgb,var(--k) 14%,transparent);transition:width .45s cubic-bezier(.16,1,.3,1)}
.dev.phone{height:min(64vh,560px);width:calc((min(64vh,560px) - 18px) * var(--ar) + 18px)}
.dev.wide{border-radius:10px;padding:26px 6px 6px;width:min(640px,100%)}
.reel.isw .reel-b{grid-template-columns:1fr}
.reel.isw .stage{min-height:0}
.dev.wide::before{content:"";position:absolute;left:12px;top:10px;width:7px;height:7px;border-radius:50%;background:#ff5f57;box-shadow:12px 0 #febc2e,24px 0 #28c840}
@media(max-width:720px){.dev.phone{height:min(58vh,500px);width:calc((min(58vh,500px) - 18px) * var(--ar) + 18px)}}
.scr{position:relative;width:100%;height:100%;border-radius:22px;overflow:hidden;background:#e9ecf0}
.dev.wide .scr{height:auto;aspect-ratio:var(--ar);border-radius:4px}
.scr img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;cursor:zoom-in}
.scr img.in{animation:scrIn .5s cubic-bezier(.16,1,.3,1)}
.scr img.in.back{animation-name:scrInB}
@keyframes scrIn{from{opacity:0;transform:translateX(18%) scale(.96);filter:blur(6px)}}
@keyframes scrInB{from{opacity:0;transform:translateX(-18%) scale(.96);filter:blur(6px)}}
.tap{position:absolute;width:15%;aspect-ratio:1;max-width:64px;transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;border:3px solid var(--brass-2);box-shadow:0 0 0 3px rgba(0,0,0,.35),0 0 24px var(--brass);opacity:0}
.tap.on{opacity:1;animation:tapIn .5s .25s cubic-bezier(.3,1.6,.5,1) both}
.tap.on::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:2px solid var(--brass-2);animation:tapPulse 1.6s .7s ease-out infinite}
@keyframes tapIn{from{opacity:0;transform:translate(-50%,-50%) scale(2.2)}}
@keyframes tapPulse{to{inset:-22px;opacity:0}}
.swp{position:absolute;left:50%;bottom:12%;transform:translateX(-50%);padding:7px 12px;border-radius:999px;background:rgba(0,0,0,.72);color:#fff;font:700 11px var(--sans);letter-spacing:.1em;text-transform:uppercase;opacity:0;pointer-events:none;display:flex;gap:6px;align-items:center}
.swp.on{opacity:1;animation:swpA 1.4s .3s ease-in-out infinite}
@keyframes swpA{0%,100%{transform:translate(-50%,8px)}50%{transform:translate(-50%,-10px)}}
.shim{position:absolute;inset:0;background:linear-gradient(100deg,#dfe3e8 30%,#f4f6f8 50%,#dfe3e8 70%);background-size:300% 100%;animation:shim 1.2s linear infinite}
@keyframes shim{to{background-position:-150% 0}}
.rs{min-width:0}
.rc{display:flex;align-items:baseline;gap:8px;font:600 12px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--text-3)}
.rc b{font:700 34px/1 var(--display);letter-spacing:0;color:var(--k)}
.rcap{font:600 19px/1.45 var(--sans);margin:10px 0 0;color:var(--text)}
.rcap.in{animation:rise .45s cubic-bezier(.16,1,.3,1)}
.rnote{margin:8px 0 0;color:var(--text-2);font-size:14px}
.rnote:empty{display:none}
.rbtns{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.rbtns button{height:44px;min-width:44px;padding:0 14px;border-radius:999px;font-weight:700;font-size:14px;box-shadow:inset 0 0 0 1px var(--line-2);color:var(--text)}
.rbtns button:hover{box-shadow:inset 0 0 0 1px var(--k)}
.rbtns .rp{background:var(--k);color:#000;box-shadow:none;display:inline-flex;align-items:center;gap:8px}
.rbtns .rp svg{width:14px;height:14px}
.rbtns button:disabled{opacity:.3}
.rdots{display:flex;gap:5px;flex-wrap:wrap;margin-top:14px}
.rdots i{width:22px;height:4px;border-radius:99px;background:var(--ink-3);cursor:pointer;transition:background .3s}
.rdots i.on{background:var(--k)}
.rdots i.seen{background:color-mix(in srgb,var(--k) 45%,var(--ink-3))}
.rsrc{display:inline-block;margin-top:14px;font-size:12px;color:var(--text-3)!important;text-decoration:none!important}
.rsrc:hover{color:var(--brass-2)!important}
.more-reels{margin-top:10px}
/* lightbox */
#lb{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.94);display:none;place-items:center;padding:20px}
#lb.on{display:grid;animation:wkIn .35s cubic-bezier(.16,1,.3,1)}
#lb .lbw{position:relative;display:block;width:fit-content;margin:0 auto;max-width:min(96vw,1100px);max-height:86vh}
#lb img{display:block;max-width:min(96vw,1100px);max-height:86vh;border-radius:8px;background:#fff}
#lb .tap{width:9%;max-width:70px}
#lb p{color:var(--text-2);text-align:center;font-size:15px;max-width:70ch;margin:14px auto 0}
#lb .x{position:absolute;top:14px;right:14px;width:46px;height:46px;border-radius:50%;background:var(--ink-3);font-size:24px;z-index:2}
#lb .nv{position:absolute;top:50%;transform:translateY(-50%);width:52px;height:52px;border-radius:50%;background:rgba(21,27,34,.9);font-size:26px;z-index:2}
#lb .nv.l{left:14px}#lb .nv.r{right:14px}

footer{padding:40px 0 60px;color:var(--text-3);font-size:13px;border-top:1px solid var(--line)}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
@media(max-width:640px){
  .bar{height:auto;flex-wrap:wrap;padding:12px 0 10px;gap:10px}
  .brand b{font-size:21px}
  .brand span{display:none}
  .search{max-width:none;flex-basis:100%;order:3}
  .search kbd{display:none}
  .hero{padding:34px 0 22px}
  .hero p{font-size:16px}
  .stats b{font-size:32px}
  ol.steps>li{grid-template-columns:40px 1fr;gap:12px;padding:14px}
  .num{width:36px;height:36px;font-size:16px}
  html{scroll-padding-top:170px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="wrap">
      <div class="bar">
        <a class="brand" href="#/"><b>Port<em>Pro</em></b><span>Blufox Mobile</span></a>
        <div class="search" id="search">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <label class="sr" for="q">Search every carrier</label>
          <input id="q" type="search" placeholder="Search a carrier, a code, a step…" autocomplete="off" enterkeyhint="search">
          <kbd>/</kbd>
          <button class="clear" id="q-clear" aria-label="Clear search">×</button>
        </div>
      </div>
      <nav class="cats" id="cats" aria-label="Carrier menus"></nav>
    </div>
  </header>
  <main id="view" class="wrap" tabindex="-1"></main>
  <footer><div class="wrap"><span>PortPro · For Blufox Mobile team members · Carrier info checked <span id="upd"></span> — carriers change these often, so confirm on the carrier's page.</span><span>Never ask a customer to read you their password.</span></div></footer>
</div>

</div>

nt passcode; the PIN comes by text"],"format":"not confirmed (AT&T doesn't state the length)","expires":"4 days (14 days for business accounts)","dial":"*PORT (*7678); requires the account passcode","lockToDisable":"Wireless Account Lock"},"unlock":{"summary":"Postpaid phones unlock once bought more than 60 days ago, paid in full, not lost or stolen, with the bill not past due. Eligible Apple, Samsung and Google phones unlock on their own.","steps":["Confirm 60+ days since purchase and an installment balance of $0","Confirm the bill isn't past due","Apple, Samsung or Google: should unlock automatically; check in myAT&T > device","Other phones: submit a request at att.com/deviceunlock","iPhone check: Settings > General > About > Carrier Lock"],"postpaid":"Bought 60+ days ago, paid in full (installment balance $0), not lost or stolen or tied to fraud, not active on another AT&T account, and the bill not past due. Eligible Apple, Samsung and Google phones unlock automatically. Apple Watch is always unlocked. Article last updated June 29, 2026.","prepaid":"See AT&T Prepaid: 12 months of paid service"},"support":{"phone":"800.331.0500","note":"Number printed on AT&T's transfer-PIN article. Or call 611 from the AT&T phone."},"links":[{"label":"Get a Number Transfer PIN","url":"https://www.att.com/support/article/wireless/KM1447526/","kind":"pin","verified":true,"hasPictures":false},{"label":"Request PIN in AT&T app (step-by-step screenshots)","url":"https://www.att.com/device-support/article/152040/att/app-myatt-android-smartphone/","kind":"pin","verified":true,"hasPictures":true},{"label":"Wireless Account Lock (turn off)","url":"https://www.att.com/support/article/wireless/000102016/","kind":"pin","verified":true,"hasPictures":false},{"label":"Wireless Account Lock on/off (iPhone, screenshots)","url":"https://www.att.com/device-support/article/151990/apple/iphone-17-pro-max/","kind":"pin","verified":true,"hasPictures":true},{"label":"Find account number","url":"https:// const initials=n=>{const w=n.replace(/\(.*?\)/g,'').replace(/&/g,'').split(/[\s-]+/).filter(Boolean);return (w.length>1?(w[0][0]+w[1][0]):w[0].slice(0,2)).toUpperCase()};
const isUnk=s=>!s||/^(not confirmed|not stated|not applicable)/i.test(s);
const host=u=>{try{return new URL(u).hostname.replace(/^www\./,'')}catch(_){return u}};

/* text → html: escape, then make the useful bits live */
function rich(s){
  let h=esc(s);
  // tap paths  "Account > Settings"  →  Account › Settings
  h=h.replace(/\s+&gt;\s+/g,'<i class="sep">›</i>');
  // dial / text codes
  h=h.replace(/([*#]PORT\s*\([*#]7678\)|\*#06#|[*#]PORT(?:AR)?|\*611|\*7678|#7678|\b611611\b|\b(?:NTP|LINELOCK|IMEI)\b(?= to))/g,'<code>$1</code>');
  // phone numbers → tel:
  h=h.replace(/(?<![\d/=.-])(1[-.\s]?)?(\(?\d{3}\)?[-.\s]?\d{3}[-.\s]\d{4})(?![\d])/g,(m)=>{const d=m.replace(/\D/g,'');const t=d.length===10?'+1'+d:'+'+d;return `<a href="tel:${t}">${m}</a>`;});
  // bare domains / paths → links (not emails)
  h=h.replace(/(?<![@\w\/.-])((?:[a-z0-9-]+\.)+(?:com|net|us|org)(?:\/[\w\-./?=&#%]*[\w\/])?)/gi,(m)=>`<a href="https://${m}" target="_blank" rel="noopener">${m}</a>`);
  return h;
}
const unk=s=>isUnk(s)?`<span class="unconf">${esc(s||'Not published by the carrier')}</span>`:rich(s);

let LASTA='', CUR=null, DONE=new Set();
function route(){
  for(const k in REELS){ if(REELS[k].timer) clearInterval(REELS[k].timer); delete REELS[k]; }
  const h=decodeURIComponent(location.hash.replace(/^#\/?/,''));
  const [a,b]=h.split('/');
  const curCat = a==='carrier' ? byId[(b||'').split('~')[0]]?.type : a;
  document.querySelectorAll('#cats a').forEach(x=>x.toggleAttribute('aria-current',x.dataset.cat===(curCat||'home')));
  const prevA=LASTA; LASTA=a||'';
  if(a==='search'){ const anim=prevA!=='search'; return renderSearch(b||'',anim); }
  if(a==='carrier') return renderCarrier(b||'');
  if(a==='table') return renderTable();
  if(a && catOf(a)) return renderCat(a);
  renderHome();
}
function setView(html,focusTop=true,anim=true,after=null){
  const apply=()=>{ $('#view').innerHTML=html; if(focusTop) window.scrollTo(0,0); if(after) after(); };
  if(!anim||RM){ apply(); }
  else if(document.startViewTransition && setView.ready){ document.startViewTransition(apply); }
  else { apply(); const v=$('#view'); v.classList.remove('enter'); void v.offsetWidth; v.classList.add('enter'); }
  setView.ready=true;
}

function paintDock(){
  if(!CUR) return; const st=allSteps(CUR), n=st.filter(x=>DONE.has(x.id)).length;
  const b=document.querySelector('.dock .bar-i'); if(!b) return;
  b.style.width=(st.length?n/st.length*100:0)+'%';
  document.querySelector('.dock .cnt').textContent=`${n} of ${st.length} done`;
  document.querySelector('.dock .go b').textContent=n&&n<st.length?'Resume step-by-step':'Start step-by-step';
}

/* ---------- screen-by-screen reels ---------- */
const PLOADS={};
function loadShots(id){
  if(PLOADS[id]) return PLOADS[id];
  return PLOADS[id]=new Promise(res=>{ const s=document.createElement('script'); s.src='shots-'+id+'.js'; s.onload=()=>res(true); s.onerror=()=>{ delete PLOADS[id]; res(false); }; document.head.appendChild(s); });
}
const REELS={}; let RK=0;
function reelHtml(q,k,bundle){
  const key='r'+(++RK); REELS[key]={q,i:0,bundle,timer:null,seen:new Set([0])};
  const n=q.screens.length;
  return `<div class="reel rise" data-reel="${key}" style="--k:var(--k-${k})">
    <div class="reel-h"><span class="ci">${SV.cam}</span><div><b>See it on screen</b><small>${esc(q.title)} · ${n} screen${n===1?'':'s'}</small></div><span class="rb ${q.label.replace(/\W/g,'')}">${esc(q.label)}</span></div>
    <div class="reel-b"><div class="stage"><div class="dev"><div class="scr"><div class="shim"></div><img alt=""><i class="tap"></i><span class="swp"></span></div></div></div>
    <div class="rs"><div class="rc"><b class="rn">1</b><span>of ${n}</span></div><p class="rcap"></p><p class="rnote"></p>
      <div class="rbtns"><button class="rprev" aria-label="Previous screen">‹</button>${n>1?`<button class="rp">${SV.play}<span>Play</span></button>`:''}<button class="rnext" aria-label="Next screen">›</button><button class="rzoom">Enlarge</button></div>
      ${n>1?`<div class="rdots">${q.screens.map((_,j)=>`<i data-j="${j}"></i>`).join('')}</div>`:''}
      <a class="rsrc" href="${esc(q.source)}" target="_blank" rel="noopener">Screens from ${esc(host(q.source))} ↗</a></div></div></div>`;
}
function reelsFor(list,k,bundle){
  if(!list||!list.length) return '';
  return list.map(q=>reelHtml(q,k,bundle)).join('');
}
function paintReel(el,dir=0){
  const R=REELS[el.dataset.reel]; if(!R) return;
  const sc=R.q.screens[R.i], n=R.q.screens.length;
  const dev=el.querySelector('.dev'), img=el.querySelector('.scr img'), tap=el.querySelector('.scr .tap'), sw=el.querySelector('.swp');
  const wide=sc.w>sc.h*1.15; el.classList.toggle('isw',wide); dev.classList.toggle('wide',wide); dev.classList.toggle('phone',!wide); dev.style.setProperty('--ar',(sc.w/sc.h).toFixed(4));
  const src=(self.PPS||{})[sc.img];
  if(src){ el.querySelector('.shim')?.remove(); img.src=src; img.alt=sc.caption||R.q.title; img.classList.remove('in','back'); if(dir){ void img.offsetWidth; img.classList.add('in'); if(dir<0) img.classList.add('back'); } }
  tap.classList.remove('on'); if(sc.tap){ tap.style.left=(sc.tap.x*100)+'%'; tap.style.top=(sc.tap.y*100)+'%'; void tap.offsetWidth; tap.classList.add('on'); }
  sw.classList.remove('on'); if(sc.swipe){ sw.textContent=sc.swipe==='swipe_up'?'↑ Swipe up':sc.swipe==='swipe_down'?'↓ Swipe down':sc.swipe==='swipe_left'?'← Swipe left':'→ Swipe right'; void sw.offsetWidth; sw.classList.add('on'); }
  el.querySelector('.rn').textContent=R.i+1;
  const cap=el.querySelector('.rcap'), prevCap=cap.dataset.t||'';
  cap.innerHTML=rich(sc.caption||''); cap.dataset.t=sc.caption||'';
  if(dir&&prevCap!==(sc.caption||'')){ cap.classList.remove('in'); void cap.offsetWidth; cap.classList.add('in'); }
  el.querySelector('.rnote').innerHTML=sc.note?rich(sc.note):'';
  el.querySelector('.rprev').disabled=R.i===0; el.querySelector('.rnext').disabled=R.i===n-1;
  R.seen.add(R.i); el.querySelectorAll('.rdots i').forEach((d,j)=>{ d.classList.toggle('on',j===R.i); d.classList.toggle('seen',R.seen.has(j)&&j!==R.i); });
  if(LB.el===el) lbPaint();
}
function reelGo(el,to,user=true){
  const R=REELS[el.dataset.reel]; if(!R) return; const n=R.q.screens.length;
  if(user) reelStop(el);
  const j=Math.max(0,Math.min(n-1,to)); if(j===R.i) return; const dir=j>R.i?1:-1; R.i=j; paintReel(el,dir);
}
function reelStop(el){ const R=REELS[el.dataset.reel]; if(R&&R.timer){ clearInterval(R.timer); R.timer=null; const b=el.querySelector('.rp'); if(b) b.innerHTML=`${SV.play}<span>Play</span>`; } }
function reelPlay(el){
  const R=REELS[el.dataset.reel]; if(!R) return; if(R.timer) return reelStop(el);
  if(R.i>=R.q.screens.length-1){ R.i=0; paintReel(el,-1); }
  el.querySelector('.rp').innerHTML=`<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg><span>Pause</span>`;
  R.timer=setInterval(()=>{ if(!document.body.contains(el)) return clearInterval(R.timer); if(R.i>=R.q.screens.length-1) return reelStop(el); reelGo(el,R.i+1,false); },3200);
}
function initReels(){
  const els=[...document.querySelectorAll('.reel[data-reel]')]; if(!els.length) return;
  const bundles=[...new Set(els.map(e=>REELS[e.dataset.reel]?.bundle).filter(Boolean))];
  els.forEach(el=>paintReel(el,0));
  bundles.forEach(b=>loadShots(b).then(ok=>{ els.filter(e=>REELS[e.dataset.reel]?.bundle===b).forEach(e=>{ if(ok) paintReel(e,0); else { const sh=e.querySelector('.shim'); if(sh) sh.style.animation='none'; e.querySelector('.rcap').textContent='Screens could not load. Open the source link below.'; } }); }));
  els.forEach(el=>{
    let x0=null; const st=el.querySelector('.stage');
    st.addEventListener('touchstart',e=>{x0=e.touches[0].clientX},{passive:true});
    st.addEventListener('touchend',e=>{ if(x0==null) return; const dx=e.changedTouches[0].clientX-x0; x0=null; if(Math.abs(dx)>50){ const R=REELS[el.dataset.reel]; reelGo(el,R.i+(dx<0?1:-1)); } },{passive:true});
  });
}
document.addEventListener('click',e=>{
  const el=e.target.closest('.reel[data-reel]'); if(!el) return; const R=REELS[el.dataset.reel];
  if(e.target.closest('.rprev')) return reelGo(el,R.i-1);
  if(e.target.closest('.rnext')) return reelGo(el,R.i+1);
  if(e.target.closest('.rp')) return reelPlay(el);
  const d=e.target.closest('.rdots i'); if(d) return reelGo(el,+d.dataset.j);
  if(e.target.closest('.rzoom')||e.target.closest('.scr img')){ reelStop(el); return lbOpen(el); }
});
/* lightbox */
const LB={el:null};
function lbPaint(){ const R=REELS[LB.el.dataset.reel], sc=R.q.screens[R.i], src=(self.PPS||{})[sc.img]; const lb=$('#lb');
  if(src) lb.querySelector('img').src=src; const tp=lb.querySelector('.tap'); tp.classList.remove('on'); if(sc.tap){ tp.style.left=(sc.tap.x*100)+'%'; tp.style.top=(sc.tap.y*100)+'%'; void tp.offsetWidth; tp.classList.add('on'); }
  lb.querySelector('p').innerHTML=`<b>${R.i+1} of ${R.q.screens.length}</b> · ${rich(sc.caption||R.q.title)}`;
  lb.querySelector('.nv.l').disabled=R.i===0; lb.querySelector('.nv.r').disabled=R.i===R.q.screens.length-1; }
function lbOpen(el){ LB.el=el; $('#lb').classList.add('on'); document.body.style.overflow='hidden'; lbPaint(); $('#lb .x').focus(); }
function lbClose(){ $('#lb').classList.remove('on'); document.body.style.overflow=WK?'hidden':''; LB.el=null; }
$('#lb').addEventListener('click',e=>{ if(e.target.closest('.nv.l')) return reelGo(LB.el,REELS[LB.el.dataset.reel].i-1); if(e.target.closest('.nv.r')) return reelGo(LB.el,REELS[LB.el.dataset.reel].i+1); if(e.target.closest('.x')||!e.target.closest('.lbw')) lbClose(); });
document.addEventListener('keydown',e=>{ if(!LB.el) return; if(e.key==='Escape'){ e.stopPropagation(); lbClose(); } else if(e.key==='ArrowRight') reelGo(LB.el,REELS[LB.el.dataset.reel].i+1); else if(e.key==='ArrowLeft') reelGo(LB.el,REELS[LB.el.dataset.reel].i-1); },true);

/* ---------- quick table ---------- */
function renderTable(){
  setView(`
  <section class="s-head"><div class="eyebrow">Quick reference</div><h1>All ${C.length} carriers at a glance</h1><p>Tap a carrier for the full steps and links. Scroll sideways on small screens.</p></section>
  <div class="tbl"><table><thead><tr><th>Carrier</th><th>Account number</th><th>Transfer PIN</th><th>PIN good for</th><th>Unlock</th></tr></thead><tbody>
  ${C.map(c=>`<tr><td><a href="#/carrier/${c.id}"><span class="mono" style="--c:var(--${c.type})">${initials(c.name)}</span>${esc(c.name)}</a></td><td data-h="Account number">${rich(c.account.summary)}</td><td data-h="Transfer PIN">${c.self?'':'<b style="color:var(--warn)">Call · </b>'}${rich(c.pin.summary)}</td><td data-h="PIN good for">${esc(c.expShort||'—')}</td><td data-h="Unlock">${rich(c.unlock.summary)}</td></tr>`).join('')}
  </tbody></table></div><div style="height:80px"></div>`);
}

/* ---------- search ---------- */
let IDX=[];
function buildIndex(){
  for(const c of C){
    IDX.push({c,anchor:'',kind:'Carrier',text:[c.name,c.aliases,c.net,catOf(c.type).name,c.account.summary,c.pin.summary].join(' ')});
    secs(c).forEach(s=>{
      IDX.push({c,anchor:s.id,kind:s.title,text:[s.title,s.intro].join(' ')});
      s.steps.forEach((t,i)=>IDX.push({c,anchor:`${s.id}-${i}`,kind:`${s.title} · Step ${i+1}`,text:t}));
    });
    [['pin','PIN details',[c.pin.dial,c.pin.format,c.pin.expires,c.pin.lockToDisable]],['unlock','Unlock rules',[c.unlock.postpaid,c.unlock.prepaid]],['account','Account format',[c.account.format]]].forEach(([a,k,v])=>{const t=v.filter(x=>x&&!isUnk(x)).join(' · '); if(t) IDX.push({c,anchor:a,kind:k,text:t});});
    (c.gotchas||[]).forEach(t=>IDX.push({c,anchor:'tips',kind:'Good to know',text:t}));
    if(c.support.phone) IDX.push({c,anchor:'support',kind:'Support phone',text:c.support.phone+' '+(c.support.note||'')});
  }
  IDX.forEach(r=>r.lc=(r.text+' '+r.c.name+' '+r.c.aliases).toLowerCase());
}
function search(q){
  const terms=q.toLowerCase().replace(/[^\w&*#\s-]/g,' ').split(/\s+/).filter(Boolean); if(!terms.length) return [];
  const res=[];
  for(const r of IDX){
    if(!terms.every(t=>r.lc.includes(t))) continue;
    const nm=(r.c.name+' '+r.c.aliases).toLowerCase();
    let sc=r.lc.includes(q.toLowerCase().trim())?8:0; for(const t of terms){ if(nm.includes(t)) sc+=6; if(r.text.toLowerCase().includes(t)) sc+=2; } if(r.kind==='Carrier') sc+=3;
    res.push({r,sc});
  }
  return res.sort((a,b)=>b.sc-a.sc).slice(0,60);
}
function snippet(text,terms){
  const lc=text.toLowerCase(); let at=-1;
  for(const t of terms){ const k=lc.indexOf(t); if(k>=0&&(at<0||k<at)) at=k; }
  let s=at>60?'…'+text.slice(at-50):text; if(s.length>190) s=s.slice(0,190)+'…';
  let out=esc(s); for(const t of terms){ if(t.length<2) continue; out=out.replace(new RegExp('('+esc(t).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'),'<mark>$1</mark>'); }
  return out;
}
function renderSearch(q,anim){
  const terms=q.toLowerCase().split(/\s+/).filter(Boolean), res=search(q);
  setView(`<section class="s-head"><div class="eyebrow">Search</div><h1>“${esc(q)}”</h1><p>${res.length?`${res.length} match${res.length===1?'':'es'} across every carrier`:'No matches. Try the carrier name, a code like *PORT, or a word like “unlock”.'}</p></section>
  <div class="hits">${res.map(({r},k)=>`<a class="hit${anim?' rise':''}" style="--c:var(--${r.c.type});--i:${k}" href="#/carrier/${r.c.id}${r.anchor?'~'+r.anchor:''}"><div class="where">${esc(r.c.name)} · ${esc(r.kind)}</div><p>${snippet(r.text,terms)}</p></a>`).join('')}</div>`,true,anim);
}
let tq=null; const qi=$('#q');
qi.addEventListener('input',()=>{ $('#search').classList.toggle('has',!!qi.value); clearTimeout(tq); tq=setTimeout(()=>{ const v=qi.value.trim(); if(v){ history.replaceState(null,'','#/search/'+encodeURIComponent(v)); route(); } else location.hash='#/'; },140); });
qi.addEventListener('keydown',e=>{ if(e.key==='Enter'){ const f=document.querySelector('.hit'); if(f) f.click(); qi.blur(); } if(e.key==='Escape'){ qi.value=''; qi.dispatchEvent(new Event('input')); } });
$('#q-clear').addEventListener('click',()=>{ qi.value=''; qi.dispatchEvent(new Event('input')); qi.focus(); });
document.addEventListener('keydown',e=>{ if(e.key==='/'&&document.activeElement!==qi&&!WK){ e.preventDefault(); qi.focus(); } });

/* ---------- interactions ---------- */
document.addEventListener('click',e=>{
  const nb=e.target.closest('.num[data-sid]'); if(nb&&CUR){ const id=nb.dataset.sid, li=nb.closest('li');
    if(DONE.has(id)){DONE.delete(id);li.classList.remove('done');nb.setAttribute('aria-pressed','false');} else {DONE.add(id);li.classList.add('done');nb.setAttribute('aria-pressed','true');burst(nb,8);}
    paintDock(); return; }
  if(e.target.closest('#go')&&CUR){ wkOpen(CUR); return; }
  if(e.target.closest('#reset')&&CUR){ DONE=new Set(); document.querySelectorAll('ol.steps li.done').forEach(li=>{li.classList.remove('done');li.querySelector('.num').setAttribute('aria-pressed','false')}); paintDock(); return; }
});
document.addEventListener('pointermove',e=>{ const c=e.target.closest&&e.target.closest('.cat-card,.g-row'); if(!c) return; const r=c.getBoundingClientRect(); c.style.setProperty('--mx',(e.clientX-r.left)+'px'); c.style.setProperty('--my',(e.clientY-r.top)+'px'); },{passive:true});
function burst(el,n){ if(RM) return; const r=el.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2, cols=['#5be3a0','#f0cf86','#5cc8ff','#b48cff','#ffb05c'];
  for(let k=0;k<n;k++){ const p=document.createElement('i'); p.className='spark'; const a=Math.random()*Math.PI*2, d=40+Math.random()*(n>12?160:60);
    p.style.cssText=`left:${cx}px;top:${cy}px;background:${cols[k%cols.length]};--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d}px;--r:${Math.random()*540}deg`; document.body.appendChild(p); setTimeout(()=>p.remove(),1200); } }

/* ---------- walkthrough ---------- */
let WK=null;
function wkOpen(c){ const st=allSteps(c); if(!st.length) return; let s=st.findIndex(x=>!DONE.has(x.id)); if(s<0) s=0;
  WK={c,st,i:s}; $('#wk').style.setProperty('--c',`var(--${c.type})`); $('#wk-title').textContent=c.name+' — port checklist'; $('#wk').classList.add('on'); document.body.style.overflow='hidden'; wkRender(0); $('#wk-next').focus(); }
function wkClose(){ $('#wk').classList.remove('on'); document.body.style.overflow=''; if(WK){ WK=null; route(); } }
function wkRender(dir){ const {c,st,i}=WK, stg=$('#wk-stage');
  if(i>=st.length){ $('#wk-sec').textContent='Finished'; $('#wk-bar').style.width='100%';
    stg.innerHTML=`<div class="wk-card wk-done in-r" style="--k:var(--ok)"><div class="ring">${SV.check}</div><h2>Ready to port.</h2><p>All ${st.length} ${esc(c.name)} steps done. Enter the account number and PIN exactly as given.</p></div>`;
    $('#wk-next').innerHTML='Back to '+esc(c.name); $('#wk-back').disabled=false; burst($('.wk-done .ring'),36); return; }
  const x=st[i]; $('#wk-sec').textContent=x.sec; $('#wk-bar').style.width=(i/st.length*100)+'%';
  const links=c.links.filter(l=>l.kind===x.k).slice(0,2);
  stg.innerHTML=`<div class="wk-card ${dir<0?'in-l':'in-r'}" style="--k:var(--k-${x.k})"><div class="wk-count"><span class="big">${i+1}</span><span>Step ${i+1} of ${st.length}<br>${esc(x.sec)} · ${x.i+1}</span></div><p class="wk-text">${rich(x.t)}</p>${links.length?`<div class="links" style="margin-top:20px">${links.map(linkHtml).join('')}</div>`:''}<p class="wk-hint">Swipe or use ← → keys</p></div>`;
  stg.scrollTop=0; $('#wk-back').disabled=i===0;
  $('#wk-next').innerHTML=i===st.length-1?`Done — finish ${SV.check}`:`Done — next step ${SV.arr}`; }
function wkNext(){ if(!WK) return; if(WK.i>=WK.st.length){ wkClose(); return; } DONE.add(WK.st[WK.i].id); WK.i++; wkRender(1); }
function wkPrev(){ if(!WK||WK.i===0) return; WK.i--; wkRender(-1); }
$('#wk-next').addEventListener('click',wkNext); $('#wk-back').addEventListener('click',wkPrev); $('#wk-x').addEventListener('click',wkClose);
document.addEventListener('keydown',e=>{ if(!WK) return; if(e.key==='ArrowRight'){e.preventDefault();wkNext();} else if(e.key==='ArrowLeft'){e.preventDefault();wkPrev();} else if(e.key==='Escape'){wkClose();} });
let tx=null; $('#wk-stage').addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
$('#wk-stage').addEventListener('touchend',e=>{ if(tx==null) return; const dx=e.changedTouches[0].clientX-tx; tx=null; if(Math.abs(dx)>70){ dx<0?wkNext():wkPrev(); } },{passive:true});

/* ---------- start ---------- */
$('#upd').textContent=DATA.updated;
$('#cats').innerHTML=`<a href="#/" data-cat="home" style="--c:var(--all)"><i></i>All carriers</a>`+DATA.categories.map(c=>`<a href="#/${c.id}" data-cat="${c.id}" style="--c:var(--${c.id})"><i></i>${esc(c.name)}</a>`).join('')+`<span class="gap"></span><a href="#/table" data-cat="table" style="--c:var(--brass-2)"><i></i>Quick table</a>`;
buildIndex();
window.addEventListener('hashchange',route); route();
</script>
</body>
</html>
