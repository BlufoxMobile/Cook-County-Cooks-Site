<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <title>C³ Arcade | Cook County Cooks</title>
  <meta name="description" content="The Break Room cabinet — every game on the site, on one screen.">
  <meta name="theme-color" content="#05070a">

  <!-- FONTS, NON-BLOCKING — the same measured reason as every other station:
       a render-blocking stylesheet also blocks script execution, and
       fonts.googleapis.com HANGS behind a store's captive portal rather than
       failing. media="print" keeps it off the critical path. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,300..700;1,62..125,300..700&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&display=swap"
        media="print" onload="this.media='all'">

  <!-- The site's own stylesheet, for .visually-hidden, .skip-link and the §16
       focus ring. ⚠ Every bare class name in it applies here too, which is why
       every class this page defines carries the `ar-` prefix (see
       claude/v24-arcade-room-rebuild.md: .btn, .floor and .plate all collided). -->
  <link rel="stylesheet" href="../../assets/theme.a73825e539.css">

  <!-- The photograph is the first thing on screen; fetch it before the parser
       reaches the script. The 2560 cut is the one most iPads and laptops use. -->
  <link rel="preload" as="image" href="../../arcade/room/cabinet-2560.webp" fetchpriority="high">

  <!-- ═══════════════════════════════════════════════════════════════════
       v27 — THE CABINET
       ═══════════════════════════════════════════════════════════════════
       One photographed machine in the Break Room, the same light and the same
       walnut, brass and navy as every other room on the site. The page is a
       CAMERA over that photograph:

         WIDE   the room, as you walk in
         MENU   the cabinet's head — marquee, screen, control deck
         PLAY   the screen alone, filling the view

       The game-select menu is HTML laid out on a fixed 1280-wide canvas (like
       a real game's resolution) and placed inside the photographed screen.
       Choosing a game pushes the camera in and loads the game INTO that
       screen, sized in real CSS pixels so the game lays itself out for the
       room it actually has.

       Still true from v24/v25, and still the contract:
         · arcade/manifest.json + a matching slug in the site tool list adds a
           game. No code, no artwork: the menu row, the preview screen and the
           light the screen throws onto the cabinet are all keyed from `tint`.
         · The game's address comes from the SAME registry the site's viewer
           uses, and it is never printed. Every row is a real
           <a href="#/tool/<slug>">, so Copy Link hands out cookcountycooks.com.
         · FULL SCREEN still exists: element fullscreen where the browser has
           it, and otherwise the v22 postMessage handshake, which opens the game
           as a tool in the site's own viewer.
       ═══════════════════════════════════════════════════════════════════ -->

  <style>
:root{
  --ink-950:#05070a; --ink-900:#090d13; --ink-850:#0d131b; --ink-800:#131a24; --ink-700:#1b2430;
  --brass-700:#8a6323; --brass:#c8973f; --brass-400:#ddb463; --brass-300:#ebce93;
  --amber:#f7b955; --lcd:#8ef0d0; --alert:#ff6f57;
  --bone:#f4efe6; --bone-2:#dcd5c8; --bone-3:#b4aba0;
  --ar-tint:#c8973f; --ar-tint-rgb:200 151 63;
  --ar-ease:cubic-bezier(.16,1,.3,1);
  --ar-cam-ms:1400ms;
  --ar-grot:"Archivo", "Helvetica Neue", Arial, sans-serif;
  --ar-didone:"Bodoni Moda", "Didot", "Bodoni 72", Georgia, serif;
}
html,body{margin:0;height:100%;background:var(--ink-950);color:var(--bone);overflow:hidden}
body{font-family:var(--ar-grot);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}

/* ── the stage and the camera ─────────────────────────────────────────── */
.ar-stage{position:fixed;inset:0;overflow:hidden;background:#07090d;contain:strict}
/* The camera is the photograph at a nominal 1600px width, moved and scaled
   by ONE transform. will-change is added only while it moves (.is-moving),
   so a resting cabinet is re-rastered at its real scale and stays sharp. */
.ar-cam{position:absolute;left:0;top:0;width:1600px;height:907.4px;transform-origin:0 0;
  transition:transform var(--ar-cam-ms) var(--ar-ease)}
.ar-cam.is-moving{will-change:transform}
.ar-cam.is-still{transition:none}
.ar-photo{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none;pointer-events:none}

/* A placed element: its box is set in plate fractions by JS (placeBox). */
.ar-at{position:absolute}

/* Light the screen throws onto the cabinet, in the chosen game's colour. */
.ar-spill{pointer-events:none;mix-blend-mode:screen;opacity:0;transition:opacity 900ms ease, background 600ms ease;
  background:radial-gradient(closest-side, rgb(var(--ar-tint-rgb) / .55), rgb(var(--ar-tint-rgb) / .16) 55%, transparent 100%)}
.is-on .ar-spill{opacity:.5}
.is-playing .ar-spill{opacity:.32}
/* The marquee breathes — a fluorescent tube behind acrylic, never a blink. */
.ar-marq-glow{pointer-events:none;mix-blend-mode:screen;opacity:.0;
  background:radial-gradient(60% 70% at 50% 50%, rgb(247 185 85 / .42), transparent 70%)}
.is-on .ar-marq-glow{animation:ar-breathe 5.5s ease-in-out infinite}
@keyframes ar-breathe{0%,100%{opacity:.35}50%{opacity:.6}}

/* The whole physical control deck is a START button, and so is the coin door. */
.ar-deck,.ar-coin{display:block;border-radius:6px;cursor:pointer;background:transparent;border:0;padding:0}
.ar-deck:focus-visible,.ar-coin:focus-visible{outline:3px solid var(--brass-300);outline-offset:2px}

/* ── the screen ───────────────────────────────────────────────────────── */
.ar-screen{overflow:hidden;background:#000;border-radius:3px}
/* The UI canvas: 1280 wide, height set by JS from the screen's aspect, then
   scaled onto the photographed glass with a 2D transform (no 3D context —
   the text stays on the subpixel path). */
.ar-ui{position:absolute;left:0;top:0;width:1280px;transform-origin:0 0;overflow:hidden;
  background:
    radial-gradient(120% 90% at 50% 0%, rgb(var(--ar-tint-rgb) / .10), transparent 60%),
    radial-gradient(90% 80% at 50% 110%, rgb(200 151 63 / .07), transparent 60%),
    linear-gradient(180deg,#070b12,#04060a);
  opacity:0}
.is-on .ar-ui{opacity:1}
.ar-ui.is-power{animation:ar-power 620ms cubic-bezier(.2,.8,.2,1) both}
@keyframes ar-power{
  0%{opacity:1;transform:var(--ar-ui-t) scale(1,.004);filter:brightness(4)}
  35%{opacity:1;transform:var(--ar-ui-t) scale(1,.004);filter:brightness(3)}
  70%{transform:var(--ar-ui-t) scale(1,1.02);filter:brightness(1.4)}
  100%{opacity:1;transform:var(--ar-ui-t) scale(1,1);filter:none}}
/* Glass: scanlines, a corner falloff and one soft reflection. Never animated. */
.ar-glass{position:absolute;inset:0;pointer-events:none;z-index:9;
  background:
    linear-gradient(115deg, rgb(255 255 255 / .06) 0%, rgb(255 255 255 / .015) 22%, transparent 38%),
    radial-gradient(140% 120% at 50% 50%, transparent 58%, rgb(0 0 0 / .55) 100%),
    repeating-linear-gradient(180deg, rgb(0 0 0 / .20) 0 2px, transparent 2px 4px)}

/* Menu layout on the 1280 canvas. */
.ar-menu{position:absolute;inset:0;padding:30px 44px 32px;display:grid;
  grid-template-columns:600px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);column-gap:40px;row-gap:16px}
.ar-top{grid-column:1 / -1;display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid rgb(200 151 63 / .35);padding-bottom:14px}
.ar-top-l{display:flex;align-items:baseline;gap:22px}
.ar-brand{font-family:var(--ar-didone);font-weight:600;font-size:46px;letter-spacing:.06em;color:var(--brass-300);line-height:1}
.ar-brand sup{font-size:.55em;vertical-align:.55em;margin-left:.02em}
.ar-sub{font-weight:600;font-stretch:118%;font-size:20px;letter-spacing:.34em;text-transform:uppercase;color:var(--bone-3)}
.ar-free{font-weight:700;font-stretch:118%;font-size:21px;letter-spacing:.3em;color:var(--lcd);text-shadow:0 0 12px rgb(142 240 208 / .55)}
.ar-free i{font-style:normal;animation:ar-blink 1.1s steps(1) infinite}
@keyframes ar-blink{50%{opacity:0}}

.ar-listwrap{position:relative;overflow:hidden;min-height:0;
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 18px,#000 calc(100% - 26px),transparent 100%);
          mask-image:linear-gradient(180deg,transparent 0,#000 18px,#000 calc(100% - 26px),transparent 100%)}
.ar-list{list-style:none;margin:0;padding:8px 0;transition:transform 420ms var(--ar-ease)}
.ar-row{margin:0 0 10px}
.ar-link{position:relative;display:grid;grid-template-columns:70px minmax(0,1fr) 34px;align-items:center;
  min-height:96px;padding:0 20px 0 22px;border-radius:8px;text-decoration:none;color:var(--bone-3);
  border:1px solid transparent;outline:none;cursor:pointer;
  transition:background 260ms ease,border-color 260ms ease,color 200ms ease}
.ar-link::before{content:"";position:absolute;left:0;top:18px;bottom:18px;width:5px;border-radius:3px;background:var(--row-tint);opacity:.55;transition:opacity 200ms, top 260ms var(--ar-ease), bottom 260ms var(--ar-ease)}
.ar-num{font-weight:600;font-stretch:112%;font-size:24px;letter-spacing:.14em;color:rgb(180 171 160 / .6);font-variant-numeric:tabular-nums}
.ar-name{font-weight:700;font-stretch:104%;font-size:40px;letter-spacing:.045em;line-height:1.05;text-transform:uppercase;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ar-chev{justify-self:end;width:0;height:0;border-left:16px solid var(--brass-300);border-top:11px solid transparent;border-bottom:11px solid transparent;opacity:0}
.ar-link[aria-current="true"]{color:var(--bone);border-color:rgb(221 180 99 / .7);
  background:linear-gradient(90deg, rgb(var(--row-rgb) / .20), rgb(200 151 63 / .07) 70%, rgb(200 151 63 / .02));
  box-shadow:inset 0 0 0 1px rgb(0 0 0 / .3), 0 0 26px -6px rgb(var(--row-rgb) / .55)}
.ar-link[aria-current="true"]::before{opacity:1;top:10px;bottom:10px}
.ar-link[aria-current="true"] .ar-num{color:var(--brass-300)}
.ar-link[aria-current="true"] .ar-chev{opacity:1;animation:ar-nudge 1.2s ease-in-out infinite}
@keyframes ar-nudge{50%{transform:translateX(-6px)}}
.ar-link.is-off{cursor:default}
.ar-link.is-off .ar-name::after{content:" · soon";font-size:.55em;letter-spacing:.2em;color:var(--bone-3)}
/* keyboard focus: the site's two-tone ring, drawn inside the row */
.ar-link:focus-visible{box-shadow:0 0 0 3px #05070a, 0 0 0 6px var(--brass-300)}

.ar-preview{display:grid;grid-template-rows:minmax(0,1fr) auto auto;min-height:0;gap:16px;padding-top:8px}
.ar-monitor{position:relative;height:100%;width:auto;max-width:100%;aspect-ratio:4 / 3;justify-self:center;min-height:0;
  border-radius:10px;overflow:hidden;background:#000;
  box-shadow:0 0 0 2px rgb(200 151 63 / .55), 0 0 0 7px #0b0f16, 0 0 40px -6px rgb(var(--ar-tint-rgb) / .6)}
.ar-crt{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
.ar-monitor::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(180deg, rgb(0 0 0 / .22) 0 3px, transparent 3px 6px),
             radial-gradient(120% 100% at 50% 50%, transparent 60%, rgb(0 0 0 / .5))}
.ar-monitor.is-swap .ar-crt{animation:ar-swap 360ms ease-out}
@keyframes ar-swap{0%{opacity:.1;transform:scaleY(.94)}100%{opacity:1;transform:none}}
.ar-title{font-family:var(--ar-didone);font-weight:600;font-size:48px;line-height:1.05;letter-spacing:.01em;color:var(--bone);margin:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ar-blurb{margin:6px 0 0;font-size:26px;line-height:1.36;color:var(--bone-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ar-foot{display:flex;align-items:center;justify-content:space-between;gap:20px}
.ar-hint{font-weight:600;font-stretch:115%;font-size:19px;letter-spacing:.24em;text-transform:uppercase;color:var(--bone-3)}
.ar-hint b{color:var(--brass-300);font-weight:700}
.ar-start{appearance:none;border:0;cursor:pointer;font:inherit;font-weight:700;font-stretch:120%;font-size:26px;letter-spacing:.3em;
  text-transform:uppercase;color:#120c04;padding:16px 34px 16px 40px;border-radius:999px;
  background:linear-gradient(180deg,var(--brass-300),var(--brass) 55%,var(--brass-700));
  box-shadow:0 0 0 1px rgb(0 0 0 / .4), 0 8px 30px -8px rgb(247 185 85 / .7), inset 0 1px 0 rgb(255 255 255 / .5);
  animation:ar-pulse 1.6s ease-in-out infinite}
.ar-start:disabled{animation:none;opacity:.45;cursor:default}
.ar-start:focus-visible{outline:3px solid var(--bone);outline-offset:4px}
@keyframes ar-pulse{50%{box-shadow:0 0 0 1px rgb(0 0 0 / .4), 0 8px 46px -4px rgb(247 185 85 / .95), inset 0 1px 0 rgb(255 255 255 / .5)}}

/* In-screen states: boot / loading / notice. */
.ar-card{position:absolute;inset:0;display:grid;place-items:center;text-align:center;z-index:5;
  background:radial-gradient(80% 80% at 50% 45%, rgb(var(--ar-tint-rgb) / .16), transparent 70%), #04060a;
  opacity:0;visibility:hidden;transition:opacity 220ms ease, visibility 0s linear 220ms}
.ar-card.is-shown{opacity:1;visibility:visible;transition:opacity 160ms ease}
.ar-card-in{max-width:980px;padding:0 40px}
.ar-kicker{font-weight:700;font-stretch:120%;font-size:22px;letter-spacing:.42em;color:var(--lcd);text-shadow:0 0 14px rgb(142 240 208 / .6);margin:0 0 20px}
.ar-card h2{font-family:var(--ar-didone);font-weight:600;font-size:84px;line-height:1;margin:0 0 26px;color:var(--bone);letter-spacing:.01em}
.ar-card p{font-size:26px;line-height:1.45;color:var(--bone-2);margin:0 auto;max-width:860px}
.ar-card code{font-size:.9em;color:var(--brass-300)}
.ar-bar{width:520px;height:10px;margin:34px auto 0;border-radius:6px;background:rgb(255 255 255 / .08);overflow:hidden}
.ar-bar i{display:block;height:100%;width:40%;border-radius:6px;background:linear-gradient(90deg,transparent,var(--ar-tint),transparent);
  animation:ar-load 1.1s ease-in-out infinite}
@keyframes ar-load{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
.ar-card-actions{display:flex;gap:18px;justify-content:center;margin-top:34px}
.ar-card-actions button{appearance:none;font:inherit;font-weight:700;font-stretch:115%;font-size:20px;letter-spacing:.2em;text-transform:uppercase;
  padding:14px 26px;border-radius:999px;cursor:pointer;border:1px solid rgb(221 180 99 / .7);background:rgb(200 151 63 / .12);color:var(--bone)}


/* ── COMPACT: a phone in portrait ────────────────────────────────────────
   The glass is only ~390px wide there, so it carries the preview and START
   at poster size, and the game list moves OUT of the screen onto a dock
   laid over the lower cabinet — the same <ul>, moved, never duplicated. */
.is-compact .ar-menu{grid-template-columns:minmax(0,1fr);row-gap:22px;padding:30px 40px 34px}
.is-compact .ar-sub{display:none}
.is-compact .ar-brand{font-size:66px}
.is-compact .ar-free{font-size:34px}
.is-compact .ar-listwrap{display:none}
.is-compact .ar-preview{grid-template-columns:auto minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;column-gap:40px;row-gap:0;padding:0}
.is-compact .ar-monitor{grid-row:1 / span 2}
.is-compact .ar-preview > div:nth-child(2){align-self:center}
.is-compact .ar-title{font-size:84px;white-space:normal;line-height:1;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.is-compact .ar-blurb,.is-compact .ar-hint{display:none}
.is-compact .ar-foot{justify-content:flex-start}
.is-compact .ar-start{font-size:36px;letter-spacing:.16em;white-space:nowrap;padding:22px 34px 22px 40px}

.ar-dock{position:fixed;left:12px;right:12px;z-index:20;display:none;overflow:auto;overscroll-behavior:contain;
  padding:10px;border-radius:14px;background:rgb(5 7 10 / .72);border:1px solid rgb(200 151 63 / .35);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:0 18px 40px -16px rgb(0 0 0 / .9)}
.is-compact .ar-dock{display:block}
.is-playing .ar-dock,[data-view="wide"] .ar-dock{display:none}
.ar-dock-h{margin:0 2px 8px;font:600 10px/1 var(--ar-grot);font-stretch:118%;letter-spacing:.26em;text-transform:uppercase;color:var(--bone-3)}
.ar-dock .ar-list{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0;transform:none !important}
.ar-dock .ar-row{margin:0}
.ar-dock .ar-link{min-height:54px;grid-template-columns:22px minmax(0,1fr);padding:6px 10px 6px 14px;border-radius:10px;
  background:rgb(19 26 36 / .85);border-color:rgb(200 151 63 / .22)}
.ar-dock .ar-link::before{top:12px;bottom:12px;width:3px}
.ar-dock .ar-num{font-size:10px}
.ar-dock .ar-name{font-size:13px;letter-spacing:.06em;white-space:normal;line-height:1.15;overflow:visible}
.ar-dock .ar-chev{display:none}
.ar-dock .ar-link[aria-current="true"]{box-shadow:0 0 18px -6px rgb(var(--row-rgb) / .8)}
.ar-dock .ar-link:focus-visible{box-shadow:0 0 0 2px #05070a, 0 0 0 4px var(--brass-300)}

/* ── the live game ────────────────────────────────────────────────────── */
/* NOT inside the camera: it is positioned in viewport pixels over where the
   camera will put the screen, so the game lays out at its true size and is
   never a scaled bitmap. */
.ar-live{position:fixed;left:0;top:0;width:0;height:0;border:0;background:#000;z-index:30;
  opacity:0;visibility:hidden;transition:opacity 380ms ease, visibility 0s linear 380ms}
.ar-live.is-shown{opacity:1;visibility:visible;transition:opacity 380ms ease}
.ar-scrim{position:fixed;inset:0;background:#05070a;z-index:29;opacity:0;pointer-events:none;transition:opacity 500ms ease}
.is-expanded .ar-scrim{opacity:.94}
.ar-vig{position:absolute;inset:0;pointer-events:none;z-index:2;opacity:.9;transition:opacity 900ms ease;
  background:radial-gradient(120% 95% at 50% 42%, transparent 52%, rgb(3 5 9 / .72) 100%)}
.is-playing .ar-vig{opacity:1;background:radial-gradient(90% 85% at 50% 50%, transparent 55%, rgb(3 5 9 / .9) 100%)}

/* ── HUD (viewport chrome) ───────────────────────────────────────────── */
.ar-hud{position:fixed;left:0;right:0;z-index:40;display:flex;align-items:center;justify-content:center;gap:12px;
  padding:0 16px;pointer-events:none}
.ar-hud > *{pointer-events:auto}
.ar-hud-top{top:max(10px, env(safe-area-inset-top));justify-content:space-between;opacity:0;visibility:hidden;
  transform:translateY(-8px);transition:opacity 300ms ease, transform 300ms ease, visibility 0s linear 300ms}
.is-playing .ar-hud-top{opacity:1;visibility:visible;transform:none;transition:opacity 300ms ease 500ms, transform 300ms ease 500ms}
.ar-hud-bot{bottom:max(10px, env(safe-area-inset-bottom));transition:opacity 300ms ease}
.is-playing .ar-hud-bot{opacity:0;pointer-events:none}
.is-playing .ar-hud-bot > *{pointer-events:none}
.ar-pill{appearance:none;display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 16px;border-radius:999px;
  font:600 12px/1 var(--ar-grot);font-stretch:118%;letter-spacing:.2em;text-transform:uppercase;text-decoration:none;cursor:pointer;
  color:var(--bone);background:rgb(9 13 19 / .78);border:1px solid rgb(200 151 63 / .55);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);box-shadow:0 6px 18px -6px rgb(0 0 0 / .7)}
.ar-pill:hover{border-color:var(--brass-300);color:#fff}
.ar-pill:focus-visible{outline:3px solid var(--brass-300);outline-offset:2px}
.ar-pill svg{width:14px;height:14px;flex:none}
.ar-pill-name{color:var(--brass-300)}
.ar-hud-group{display:flex;gap:8px}
.ar-tips{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;
  font:600 11px/1.3 var(--ar-grot);font-stretch:115%;letter-spacing:.2em;text-transform:uppercase;color:var(--bone-3);
  padding:8px 14px;border-radius:999px;background:rgb(5 7 10 / .55)}
.ar-tips b{color:var(--brass-300);font-weight:700}
.ar-tips a{color:var(--brass-300);text-decoration:none;border-bottom:1px solid rgb(200 151 63 / .5)}
.ar-tips .ar-touch{display:none}
@media (hover:none) and (pointer:coarse){ .ar-tips .ar-kb{display:none} .ar-tips .ar-touch{display:inline} }
@media (max-width:520px){ .ar-pill-long{display:none} }
@media (max-height:520px) and (orientation:landscape){
  .ar-pill{min-height:32px;padding:0 12px}
  .ar-hud-top{top:max(6px, env(safe-area-inset-top))}
  .ar-hud-bot{bottom:max(4px, env(safe-area-inset-bottom))}
  .ar-tips{padding:5px 12px}
}
.ar-mute[aria-pressed="true"] .ar-snd-on,.ar-mute[aria-pressed="false"] .ar-snd-off{display:none}

.grain{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;opacity:.05;mix-blend-mode:overlay;z-index:3}

/* ── intro canvas (createArcadeIntro) — unchanged from v25 ───────────── */
.c3-intro-canvas{position:fixed;inset:0;left:0;top:0;right:0;bottom:0;width:100%;height:100%;display:block;z-index:999;
  pointer-events:none;touch-action:none;user-select:none;background:#05070a;opacity:1;transition:opacity 200ms linear;will-change:opacity;
  image-rendering:pixelated;image-rendering:crisp-edges;object-fit:cover}

@media (prefers-reduced-motion: reduce){
  .ar-cam,.ar-list,.ar-spill{transition:none !important}
  .ar-ui.is-power,.ar-monitor.is-swap .ar-crt{animation:none !important}
  .is-on .ar-marq-glow{animation:none;opacity:.45}
  .ar-link[aria-current="true"] .ar-chev,.ar-start,.ar-free i,.ar-bar i{animation:none !important}

  <p class="visually-hidden" role="status" aria-live="polite" id="ar-live"></p>

  <script>
/* ══ the attract engine — procedural, one canvas, 320x240 at 30fps ══ */
/* ==========================================================================
   C3 BREAK ROOM ARCADE - procedural attract-mode engine
   --------------------------------------------------------------------------
   Draws the looping demo screen for the one selected cabinet. Everything is
   generated: no images, no webfonts, no ctx.font, no external anything.

   Design constraints that drive the odd-looking decisions below:
     - 320x240 backing store at DPR 1. The chunky CSS upscale IS the look, and
       it pins the compositor layer at ~0.31 MB no matter how big the cabinet
       is drawn on screen.
     - 30fps. A 1987 board did not run at 60, and half the frames means half
       the draw budget. One rAF, accumulator-gated.
     - Zero per-frame allocation. Every array, string and pattern is built at
       mount. Numbers are drawn digit-by-digit so we never build a string in
       the loop (see drawNumber).
     - Deterministic. One PRNG seeded from the slug; it is drained entirely at
       mount into preallocated buffers. Math.random is never called.
   ========================================================================== */

function createAttractEngine() {
  /* True singleton: the page may call this from several places (cabinet
     switcher, still-frame thumbnails) and must get the same loop owner back,
     otherwise "at most one loop in the document" is unenforceable. */
  if (createAttractEngine._instance) return createAttractEngine._instance;

  /* ---------------------------------------------------------------- config */

  var W = 320, H = 240;
  var FPS = 30;
  var FRAME_MS = 1000 / FPS;          // 33.333...
  var MAX_DT = 250;                   // never replay more than ~7 frames of
                                      // backlog after a stall; arcade attract
                                      // loops do not need catch-up fidelity
  var SLEEP_MS = 60000;               // 60s of no input -> freeze
  var CYCLE = 360;                    // 12s at 30fps
  var PHASE_START = [0, 120, 225, 300];
  var PHASE_LEN   = [120, 105,  75,  60];
  var WIPE = 6;                       // frames per half of the wipe (0.2s each)
  var BLINK = 42;                     // 1.4s at 30fps
  var BLINK_ON = 26;                  // ~62% duty. A symmetric blink reads as a
                                      // fault light; real PRESS START legends
                                      // sit lit longer than they sit dark.
  var STILL_FRAME = 60;               // canonical still: mid title-card hold,
                                      // 60 % 42 = 18 so PRESS START is lit
  var NSTARS = 140;                   // fills the tunnel without the cull rate
                                      // making the field look thin

  /* Fixed palette. Nothing else may reach the canvas. */
  var GROUND  = '#05070a';
  var GROUND2 = '#090d13';
  var SHADE1  = '#1b2430';
  var SHADE2  = '#3a4653';
  var PHOSPH  = '#8ef0d0';
  var AMBER   = '#f7b955';
  var ORANGE  = '#ff9e4a';
  var RED     = '#ff6f57';
  // #9fb6c4 (steel) is in the approved list too, but the engine never reaches
  // for it directly - it only ever arrives as somebody's tint.
  var PALE    = '#dbe8ef';
  var WHITE   = '#f4efe6';

  /* ------------------------------------------------------------ 5x7 font */

  /* 53 glyphs, row-major, 5 bits per row encoded as one base32 digit, 7 digits
     per glyph: 371 chars total. Cheaper to ship and to parse than any nested
     array literal, and it diffs as one line. Bit 4 is the leftmost column.
     % and & are past the brief's required set but present because blurbs are
     written by hand - a missing glyph renders as a hole in the middle of a
     sentence, and those two are the ones retail copy actually reaches for. */
  var FONT_KEYS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789 .,:'!?-+/()\u00A9\u00B3\u00A2%&";
  var FONT_BITS =
    "EHHVHHHUHHUHHUEHGGGHEUHHHHHUVGGUGGVVGGUGGGEHGNHHEHHHVHHHV44444V72222ICHIKOK" +
    "IHGGGGGGVHRLLHHHHPPLJJHEHHHHHEUHHUGGGEHHHLIDUHHUKIHFGGE11UV444444HHHHHHEHHH" +
    "HHA4HHHLLRHHHA4AHHHHA4444V1248GVEHJLPHE4C4444EEH1248VV2421HE26AIV22VGU11HE6" +
    "8GUHHEV124888EHHEHHEEHHF12C000000000000CC0000C480CC0CC044800004444404EH1240" +
    "4000E000044V44011248GG24888428422248EHMKMHEE262E004E888E4PP248JJCIK8LID";

  var GLYPH = new Int32Array(FONT_KEYS.length * 7);
  var CHARMAP = new Int16Array(256);   // charCode -> glyph index, -1 = absent
  (function decodeFont() {
    var i;
    for (i = 0; i < 256; i++) CHARMAP[i] = -1;
    for (i = 0; i < FONT_BITS.length; i++) {
      var c = FONT_BITS.charCodeAt(i);
      // base32 digit: '0'-'9' then 'A'-'V'
      GLYPH[i] = c <= 57 ? c - 48 : c - 55;
    }
    for (i = 0; i < FONT_KEYS.length; i++) {
      // every glyph we ship lives in Latin-1, including (c) (r)3 and (c)ent,
      // so a flat 256-entry table beats any hash lookup
      CHARMAP[FONT_KEYS.charCodeAt(i)] = i;
    }
  })();

  var POW10 = [1, 10, 100, 1000, 10000, 100000, 1000000, 10000000];

  /* Draw one glyph as horizontal runs rather than per-pixel rects: a 5-wide
     row is at most 3 runs, so worst case is 21 fillRects per character and
     typical case is 9. Per-pixel would be 35. */
  function drawGlyph(ctx, gi, x, y, s) {
    var base = gi * 7, r, c, bits, run;
    for (r = 0; r < 7; r++) {
      bits = GLYPH[base + r];
      if (bits === 0) continue;
      run = -1;
      for (c = 0; c < 5; c++) {
        if ((bits >> (4 - c)) & 1) {
          if (run < 0) run = c;
        } else if (run >= 0) {
          ctx.fillRect(x + run * s, y + r * s, (c - run) * s, s);
          run = -1;
        }
      }
      if (run >= 0) ctx.fillRect(x + run * s, y + r * s, (5 - run) * s, s);
    }
  }

  function textW(str, s, sp) {
    if (sp === undefined) sp = 1;
    return str.length * (5 + sp) * s - sp * s;
  }

  /* True drawn extent of a line. The title is drawn twice - an offset copy
     s px down and right, then the face - so its ink is s px wider than textW
     reports. Fitting or centring on textW alone leaves s px less room than
     the fit believed and pushes the line s/2 px right of centre. */
  function inkW(str, s, sp, shadow) {
    return textW(str, s, sp) + (shadow ? s : 0);
  }

  /* The font is fixed-advance, so capacity is arithmetic, not measurement:
     every glyph costs (5+sp)*s and the last one refunds sp*s. */
  function fitChars(maxW, s, sp) {
    if (sp === undefined) sp = 1;
    var n = ((maxW + sp * s) / ((5 + sp) * s)) | 0;
    return n < 0 ? 0 : n;
  }

  function widestW(lines, s, sp) {
    var m = 0, i, w;
    for (i = 0; i < lines.length; i++) {
      w = textW(lines[i], s, sp);
      if (w > m) m = w;
    }
    return m;
  }

  function drawText(ctx, str, x, y, s, color, sp) {
    if (sp === undefined) sp = 1;
    ctx.fillStyle = color;
    var adv = (5 + sp) * s, i, gi, cc;
    for (i = 0; i < str.length; i++) {
      cc = str.charCodeAt(i);
      gi = cc < 256 ? CHARMAP[cc] : -1;
      // unknown characters still advance, so a stray glyph never shifts a
      // centred line out from under its own centring maths
      if (gi >= 0) drawGlyph(ctx, gi, x + i * adv, y, s);
    }
  }

  function drawTextC(ctx, str, cx, y, s, color, sp) {
    drawText(ctx, str, cx - (textW(str, s, sp) >> 1), y, s, color, sp);
  }

  /* Integer -> glyphs with no intermediate string. This is the single biggest
     allocation win in the loop: the demo HUD, the depth readout and the score
     ticker would otherwise mint a fresh string 30 times a second. */
  function drawNumber(ctx, val, digits, x, y, s, color, sp) {
    if (sp === undefined) sp = 1;
    ctx.fillStyle = color;
    var adv = (5 + sp) * s, i, d;
    if (val < 0) val = 0;
    for (i = 0; i < digits; i++) {
      d = ((val / POW10[digits - 1 - i]) | 0) % 10;
      drawGlyph(ctx, 26 + d, x + i * adv, y, s);   // 26 = index of '0'
    }
  }

  function numW(digits, s, sp) {
    if (sp === undefined) sp = 1;
    return digits * (5 + sp) * s - sp * s;
  }

  /* ------------------------------------------------------ pixel primitives */

  /* Filled disc by horizontal spans. One fillRect per scanline, integer edges,
     no ctx.arc - an arc would be antialiased and instantly break the illusion
     at a 4x upscale. */
  function pixelDisc(ctx, cx, cy, r, color) {
    ctx.fillStyle = color;
    var dy, dx;
    for (dy = -r; dy <= r; dy++) {
      dx = Math.sqrt(r * r - dy * dy) | 0;
      ctx.fillRect(cx - dx, cy + dy, dx * 2 + 1, 1);
    }
  }

  /* Midpoint circle outline. `step` plots every Nth pixel, which is both a
     3x cost saving on the big sonar rings and exactly how a real scope's
     range rings looked - dotted, not solid. */
  function pixelRing(ctx, cx, cy, r, color, step) {
    ctx.fillStyle = color;
    var x = r, y = 0, err = 1 - r, n = 0;
    while (x >= y) {
      if (n % step === 0) {
        ctx.fillRect(cx + x, cy + y, 1, 1); ctx.fillRect(cx + y, cy + x, 1, 1);
        ctx.fillRect(cx - y, cy + x, 1, 1); ctx.fillRect(cx - x, cy + y, 1, 1);
        ctx.fillRect(cx - x, cy - y, 1, 1); ctx.fillRect(cx - y, cy - x, 1, 1);
        ctx.fillRect(cx + y, cy - x, 1, 1); ctx.fillRect(cx + x, cy - y, 1, 1);
      }
      n++; y++;
      if (err < 0) err += 2 * y + 1;
      else { x--; err += 2 * (y - x) + 1; }
    }
  }

  /* Bresenham. `step` again doubles as a cheap radial dither for the sonar
     wake: a line plotted every 2nd or 3rd pixel reads as a dimmer line on a
     phosphor screen without needing another colour. */
  function pixelLine(ctx, x0, y0, x1, y1, color, step) {
    ctx.fillStyle = color;
    x0 = x0 | 0; y0 = y0 | 0; x1 = x1 | 0; y1 = y1 | 0;
    var dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0);
    var sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
    var err = dx + dy, e2, n = 0, guard = 0;
    for (;;) {
      if (n % step === 0) ctx.fillRect(x0, y0, 1, 1);
      n++;
      if ((x0 === x1 && y0 === y1) || ++guard > 700) break;
      e2 = 2 * err;
      if (e2 >= dy) { err += dy; x0 += sx; }
      if (e2 <= dx) { err += dx; y0 += sy; }
    }
  }

  /* Dither as a real 4x4 tile of solid pixels, wrapped in a CanvasPattern so a
     shaded band costs one fillRect instead of a few thousand. The pixels in
     the tile are opaque and unblended - this is an ordered Bayer fill, not a
     gradient or an alpha ramp. Built once per mount, never per frame. */
  function makeDither(ctx, color, level) {
    var t = document.createElement('canvas');
    t.width = 4; t.height = 4;
    var tc = t.getContext('2d');
    tc.fillStyle = color;
    var BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
    var thresh = level === 2 ? 8 : level === 3 ? 12 : 4;   // 25% / 50% / 75%
    for (var i = 0; i < 16; i++) {
      if (BAYER[i] < thresh) tc.fillRect(i % 4, (i / 4) | 0, 1, 1);
    }
    return ctx.createPattern(t, 'repeat');
  }

  /* -------------------------------------------------------------- colour */

  function clampByte(v) { return v < 0 ? 0 : v > 255 ? 255 : v; }

  function hexOf(r, g, b) {
    var n = (1 << 24) | (clampByte(r) << 16) | (clampByte(g) << 8) | clampByte(b);
    return '#' + n.toString(16).slice(1);
  }

  /* Four-step ramp from the tint by integer division only. No HSL round trip,
     no color-mix: both are per-call string work and neither is guaranteed to
     land on the same bytes across browsers, which would break determinism. */
  function buildRamp(tint) {
    var h = tint.charAt(0) === '#' ? tint.slice(1) : tint;
    if (h.length === 3) h = h.charAt(0) + h.charAt(0) + h.charAt(1) + h.charAt(1) + h.charAt(2) + h.charAt(2);
    var v = parseInt(h, 16);
    if (isNaN(v)) v = 0x8ef0d0;
    var r = (v >> 16) & 255, g = (v >> 8) & 255, b = v & 255;
    return [
      hexOf(r, g, b),
      hexOf((r * 3) >> 2, (g * 3) >> 2, (b * 3) >> 2),
      hexOf(r >> 1, g >> 1, b >> 1),
      // floor the darkest step so a dim tint never sinks into #05070a and
      // takes the starfield / range rings with it
      hexOf((r >> 2) + 12, (g >> 2) + 14, (b >> 2) + 16)
    ];
  }

  /* ----------------------------------------------------------------- PRNG */

  function imul32(a, b) {
    // Math.imul is fine everywhere we ship, but this is mount-time only and
    // costs nothing, so we keep the file honest about its ES5 baseline.
    var aHi = (a >>> 16) & 0xffff, aLo = a & 0xffff;
    var bHi = (b >>> 16) & 0xffff, bLo = b & 0xffff;
    return ((aLo * bLo) + ((((aHi * bLo + aLo * bHi) << 16) >>> 0))) | 0;
  }

  function seedFrom(str) {
    var h = 2166136261;
    for (var i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = imul32(h, 16777619);
    }
    return h >>> 0;
  }

  function mulberry32(a) {
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      var t = a;
      t = imul32(t ^ (t >>> 15), t | 1);
      t ^= t + imul32(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  /* ----------------------------------------------------------------- text */

  function sanitize(str) {
    // the font is uppercase-only; fold once at mount so the loop never calls
    // toUpperCase (which allocates)
    return String(str === undefined || str === null ? '' : str).toUpperCase();
  }

  var ELL = '...';

  /* One wrapper for every caller-supplied string. Word-wraps to a character
     capacity and reports whether anything was left over, so a caller that
     must show truncation (the blurb) can and one that need not (HOW TO PLAY)
     can ignore it. A word too long to fit a line on its own is hard-broken:
     the old version passed it through whole, which is how a 58-character
     token came to be drawn from x=-193 to x=513 on a 320px canvas. */
  function wrapFit(str, cap, maxLines) {
    var out = { lines: [], over: false }, words, cur = '', i, w;
    if (cap < 1) { out.over = str.length > 0; return out; }
    words = str.split(/\s+/);
    for (i = 0; i < words.length; i++) {
      w = words[i];
      if (!w) continue;
      while (w.length > cap) {                       // hard break
        if (cur !== '') {
          if (out.lines.length >= maxLines) { out.over = true; return out; }
          out.lines.push(cur); cur = '';
        }
        if (out.lines.length >= maxLines) { out.over = true; return out; }
        out.lines.push(w.slice(0, cap));
        w = w.slice(cap);
      }
      if (cur === '') cur = w;
      else if (cur.length + 1 + w.length <= cap) cur += ' ' + w;
      else {
        if (out.lines.length >= maxLines) { out.over = true; return out; }
        out.lines.push(cur); cur = w;
      }
    }
    if (cur !== '') {
      if (out.lines.length >= maxLines) { out.over = true; return out; }
      out.lines.push(cur);
    }
    return out;
  }

  /* Mark truncation on the last line, dropping whole words until the marker
     fits. Only if a single unbroken word is all there is do we cut mid-word -
     the marker must never be what pushes the line over. */
  function ellipsise(lines, cap) {
    if (lines.length === 0) return lines;
    var k = lines.length - 1, last = lines[k], sp;
    while (last.length + ELL.length > cap) {
      sp = last.lastIndexOf(' ');
      if (sp < 0) { last = last.slice(0, cap - ELL.length < 0 ? 0 : cap - ELL.length); break; }
      last = last.slice(0, sp);
    }
    lines[k] = last + ELL;
    return lines;
  }

  /* Kept for callers that only want the lines. Now hard-breaks. */
  function wrapText(str, maxChars, maxLines) {
    return wrapFit(str, maxChars, maxLines).lines;
  }

  /* Largest integer scale whose ink - letter-spacing and the offset shadow
     pass included - clears maxW. Tries one line down to TITLE_MIN_SINGLE,
     then two lines on the same ladder, then two lines at TITLE_MIN_SINGLE
     with a truncation marker. Wrapping before shrinking is deliberate: a

  var FLAME = [7, 3, 6, 2];

  function demoTunnel(ctx, h, f) {
    bg(ctx);

       z walks 1.0 (far) down to 0.08 (at the camera) and the half-extents are
       k/z - the same projection the stars use, so gates and stars share one
       vanishing point instead of drifting apart. Five gates is enough; more
       and it reads as a tunnel shooter, which this is not pretending to be. */
    for (i = 0; i < 5; i++) {

      ctx.fillRect(160 - _x, 120 + _y, _x * 2, 1);

       the field stays deterministic, the loop allocates nothing, and the PRNG
       is never touched after mount. */

      while (sz <= 0.08) sz += 1;

      sy = (120 + h.stars[i * 3 + 1] * 95 / sz) | 0;
      if (sx < 1 || sx >= W - 1 || sy < 28 || sy >= 216) continue;
      if (sz < 0.22) { ctx.fillStyle = WHITE; ctx.fillRect(sx, sy, 2, 2); }
      else if (sz < 0.45) { ctx.fillStyle = h.ramp[0]; ctx.fillRect(sx, sy, 2, 1); }
      else if (sz < 0.72) { ctx.fillStyle = h.ramp[1]; ctx.fillRect(sx, sy, 1, 1); }

       of the pool on stars that are already past the camera and culled. */

       just looks like a misaligned rectangle. */

       mid-demo. */

      h.slept = true;

    // On a 60Hz display this draws on every other rAF. On 120Hz, every fourth.
    // The draw itself is never repeated for a frame we already painted.

  /* ── THE CAMERA ───────────────────────────────────────────────────────

     a plate box in the middle of the viewport; for the room views it never
     lets the photograph uncover the page (cover-clamped), for play it may. */

  /* ── the menu ─────────────────────────────────────────────────────────── */

    applyTint(g);
    titleEl.textContent = g.title;
    blurbEl.textContent = g.blurb;
    startBtn.disabled = !g.playable;
    startBtn.textContent = g.playable ? 'Press start' : 'Coming soon';
    scrollList();
    if (changed) {
      if (!opts.quiet || !crtHandle) { /* fallthrough: always remount */ }
      mountCrt(g);

  function scrollList() {

  /* ── the in-screen card: loading, notices ───────────────────────────── */
  function showCard(o) {

    cardTitle.textContent = o.title || '';
    cardBody.innerHTML = o.html || '';
    cardBar.style.display = o.bar ? '' : 'none';
    cardActions.innerHTML = '';
    (o.actions || []).forEach(function (a) {
      var b = document.createElement('button');

      cardActions.appendChild(b);

  }
  function hideCard() { card.classList.remove('is-shown'); }

  /* ── PLAY ─────────────────────────────────────────────────────────────
     1. START: sound, PLAYER 1 card in the tint, the attract loop stops.
     2. The camera pushes in to the screen. The iframe is created at once and
        placed where the screen WILL be, invisible, so the game is loading
        during the move rather than after it.

        (or after a patient timeout, with a way out). */
  var busy = false, playing = null, frameEl = null, revealT = 0, slowT = 0, playSeq = 0;

    frameEl.style.top = Math.round(r.top) + 'px';
    frameEl.style.width = Math.round(r.width) + 'px';
    frameEl.style.height = Math.round(r.height) + 'px';
    root.classList.toggle('is-expanded', t.expanded);

  function play(g) {
    if (!g || busy || playing) return;
    if (!g.playable) { sfx.back(); say(g.title + ' is not available yet.'); return; }
    if (!g.src) { handOff(g); return; }            // no registry: the viewer resolves it
    busy = true;
    var seq = ++playSeq;
    playing = g;
    sfx.start();
    say('Starting ' + g.title + '.');
    nowEl.textContent = g.title;
    if (crtHandle) crtHandle.stop();
    showCard({ kicker: 'Player 1 · Start', title: g.title, html: esc(g.blurb), bar: true });

    root.classList.add('is-playing');

  $('ar-deck').addEventListener('click', function () { if (view === 'menu') play(GAMES[sel]); });

  /* ── keys ─────────────────────────────────────────────────────────────── */

    powerOn();

    showCard({ kicker: kicker, title: title, html: html, bar: false });
  }

  if (OFFLINE) {
    walkUp(10);

      'Open the arcade from cookcountycooks.com. A saved copy cannot read <code>arcade/manifest.json</code>.');
    return;

  Promise.all([

    var games = (manifest && Array.isArray(manifest.games) ? manifest.games : [])
      .filter(function (g) { return g && typeof g.slug === 'string' && g.slug && typeof g.title === 'string'; })
      .map(function (g) {

    if (!games.length) {

      notice('Out of order', 'No games loaded', 'The list at <code>arcade/manifest.json</code> is empty.');

    buildList(games);
    select(Math.max(0, games.findIndex(function (g) { return g.playable; })), { silent: true });
    if (crtHandle) crtHandle.stop();

    say(games.length + (games.length === 1 ? ' game' : ' games') + ' on the cabinet. '
      + GAMES[sel].title + ' is selected. Up and down arrow keys to choose, Enter to play.');

    /* The v25 cinematic, once per visit, failing open. It plays OVER the

      photo.addEventListener('error', once);

    if (!introSeen && !noMotion()) {
      try { window.sessionStorage.setItem(INTRO_KEY, '1'); } catch (err) { /* noop */ }
      var h = null;
      try { h = createArcadeIntro().play(document.body, { games: GAMES }); }
      catch (err) { console.warn('[arcade] the intro did not run:', err); }
      if (h && h.done) {
        h.done.then(function () { whenPhoto(function () { setTimeout(function () { go(1900); }, 250); }); });
      } else {
        whenPhoto(function () { go(1900); });
      }
    } else {
      whenPhoto(function () { setTimeout(function () { go(1300); }, 350); });
    }

    notice('Out of order', 'The arcade could not open',
      'The game list did not load (' + esc(err && err.message ? err.message : 'unknown error') + '). '
      + 'Every game is still listed in the Break Room on the main page.');
  });
})();
  </script>
