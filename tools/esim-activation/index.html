  window.scrollTo(0,0);
}
function guideHtml(v){
  const D=getDone(), task=v.mode==='task', t=v.t, steps=v.steps, pics=picsOf(steps);
  const g=task?grpOf(t):null, prev=task&&TASKS[t.k-1], next=task&&TASKS[t.k+1];
  const head=task?`
  <div class="crumbs"><a href="#/">Home</a><span>/</span><span>${esc(g.name)}</span></div>
  <section class="g-head">
    <div class="eyebrow">${esc(g.name)} · ${esc(G.code)}</div>
    <h1>${esc(t.title)}</h1>
    ${t.intro?`<p class="sum">${rich(t.intro)}</p>`:''}${t.introMore?moreHtml({info:t.introMore}):''}
    ${t.warn?`<div class="callout warn"><span class="lbl">Heads up</span>${rich(t.warn)}</div>`:''}
    <div class="meta">${steps.length?`<span class="tag">${plural(steps.length,'step')}</span>`:''}${pics?`<span class="tag">${plural(pics,'picture')}</span>`:''}${t.table!=null?'<span class="tag">Table</span>':''}<a class="src" href="${esc(G.source)}" target="_blank" rel="noopener">Main article in Celestial ↗</a></div>
    ${t.qr?qrStrip():''}
  </section>`:`
  <div class="crumbs"><a href="#/">Home</a><span>/</span><span>Whole guide</span></div>
  <section class="g-head">
    <div class="eyebrow">Xfinity Mobile · ${esc(G.code)}</div>
    <h1>eSIM Xfinity Mobile <em>Activation</em></h1>
    <p class="sum">${esc(G.summary)}</p>
    <div class="meta"><span class="tag">${steps.length} steps</span><span class="tag">${pics} pictures</span><span class="tag">Celestial current to ${esc(G.updated)}</span><a class="src" href="${esc(G.source)}" target="_blank" rel="noopener">Main article in Celestial ↗</a></div>
    ${qrStrip()}
  </section>`;
  let body;
  if(task){
    const s=G.sections[t.table];
    body=`<section class="g-sec" id="tk${t.k}">${steps.length?`<ol class="steps">${steps.map((x,i)=>stepHtml(x,i+1,D.has(x.id),i)).join('')}</ol>`:''}${t.table!=null?tableHtml(s.table,`s${t.table}-t`,t.rows):''}</section>`;
  } else {
    body=ALL.map(si=>{ const s=G.sections[si], list=stepsOfSecs([si]);
      return `<section class="g-sec" id="s${si}" data-sec="${si}"><h2><small>${no(si)}</small>${esc(s.title)}</h2>${s.intro?`<p class="intro">${rich(s.intro)}</p>`:''}${s.introMore?moreHtml({info:s.introMore}):''}${s.warn?`<div class="callout warn"><span class="lbl">Heads up</span>${rich(s.warn)}</div>`:''}
      ${list.length?`<ol class="steps">${list.map((x,i)=>stepHtml(x,i+1,D.has(x.id),i)).join('')}</ol>`:''}${s.table?tableHtml(s.table,`s${si}-t`):''}</section>`; }).join('');
  }
  const toc=task?`<h5>${esc(g.name)}</h5>${TASKS.filter(x=>x.g===t.g).map(x=>`<a href="${taskHref(x)}" data-k="${x.k}"${x.k===t.k?' class="on" aria-current="page"':''}><span>${esc(x.title)}</span><small></small></a>`).join('')}<a href="#/"><span>← All tasks</span></a><a href="#/all"><span>Whole guide</span></a>`
    :`<h5>On this page</h5>${ALL.map(si=>`<a href="#/all~s${si}" data-a="s${si}"><span>${esc(G.sections[si].nav)}</span><small></small></a>`).join('')}<a href="#/all~tips" data-a="tips"><span>Good to know</span></a>`;
  const hasSteps=steps.length>0;
  return `${head}
  <div class="hair"></div>
  <div class="layout">
    <article>
      ${hasSteps?`<div class="dock"><div class="meter"><small><span>Your progress</span><b class="cnt"></b></small><div class="bar-o"><div class="bar-i"></div></div></div><button class="go" id="go" type="button">${SV.play}<b>Start step-by-step</b></button><button class="ghost" id="reset" type="button">Reset</button></div>
      ${panelHtml('before','Before you start',G.before)}`:''}
      ${body}
      ${hasSteps?panelHtml('tips','Good to know',G.tips):''}
      ${task?`<div class="pager">${prev?`<a href="${taskHref(prev)}"><small>← Previous</small>${esc(prev.title)}</a>`:'<a href="#/"><small>← Back</small>All tasks</a>'}${next?`<a class="nx" href="${taskHref(next)}"><small>Next →</small>${esc(next.title)}</a>`:'<a class="nx" href="#/"><small>Done →</small>All tasks</a>'}</div>`:''}
    </article>
    <aside class="toc" data-mode="${v.mode}">${toc}</aside>
  </div>`;
}
function showGuide(v,anchor,opts={}){
  const key=v.mode+':'+v.path, fresh=VIEW!==key;
  /* landing on an anchor: no entrance motion — a scaled/translated view makes scrollIntoView aim short */
  if(fresh){ CUR=v; VIEW=key; setView(`<div style="--c:${v.c}">${guideHtml(v)}</div>`,!anchor,()=>{ paintDock(); spy(); if(anchor) document.querySelectorAll('#view .rise').forEach(x=>x.classList.remove('rise')); }); }
  const go=()=>{ if(anchor){ const el=document.getElementById(anchor); if(el){ if(el.tagName==='DETAILS') el.open=true; if(el.tagName==='LI'&&!opts.quiet){ const m=el.querySelector('details.more'); if(m) m.open=true; }
      el.scrollIntoView({block:'start',behavior:fresh||RM()?'auto':'smooth'}); if(el.tagName==='LI'||el.tagName==='TR'){ el.classList.remove('hit'); void el.offsetWidth; el.classList.add('hit'); } } } else if(fresh) window.scrollTo(0,0); };
  if(fresh){ requestAnimationFrame(()=>requestAnimationFrame(go));
    /* web fonts can re-wrap the text above the target; settle once more if the reader hasn't moved */
    if(anchor&&document.fonts&&document.fonts.status!=='loaded'){ let y; requestAnimationFrame(()=>requestAnimationFrame(()=>{ y=scrollY; })); document.fonts.ready.then(()=>{ if(Math.abs(scrollY-y)<4) go(); }); } }
  else go();
}
/* old one-page links (#/~s4, #/~s4-2, #/~s4-t1, #/~tips) still land on the right task */
function legacy(a){
  let m;
  if((m=a.match(/^s(\d+)-t(\d+)$/))){ const t=rowTask(+m[1],+m[2]); if(t) return taskHref(t,a); }
  if((m=a.match(/^s(\d+)-(\d+)$/))){ const t=homeTask(+m[1],+m[2]); if(t) return taskHref(t,a); }
  if((m=a.match(/^s(\d+)$/))){ const t=secTask(+m[1]); if(t) return taskHref(t); }
  return '#/all~'+a;
}
function route(){
  if(WK) wkHide();
  let h=decodeURIComponent(location.hash.replace(/^#\/?/,''));
  if(h.startsWith('search/')){ const q=h.slice(7); if(qi.value.trim()!==q){ qi.value=q; $('#search').classList.toggle('has',!!q); } renderSearch(q); topMenu.sync(); return; }
  if(qi.value){ qi.value=''; $('#search').classList.remove('has'); }
  if(h.startsWith('~')){ const to=legacy(h.slice(1)); history.replaceState(null,'',to); h=to.slice(2); }
  const [path,anchor='']=h.split('~');
  const t=path.startsWith('do/')&&TASKS.find(x=>x.slug===path.slice(3));
  if(t) showGuide({mode:'task',path,t,c:grpOf(t).c,steps:stepsOfTask(t)},anchor);
  else if(path==='all') showGuide({mode:'all',path,c:'var(--c)',steps:STEPS},anchor);
  else renderHome();
  topMenu.sync();
}

/* ---------- scroll spy (whole-guide page) ---------- */
let IO=null;
function spy(){
  if(IO) IO.disconnect();
  if(!CUR||CUR.mode!=='all') return;
  const secs=[...document.querySelectorAll('.g-sec')]; if(!secs.length||!('IntersectionObserver' in window)) return;
  const vis=new Map();
  IO=new IntersectionObserver(es=>{ es.forEach(e=>vis.set(e.target.id,e.isIntersecting?e.boundingClientRect.top:null));
    const on=secs.find(s=>vis.get(s.id)!=null); mark(on?on.id:null); },{rootMargin:'-200px 0px -55% 0px'});
  secs.forEach(s=>IO.observe(s));
}
function mark(id){ document.querySelectorAll('.toc[data-mode="all"] a').forEach(a=>a.classList.toggle('on',a.dataset.a===id)); }

/* ---------- progress ---------- */
function paintDock(){
  if(!CUR) return; const steps=CUR.steps, d=getDone(), n=steps.filter(x=>d.has(x.id)).length, b=$('.dock .bar-i');
  if(b){ b.style.width=(steps.length?n/steps.length*100:0)+'%';
    $('.dock .cnt').textContent=`${n} of ${steps.length} done`;
    $('.dock .go b').textContent=n&&n<steps.length?'Resume step-by-step':'Start step-by-step'; }
  document.querySelectorAll('.toc a[data-k],.toc a[data-a^="s"]').forEach(a=>{ const ids=a.dataset.k!=null?stepsOfTask(TASKS[+a.dataset.k]).map(x=>x.id):stepsOfSecs([+a.dataset.a.slice(1)]).map(x=>x.id), k=ids.filter(x=>d.has(x)).length;
    const sm=a.querySelector('small'); if(sm) sm.textContent=ids.length?`${k}/${ids.length}`:''; a.classList.toggle('all',ids.length>0&&k===ids.length); });
}

/* ---------- search (indexes the hidden More-info text too) ---------- */
const IDX=[];
TASKS.forEach(t=>IDX.push({href:taskHref(t),kind:`${grpOf(t).name} · Task`,title:t.title,text:[t.title,t.intro||'',t.introMore||'',t.warn||''].join(' ')}));
G.sections.forEach((s,si)=>{
  s.steps.forEach((st,ti)=>{ const t=homeTask(si,ti); IDX.push({href:taskHref(t,`s${si}-${ti}`),kind:`${t.title} · Step ${t.items.findIndex(i=>!i.rep&&i.si===si&&i.ti===ti)+1}`,title:plain(st.text),text:[st.text,st.info||'',st.where||'',st.result||'',st.note||'',st.warn||'',...st.imgs.map(i=>i.cap)].join(' ')}); });
  if(s.table) s.table.rows.forEach((r,ri)=>{ const t=rowTask(si,ri); IDX.push({href:taskHref(t,`s${si}-t${ri}`),kind:`${t.title} · Table`,title:plain(r[0]),text:r.join(' ')}); });
});
G.before.forEach(t=>IDX.push({href:'#/all~before',kind:'Before you start',title:'Before you start',text:t}));
G.tips.forEach(t=>IDX.push({href:'#/all~tips',kind:'Good to know',title:'Good to know',text:t}));
IDX.forEach(r=>{ r.text=plain(r.text).replace(/\s+/g,' ').trim(); r.lc=(r.title+' '+r.text).toLowerCase(); });
const SYN={"qr": ["qr code", "scan"], "scan": ["qr", "camera"], "code": ["lpa", "qr", "passcode"], "manual": ["enter it manually", "enter details manually", "enter code manually", "lpa"], "iphone": ["apple", "ios"], "apple": ["iphone"], "android": ["samsung", "pixel", "motorola"], "galaxy": ["samsung"], "google": ["pixel"], "moto": ["motorola"], "watch": ["smartwatch"], "smartwatch": ["watch"], "sim": ["esim", "psim"], "card": ["psim", "sim card"], "physical": ["psim"], "xm360": ["xm 360"], "imei": ["imei 1"], "locked": ["unlock", "lock"], "unlock": ["locked"], "port": ["transfer", "porting"], "transfer": ["quick transfer", "port"], "sos": ["no service"], "service": ["bars", "sos"], "delete": ["erase", "remove"], "reset": ["factory", "erase"], "replacement": ["insurance", "oem", "assurant"], "insurance": ["xmc", "assurant"], "app": ["xfinity app"], "activate": ["activation"], "error": ["byo200", "retry"], "status": ["network status", "rs", "cn"], "ready": ["rs"], "reissue": ["new esim"], "dual": ["dual sim", "dual-sim"], "number": ["port", "mdn"], "iccid": ["scan iccid"], "swap": ["switch", "replace sim"]};
function search(q){
  const terms=q.toLowerCase().split(/\s+/).filter(Boolean); if(!terms.length) return [];
  const has=(r,t)=>r.lc.includes(t)||(SYN[t]||[]).some(x=>r.lc.includes(x))||(t.length>3&&t.endsWith('s')&&r.lc.includes(t.slice(0,-1)));
  return IDX.filter(r=>terms.every(t=>has(r,t))).map(r=>{ let sc=0; terms.forEach(t=>{ if(r.title.toLowerCase().includes(t)) sc+=4; if(r.lc.includes(t)) sc+=2; }); if(/Task$/.test(r.kind)) sc+=1; return {r,sc}; }).sort((a,b)=>b.sc-a.sc).slice(0,40);
}
function snippet(text,terms){
  const lc=text.toLowerCase(); let at=-1;
  for(const t of terms){ const k=lc.indexOf(t); if(k>=0&&(at<0||k<at)) at=k; }
  let s=at>60?'…'+text.slice(at-50):text; if(s.length>200) s=s.slice(0,200)+'…';
  let out=esc(s); for(const t of terms){ if(t.length<2) continue; out=out.replace(new RegExp('('+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'),'<mark>$1</mark>'); }
  return out;
}
function renderSearch(q){
  const anim=VIEW!=='search'; VIEW='search'; CUR=null; if(IO) IO.disconnect();
  const terms=q.toLowerCase().split(/\s+/).filter(Boolean), res=search(q);
  setView(`<section class="s-head"><div class="eyebrow">Search this guide</div><h1>“${esc(q)}”</h1><p>${res.length?`${res.length} match${res.length===1?'':'es'}`:'No matches. Try a shorter word: QR, Samsung, SOS, watch, IMEI, pSIM.'}</p><button type="button" id="s-back">← Back to the tasks</button></section>
  <div class="hits">${res.map(({r},k)=>`<a class="hit${anim?' rise':''}" style="--i:${k}" href="${r.href}"><div class="where">${esc(r.kind)}</div><h4>${esc(r.title)}</h4><p>${snippet(r.text,terms)}</p></a>`).join('')}</div>`,anim);
  window.scrollTo(0,0);
}
const qi=$('#q'); let qt=null;
qi.addEventListener('input',()=>{ $('#search').classList.toggle('has',!!qi.value); clearTimeout(qt); qt=setTimeout(()=>{ const v=qi.value.trim(); if(v) history.replaceState(null,'','#/search/'+encodeURIComponent(v)); else history.replaceState(null,'','#/'); route(); },140); });
qi.addEventListener('keydown',e=>{ if(e.key==='Enter'){ const first=$('a.hit'); if(first) first.click(); qi.blur(); } if(e.key==='Escape'){ qi.value=''; qi.dispatchEvent(new Event('input')); } });
$('#q-clear').addEventListener('click',()=>{ qi.value=''; qi.dispatchEvent(new Event('input')); qi.focus(); });
document.addEventListener('keydown',e=>{ const typing=/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName); if(!typing&&(e.key==='/'||((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'))&&!WK){ e.preventDefault(); qi.focus(); qi.select(); } if(e.key==='Escape'&&$('#lb').classList.contains('on')){ closeLB(); e.stopImmediatePropagation(); return; } if((e.key==='Enter'||e.key===' ')&&!typing&&document.activeElement.matches('figure.shot')){ e.preventDefault(); document.activeElement.click(); } });

/* ---------- lightbox ---------- */
let LBret=null;
function openLB(im,qr){ LBret=document.activeElement; $('#lb img').src=im.src; $('#lb img').alt=im.alt; $('#lb p').textContent=qr?'Customer: open your phone’s Camera and point it at this code.':im.alt; $('#lb').classList.remove('zoom'); $('#lb').classList.toggle('qrmode',!!qr); $('#lb').classList.add('on'); $('#lb button').focus(); }
function closeLB(){ const was=$('#lb').classList.contains('on'); $('#lb').classList.remove('on','zoom','qrmode'); if(was&&LBret&&LBret.focus&&document.contains(LBret)) LBret.focus({preventScroll:true}); LBret=null; }
$('#lb').addEventListener('click',e=>{ if(e.target.tagName==='IMG'){ if(!$('#lb').classList.contains('qrmode')) $('#lb').classList.toggle('zoom'); return; } closeLB(); });

/* ---------- clicks ---------- */
document.addEventListener('click',e=>{
  if(e.target.closest('#s-back')){ location.hash='#/'; return; }
  const qc=e.target.closest('.qrcard'); if(qc){ openLB(qc.querySelector('img'),true); return; }
  const f=e.target.closest('figure.shot'); if(f){ openLB(f.querySelector('img'),f.classList.contains('qr')); return; }
  const cd=e.target.closest('.step-body code, td code, .callout code'); if(cd){ copyCode(cd); return; }
  const nb=e.target.closest('.num'); if(nb){ const d=getDone(), id=nb.dataset.sid, li=nb.closest('li');
    if(d.has(id)){ d.delete(id); li.classList.remove('done'); nb.setAttribute('aria-pressed','false'); } else { d.add(id); li.classList.add('done'); nb.setAttribute('aria-pressed','true'); burst(nb,8); }
    setDone(d); paintDock(); return; }
  if(e.target.closest('#go')){ if(CUR&&CUR.steps.length) wkOpen(CUR.steps,CUR.mode==='task'?CUR.t.title:G.title); return; }
  if(e.target.closest('#go-all')){ wkOpen(STEPS,G.title); return; }
  if(e.target.closest('#reset')){ const d=getDone(); if(CUR) CUR.steps.forEach(x=>d.delete(x.id)); setDone(d); document.querySelectorAll('ol.steps li.done').forEach(li=>{ li.classList.remove('done'); li.querySelector('.num').setAttribute('aria-pressed','false'); }); paintDock(); return; }
  /* same-hash anchor clicks still jump (hashchange won't fire) */
  const a=e.target.closest('a[href^="#/"]'); if(a&&a.getAttribute('href').includes('~')&&a.getAttribute('href')===location.hash){ e.preventDefault(); route(); }
});
function copyCode(el){ const txt=el.textContent; const done=()=>{ el.classList.add('copied'); setTimeout(()=>el.classList.remove('copied'),1400); };
  if(navigator.clipboard&&window.isSecureContext) navigator.clipboard.writeText(txt).then(done,()=>{}); else { const r=document.createRange(); r.selectNodeContents(el); const s=getSelection(); s.removeAllRanges(); s.addRange(r); try{ document.execCommand('copy'); done(); }catch(_){} } }
function burst(el,n){ if(RM()) return; const r=el.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2, cols=['#5be3a0','#f0cf86','#ff7eb6','#5cc8ff','#ffb05c'];
  for(let k=0;k<n;k++){ const p=document.createElement('i'); p.className='spark'; const a=Math.random()*Math.PI*2, d=40+Math.random()*(n>12?160:60);
    p.style.cssText=`left:${cx}px;top:${cy}px;background:${cols[k%cols.length]};--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d}px;--r:${Math.random()*540}deg`; document.body.appendChild(p); setTimeout(()=>p.remove(),1200); } }

/* ---------- step-by-step walkthrough (scoped to the task you're on) ---------- */
let WK=null;
function wkOpen(list,title){ const d=getDone(); let i=list.findIndex(x=>!d.has(x.id)); if(i<0) i=0;
  WK={i,list}; $('#wk-title').textContent=title||G.title; $('#wk').style.setProperty('--c',CUR?CUR.c:'var(--c)'); $('#wk').classList.add('on'); document.body.style.overflow='hidden'; wkRender(0); $('#wk-next').focus(); }
function wkHide(){ $('#wk').classList.remove('on'); document.body.style.overflow=''; WK=null; }
function wkClose(){ if(!WK) return; const at=WK.list[Math.min(WK.i,WK.list.length-1)]; wkHide();
  if(CUR){ const v=CUR; VIEW=''; showGuide(v,at&&v.steps.some(x=>x.id===at.id)?at.id:'',{quiet:true}); } else { VIEW=''; renderHome(); } }
function wkRender(dir){ const L=WK.list, i=WK.i, stg=$('#wk-stage');
  if(i>=L.length){ $('#wk-sec').textContent='Finished'; $('#wk-bar').style.width='100%';
    stg.innerHTML=`<div class="wk-card wk-done in-r"><div class="ring">${SV.check}</div><h2>All ${L.length} steps done.</h2><p>${esc($('#wk-title').textContent)} — nice work.</p></div>`;
    $('#wk-next').innerHTML='Back to the guide'; $('#wk-back').disabled=false; burst($('.wk-done .ring'),36); return; }
  const x=L[i]; $('#wk-sec').textContent=CUR&&CUR.mode==='task'?grpOf(CUR.t).name:x.sec; $('#wk-bar').style.width=(i/L.length*100)+'%';
  stg.innerHTML=`<div class="wk-card ${dir<0?'in-l':'in-r'}"><div class="wk-count"><span class="big">${i+1}</span><span>Step ${i+1} of ${L.length}<br>${esc(x.sec)}</span></div><p class="wk-text">${rich(x.st.text)}</p>${stepInner(x.st)}${wkTable(L,i)}<p class="wk-hint">Tap a picture to zoom · Swipe or use ← → keys</p></div>`;
  stg.scrollTop=0; $('#wk-back').disabled=i===0;
  $('#wk-next').innerHTML=i===L.length-1?`Done — finish ${SV.check}`:`Done — next step ${SV.arr}`; }
/* the task's table rides along on the step that points to it ("table below"), or the task's last step */
function wkTable(L,i){
  const x=L[i]; let si, rows;
  if(CUR&&CUR.mode==='task'){ if(CUR.t.table==null) return ''; si=CUR.t.table; rows=CUR.t.rows; }
  else { si=x.si; if(!G.sections[si].table) return ''; }
  const mine=L.map((y,k)=>[y,k]).filter(([y])=>CUR&&CUR.mode==='task'?true:y.si===si);
  const r=mine.find(([y])=>/table below/i.test([y.st.text,y.st.info,y.st.where,y.st.result,y.st.note,y.st.warn].join(' ')));
  const at=r?r[1]:mine[mine.length-1][1];
  return i===at?tableHtml(G.sections[si].table,'wk-t',rows):''; }
function wkNext(){ if(!WK) return; if(WK.i>=WK.list.length){ wkClose(); return; } const d=getDone(); d.add(WK.list[WK.i].id); setDone(d); WK.i++; wkRender(1); }
function wkPrev(){ if(!WK||WK.i===0) return; WK.i--; wkRender(-1); }
$('#wk-next').addEventListener('click',wkNext); $('#wk-back').addEventListener('click',wkPrev); $('#wk-x').addEventListener('click',wkClose);
document.addEventListener('keydown',e=>{ if(!WK||$('#lb').classList.contains('on')) return; if(e.key==='ArrowRight'){e.preventDefault();wkNext();} else if(e.key==='ArrowLeft'){e.preventDefault();wkPrev();} else if(e.key==='Escape'){wkClose();} });
let tx=null; $('#wk-stage').addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
$('#wk-stage').addEventListener('touchend',e=>{ if(tx==null) return; const dx=e.changedTouches[0].clientX-tx; tx=null; if(Math.abs(dx)>70){ dx<0?wkNext():wkPrev(); } },{passive:true});

/* sticky dock / TOC sit right under the header, whatever height it wraps to */
const HDR=$('header.top'); const setHdr=()=>document.documentElement.style.setProperty('--hdr',HDR.offsetHeight+'px');
setHdr(); if('ResizeObserver' in window) new ResizeObserver(setHdr).observe(HDR); else addEventListener('resize',setHdr,{passive:true});

/* ---------- top-right menu ---------- */
topMenu.build([...G.groups.map(g=>({name:g.name,c:g.c,items:TASKS.filter(t=>t.g===g.id).map(t=>({label:t.title,href:taskHref(t)}))})),{name:'Whole guide',c:'var(--brass)',href:'#/all',items:[]}]);

window.addEventListener('hashchange',route);
route();
</script>
