<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="theme-color" content="#000000">
<title>eSIM Xfinity Mobile Activation Guide</title>
<style>
  @font-face { font-family: 'Archivo'; font-style: normal; font-weight: 300 700; font-stretch: 62% 125%; font-display: swap;
    src: url(../../assets/fonts/archivo-latin.e3a28eade2.woff2) format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: 'Bodoni Moda'; font-style: normal; font-weight: 400 900; font-display: swap;
    src: url(../../assets/fonts/bodoni-moda-latin.c032219ef6.woff2) format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: 'Bodoni Moda'; font-style: italic; font-weight: 400 700; font-display: swap;
    src: url(../../assets/fonts/bodoni-moda-italic-latin.b737328c13.woff2) format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
</style>
<style>
/* Same design system as tools/csg-how-to (CSG How To Guides), so the guides read as one set.
   Accent is Xfinity Mobile violet. Built from tools/internet-essentials (Oct 2026). */
:root{
  --ink:#000;--ink-1:#07090c;--ink-2:#0d1116;--ink-3:#151b22;
  --line:rgba(255,255,255,.08);--line-2:rgba(255,255,255,.14);
  --text:#f2efe8;--text-2:#b9b4aa;--text-3:#7d7a74;
  --brass:#d4a94f;--brass-2:#f0cf86;--brass-dim:rgba(212,169,79,.16);
  --c:#b79cff;
  --warn:#ff8a65;--ok:#5be3a0;
  --display:'Bodoni Moda',Didot,'Times New Roman',serif;
  --sans:'Archivo',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:ui-monospace,'JetBrains Mono',Consolas,monospace;
  --r:4px;--gut:16px;--max:1180px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(var(--hdr,65px) + 100px)}
body{margin:0;background:var(--ink);color:var(--text);font:400 16px/1.6 var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(900px 500px at 85% -10%,rgba(183,156,255,.10),transparent 60%),radial-gradient(700px 500px at -10% 110%,rgba(212,169,79,.07),transparent 60%)}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--brass-2);outline-offset:2px;border-radius:2px}
.wrap{position:relative;z-index:1;max-width:var(--max);margin:0 auto;padding:0 var(--gut)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.hair{height:1px;background:linear-gradient(90deg,transparent,var(--c) 20%,var(--c) 80%,transparent);opacity:.45}

/* ---------- header ---------- */
header.top{position:sticky;top:0;z-index:20;background:rgba(0,0,0,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:14px;height:64px}
.brand{display:flex;align-items:baseline;gap:10px;text-decoration:none;white-space:nowrap}
.brand b{font:700 24px/1 var(--display)}
.brand b em{color:var(--c)}
.brand span{font:600 10px/1 var(--sans);letter-spacing:.28em;text-transform:uppercase;color:var(--text-3)}
.search{position:relative;flex:1;max-width:520px;margin-left:auto}
.search input{width:100%;height:44px;padding:0 44px 0 42px;background:var(--ink-2);border:0;box-shadow:inset 0 0 0 1px var(--line-2);border-radius:999px;color:var(--text);font:500 15px var(--sans)}
.search input::placeholder{color:var(--text-3)}
.search input:focus{outline:none;box-shadow:inset 0 0 0 1px var(--c)}
.search input::-webkit-search-cancel-button{display:none}
.search svg{position:absolute;left:15px;top:13px;width:18px;height:18px;stroke:var(--text-3)}
.search kbd{position:absolute;right:12px;top:11px;font:500 11px var(--mono);color:var(--text-3);border:1px solid var(--line-2);border-radius:4px;padding:2px 6px}
.search .clear{position:absolute;right:6px;top:4px;width:36px;height:36px;border-radius:50%;color:var(--text-2);display:none;font-size:20px}
.search.has .clear{display:block}.search.has kbd{display:none}

/* ---------- guide page ---------- */
.g-head{padding:44px 0 28px}
.eyebrow{font:600 12px/1 var(--sans);letter-spacing:.28em;text-transform:uppercase;color:var(--c)}
.g-head h1{font:700 clamp(38px,7vw,76px)/1 var(--display);margin:14px 0 16px;max-width:18ch;letter-spacing:-.012em}
.g-head h1 em{background:linear-gradient(100deg,var(--c) 0%,#dccfff 40%,#f6f2ff 50%,#dccfff 60%,var(--c) 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sheen 5s ease-in-out infinite;font-style:italic}
@keyframes sheen{0%,100%{background-position:100% 0}50%{background-position:0 0}}
.g-head .sum{font-size:18px;color:var(--text-2);max-width:62ch;margin:0}
.g-head .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:18px}
.tag{font:600 11px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;padding:5px 8px;border-radius:3px;background:var(--ink-3);color:var(--text-2)}
.layout{display:grid;grid-template-columns:1fr;gap:32px;padding:28px 0 80px}
@media(min-width:980px){.layout{grid-template-columns:minmax(0,1fr) 260px}}
.toc{display:none}
@media(min-width:980px){.toc{display:block;position:sticky;top:calc(var(--hdr,65px) + 24px);align-self:start}}
.toc h5{margin:0 0 10px;font:600 11px var(--sans);letter-spacing:.24em;text-transform:uppercase;color:var(--text-3)}
.toc a{display:flex;justify-content:space-between;gap:8px;padding:7px 0 7px 14px;border-left:1px solid var(--line-2);text-decoration:none;color:var(--text-2);font-size:14px;transition:color .15s,border-color .15s}
.toc a small{color:var(--text-3);font-size:12px}
.toc a:hover,.toc a.on{color:var(--text);border-color:var(--c)}
.toc a.all small{color:var(--ok)}
.g-sec{margin-bottom:44px}
.g-sec h2{display:flex;align-items:center;gap:12px;font:700 28px/1.15 var(--display);margin:0 0 6px}
.g-sec h2::before{content:"";flex:none;width:22px;height:2px;background:var(--c)}
.g-sec .intro{color:var(--text-2);margin:0 0 18px}
.g-sec .intro b{color:var(--text)}
ol.steps{list-style:none;margin:0;padding:0;display:grid;gap:12px}
ol.steps>li{position:relative;display:grid;grid-template-columns:52px 1fr;gap:14px;padding:18px;border-radius:6px;background:var(--ink-1);box-shadow:inset 0 0 0 1px var(--line);transition:background .25s,box-shadow .25s,opacity .25s}
ol.steps>li.hit{box-shadow:inset 0 0 0 1px var(--brass);animation:glow 1.6s}
@keyframes glow{0%{background:rgba(212,169,79,.18)}100%{background:var(--ink-1)}}
.step-body{min-width:0}
.step-body .do{margin:8px 0 0;font-size:18px;line-height:1.5}
.step-body code{font:500 .9em var(--mono);background:var(--ink-3);color:var(--brass-2);padding:2px 6px;border-radius:3px}
.callout{margin-top:12px;padding:12px 14px;border-radius:4px;font-size:15px;background:var(--ink-2);box-shadow:inset 3px 0 0 var(--brass)}
.callout.warn{box-shadow:inset 3px 0 0 var(--warn)}
.callout .lbl{display:block;font:700 11px var(--sans);letter-spacing:.18em;text-transform:uppercase;margin-bottom:4px;color:var(--brass-2)}
.callout.warn .lbl{color:var(--warn)}
.callout a,.mrow a,.panel a{color:var(--brass-2)}
.shots{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}
figure.shot{width:fit-content;max-width:100%;margin:14px 0 0;border-radius:6px;overflow:hidden;background:#e8ebef;box-shadow:0 0 0 1px var(--line-2),0 12px 40px rgba(0,0,0,.5);cursor:zoom-in;position:relative}
figure.shot img{display:block;width:100%;height:auto;margin:0 auto;transition:transform .5s cubic-bezier(.16,1,.3,1)}
figure.shot:hover img{transform:scale(1.015)}
figure.shot figcaption{background:var(--ink-2);color:var(--text-3);font-size:13px;padding:8px 12px}
figure.shot::after{content:"Tap to enlarge";position:absolute;right:10px;top:10px;font:600 11px var(--sans);letter-spacing:.08em;padding:5px 8px;border-radius:3px;background:rgba(0,0,0,.72);color:#fff;opacity:0;transition:.2s}
figure.shot:hover::after{opacity:1}
/* tall phone-camera shots read better side by side than stacked */
@media(min-width:700px){.shots.pair figure.shot{max-width:calc(50% - 6px)}}
.panel{padding:20px;border-radius:6px;background:var(--ink-1);box-shadow:inset 0 0 0 1px var(--line);margin-bottom:28px}
.panel h3{margin:0 0 10px;font:700 22px var(--display)}
.panel ul{margin:0;padding-left:20px;color:var(--text-2)}
.panel li b{color:var(--text)}
.panel li+li{margin-top:6px}
.src{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 12px;border-radius:999px;text-decoration:none;font-weight:600;font-size:12px;box-shadow:inset 0 0 0 1px var(--line-2)}
.src:hover{box-shadow:inset 0 0 0 1px var(--c);color:var(--c)}
.tbl{margin-top:14px;border-radius:6px;overflow:auto;box-shadow:inset 0 0 0 1px var(--line)}
.tbl table{width:100%;border-collapse:collapse;font-size:15px}
.tbl th{text-align:left;font:600 11px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--c);background:var(--ink-2);padding:12px 14px;border-bottom:1px solid var(--line-2)}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--text)}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.hit td{background:rgba(212,169,79,.16)}
@media(max-width:640px){
  .tbl{box-shadow:none;overflow:visible}
  .tbl thead{display:none}
  .tbl table,.tbl tbody,.tbl tr,.tbl td{display:block;width:100%}
  .tbl tr{margin-bottom:10px;border-radius:6px;background:var(--ink-1);box-shadow:inset 0 0 0 1px var(--line);padding:6px 0}
  .tbl td{border:0;padding:6px 14px}
  .tbl td::before{content:attr(data-h);display:block;font:600 10px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--c)}
}

/* ---------- search ---------- */
.s-head{padding:40px 0 20px}
.s-head h1{font:700 clamp(32px,5vw,48px)/1.1 var(--display);margin:10px 0 0}
.s-head p{color:var(--text-2);margin:8px 0 0}
.s-head button{margin-top:14px;color:var(--text-2);text-decoration:underline;font-size:14px}
.hits{display:grid;gap:10px;padding-bottom:80px}
a.hit{display:block;padding:18px;border-radius:6px;text-decoration:none;background:var(--ink-1);box-shadow:inset 0 0 0 1px var(--line)}
a.hit:hover{background:var(--ink-2)}
a.hit .where{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--c);font-weight:600}
a.hit h4{margin:6px 0 4px;font:600 18px/1.3 var(--sans)}
a.hit p{margin:0;color:var(--text-2);font-size:15px}
mark{background:rgba(240,207,134,.25);color:var(--brass-2);border-radius:2px;padding:0 2px}

/* ---------- motion ---------- */
#view{view-transition-name:view}
::view-transition-old(view){animation:vtOut .28s cubic-bezier(.4,0,1,1) both}
::view-transition-new(view){animation:vtIn .55s cubic-bezier(.16,1,.3,1) both}
@keyframes vtOut{to{opacity:0;transform:translateY(-14px) scale(.985);filter:blur(6px)}}
@keyframes vtIn{from{opacity:0;transform:translateY(28px) scale(.975);filter:blur(10px)}}
#view.enter{animation:vtIn .55s cubic-bezier(.16,1,.3,1) both}
.rise{animation:rise .6s cubic-bezier(.16,1,.3,1) both;animation-delay:calc(min(var(--i,0),14) * 45ms)}
@keyframes rise{from{opacity:0;transform:translateY(22px) scale(.98)}}

/* step check-offs */
.num{position:relative;display:grid;place-items:center;width:44px;height:44px;border-radius:50%;font:700 19px var(--display);color:#000;background:var(--c);transition:transform .2s cubic-bezier(.3,1.6,.5,1),background .2s}
.num:hover{transform:scale(1.08)}
.num svg{position:absolute;width:22px;height:22px;opacity:0;transform:scale(.4);transition:.25s cubic-bezier(.3,1.6,.5,1)}
.num span{transition:.2s}
li.done .num{background:var(--ok);animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
li.done .num span{opacity:0;transform:scale(.4)}
li.done .num svg{opacity:1;transform:scale(1)}
@keyframes pop{40%{transform:scale(1.25);box-shadow:0 0 0 10px rgba(91,227,160,.18)}}
li.done{background:rgba(91,227,160,.035)!important;box-shadow:inset 0 0 0 1px rgba(91,227,160,.28)!important}
li.done .do{color:var(--text-2)}
.mrow{display:flex;gap:10px;align-items:flex-start;margin-top:10px;font-size:15px;color:var(--text-2)}
.mrow svg{flex:none;width:18px;height:18px;margin-top:2px;stroke:var(--c)}
.mrow b{color:var(--text);font-weight:600}

/* progress dock */
.dock{position:sticky;top:calc(var(--hdr,65px) + 10px);z-index:15;margin:0 0 26px;padding:12px 14px;border-radius:8px;background:rgba(10,13,17,.86);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:inset 0 0 0 1px var(--line-2),0 10px 30px rgba(0,0,0,.4);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.dock .meter{flex:1;min-width:140px}
.dock .meter small{display:flex;justify-content:space-between;font-size:12px;color:var(--text-3);letter-spacing:.06em;margin-bottom:6px}
.dock .meter small b{color:var(--text)}
.bar-o{height:6px;border-radius:99px;background:var(--ink-3);overflow:hidden}
.bar-i{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--c),var(--ok));transition:width .6s cubic-bezier(.16,1,.3,1)}
.go{display:inline-flex;align-items:center;gap:10px;height:46px;padding:0 20px;border-radius:999px;background:var(--c);color:#000;font-weight:700;font-size:15px;letter-spacing:.02em;position:relative;overflow:hidden;transition:transform .15s}
.go:hover{transform:translateY(-1px)}
.go::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);transform:translateX(-120%);animation:sweep 3.2s 1s ease-in-out infinite}
@keyframes sweep{60%,100%{transform:translateX(120%)}}
.go svg{width:18px;height:18px}
.ghost{height:46px;padding:0 14px;border-radius:999px;color:var(--text-2);font-size:14px;box-shadow:inset 0 0 0 1px var(--line-2)}
.ghost:hover{color:var(--text)}

/* walkthrough */
#wk{position:fixed;inset:0;z-index:70;display:none;flex-direction:column;background:radial-gradient(1200px 600px at 50% -10%,rgba(183,156,255,.14),transparent 60%),#000;color:var(--text)}
#wk.on{display:flex;animation:wkIn .5s cubic-bezier(.16,1,.3,1)}
@keyframes wkIn{from{opacity:0;transform:scale(1.04)}}
.wk-top{display:flex;align-items:center;gap:14px;padding:14px var(--gut);border-bottom:1px solid var(--line)}
.wk-top .t{flex:1;min-width:0}
.wk-top .t b{display:block;font:700 18px var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk-top .t small{color:var(--c);font:600 11px var(--sans);letter-spacing:.18em;text-transform:uppercase}
.wk-x{width:44px;height:44px;border-radius:50%;background:var(--ink-3);font-size:22px;flex:none}
.wk-prog{height:4px;background:var(--ink-3)}
.wk-prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--c),var(--ok));transition:width .5s cubic-bezier(.16,1,.3,1);box-shadow:0 0 18px var(--c)}
.wk-stage{flex:1;overflow:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:22px var(--gut) 30px}
.wk-card{max-width:980px;margin:0 auto}
.wk-card.in-r{animation:inR .45s cubic-bezier(.16,1,.3,1)}
.wk-card.in-l{animation:inL .45s cubic-bezier(.16,1,.3,1)}
@keyframes inR{from{opacity:0;transform:translateX(60px);filter:blur(8px)}}
@keyframes inL{from{opacity:0;transform:translateX(-60px);filter:blur(8px)}}
.wk-count{display:flex;align-items:center;gap:12px;color:var(--text-3);font:600 12px var(--sans);letter-spacing:.16em;text-transform:uppercase}
.wk-count .big{display:grid;place-items:center;width:58px;height:58px;border-radius:50%;background:var(--c);color:#000;font:700 26px var(--display);letter-spacing:0;animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
.wk-text{font:600 clamp(22px,3.4vw,32px)/1.3 var(--sans);margin:18px 0 6px;letter-spacing:-.005em}
.wk-card .mrow{font-size:17px}
.wk-card figure.shot{margin-top:18px;width:fit-content!important}
.wk-card figure.shot img{max-height:58vh;width:auto;max-width:100%;object-fit:contain;background:#fff}
.wk-nav{display:flex;gap:10px;padding:12px var(--gut) calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:rgba(0,0,0,.6)}
.wk-nav button{height:56px;border-radius:12px;font-weight:700;font-size:16px}
.wk-back{width:120px;box-shadow:inset 0 0 0 1px var(--line-2);color:var(--text-2)}
.wk-back:disabled{opacity:.35}
.wk-next{flex:1;background:var(--c);color:#000;display:flex;align-items:center;justify-content:center;gap:10px}
.wk-next svg{width:20px;height:20px}
.wk-hint{color:var(--text-3);font-size:12px;text-align:center;margin-top:14px}
.wk-done{text-align:center;padding:12vh 0}
.wk-done .ring{width:120px;height:120px;margin:0 auto 26px;border-radius:50%;display:grid;place-items:center;background:var(--ok);color:#000;animation:pop .7s cubic-bezier(.3,1.6,.5,1);position:relative}
.wk-done .ring::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--ok);animation:ripple 1.6s ease-out infinite}
@keyframes ripple{to{inset:-40px;opacity:0}}
.wk-done .ring svg{width:56px;height:56px}
.wk-done h2{font:700 clamp(32px,6vw,54px)/1.05 var(--display);margin:0 0 10px}
.wk-done p{color:var(--text-2)}
.spark{position:fixed;width:8px;height:8px;border-radius:2px;pointer-events:none;z-index:80;animation:spark 1.1s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}

/* lightbox */
#lb{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.94);display:none;place-items:center;padding:20px;overflow:auto}
#lb.on{display:grid}
#lb img{max-width:100%;max-height:86vh;border-radius:4px;background:#fff;cursor:zoom-in;transition:max-width .3s,max-height .3s}
#lb p{color:var(--text-2);text-align:center;font-size:14px;max-width:70ch;margin:12px auto 0}
#lb button{position:fixed;top:14px;right:14px;width:44px;height:44px;border-radius:50%;background:var(--ink-3);font-size:22px;z-index:1}
#lb.zoom{place-items:start;align-content:start}
#lb.zoom img{max-width:none;max-height:none;width:auto;cursor:zoom-out}

footer{padding:40px 0 60px;color:var(--text-3);font-size:13px;border-top:1px solid var(--line)}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}

@media(max-width:640px){
  .bar{height:auto;flex-wrap:nowrap;padding:10px 0 8px;gap:10px}
  .brand b{font-size:19px;line-height:1.05}
  .brand b em{display:block}
  .brand span{display:none}
  .search{max-width:none;flex:1;min-width:0}
  .search input{font-size:16px;padding-right:12px}
  .search kbd{display:none}
  .g-head{padding:30px 0 20px}
  .g-head .sum{font-size:16px}
  ol.steps>li{grid-template-columns:1fr;gap:6px;padding:16px}
  .dock{padding:10px 12px;gap:10px}
  .dock .meter{min-width:96px}
  .go{flex:1 0 auto;justify-content:center;white-space:nowrap;padding:0 16px}
  .go svg{flex:none}
  .ghost{display:none}
  .dock .meter small span{display:none}
}
@media(pointer:coarse){.src{height:44px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Long URLs (e.g. support.internetessentials.com/en/agent/agentsearch) must wrap on phones */
.step-body a,.callout a,.mrow a,.panel a,td a,.intro a,.wk-text a{overflow-wrap:anywhere;word-break:break-word}

/* ---- eSIM guide: QR codes + copyable codes ---- */

<script>
const topMenu=(()=>{
  const btn=()=>document.getElementById('mnu-btn'), nav=()=>document.getElementById('mnu');
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  let wired=false;
  function place(){ const h=document.querySelector('header.top'); if(h) document.documentElement.style.setProperty('--mnu-top',(h.getBoundingClientRect().bottom+8)+'px'); }
  function open(){ place(); nav().classList.add('on'); btn().setAttribute('aria-expanded','true'); btn().setAttribute('aria-label','Close menu'); const cur=nav().querySelector('a[aria-current]')||nav().querySelector('a'); if(cur){ cur.scrollIntoView({block:'nearest'}); cur.focus({preventScroll:true}); } }
  function close(refocus){ if(!nav().classList.contains('on')) return; nav().classList.remove('on'); btn().setAttribute('aria-expanded','false'); btn().setAttribute('aria-label','Open menu'); if(refocus) btn().focus({preventScroll:true}); }
  function build(groups){
    nav().innerHTML=`<a class="mnu-home" href="#/">Home</a>`+groups.map(g=>`<div class="mnu-g" style="--c:${g.c||'var(--brass)'}">${g.href&&!(g.items||[]).length?`<a href="${esc(g.href)}" style="padding-left:12px;font-weight:600">${esc(g.name)}</a>`:`<h6><i></i>${esc(g.name)}</h6>${(g.items||[]).map(it=>`<a href="${esc(it.href)}">${esc(it.label)}</a>`).join('')}`}</div>`).join('');
    if(!wired){ wired=true;
      btn().addEventListener('click',e=>{ e.stopPropagation(); nav().classList.contains('on')?close(true):open(); });
      nav().addEventListener('click',e=>{ if(e.target.closest('a')) close(false); });
      document.addEventListener('click',e=>{ if(!e.target.closest('#mnu,#mnu-btn')) close(false); });
      document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&nav().classList.contains('on')){ e.stopImmediatePropagation(); close(true); } },true);
      addEventListener('hashchange',()=>{ close(false); sync(); });
      addEventListener('resize',place,{passive:true});
    }
    sync();
  }
  function sync(){
    const h=location.hash||'#/';
    let best=null,len=0;
    nav().querySelectorAll('a').forEach(a=>{ a.removeAttribute('aria-current'); const href=a.getAttribute('href'); const key=href.split('~')[0];
      if((h===href||h.split('~')[0]===key||(key!=='#/'&&h.startsWith(key+'/')))&&key.length>len){ best=a; len=key.length; } });
    if(best) best.setAttribute('aria-current','page');
  }
  return {build,sync,open,close};
})();
</script>

 Mobile or NOW Mobile), even on a dual-SIM phone. The second slot can be another carrier or a travel data plan.","**Billing start:** BYOD eSIM and in-stock purchases bill when the order completes. Shipped devices and pSIM cards bill on delivery. Smartwatches bill at setup or 7 days after purchase, whichever is first.","A **one-time $25 line activation fee** applies to every new phone or tablet line.","Deleting an eSIM **doesn't cancel the plan**. Erasing the phone lets the customer choose to **keep** the eSIM.","Never try a SIM swap or a line deactivation on a device that isn't working or doesn't seem to have an eSIM. Troubleshoot first, then escalate through standard procedures.","Everything here applies to **NOW Mobile** customers too."],"sections":[{"title":"Scan to activate: the QR codes","nav":"QR codes","qr":true,"intro":"Tap **Show full screen** to hold a code up for the customer.","steps":[{"text":"**eSIM download QR:** have the customer scan it with the **Camera**.","imgs":[{"f":"464b830b3a.svg","w":300,"h":300,"qr":1,"data":"LPA:1$cct.vzw.otgeuicc.com$","cap":"eSIM download QR. Scans to **LPA:1$cct.vzw.otgeuicc.com$** — the Xfinity Mobile eSIM server.","alt":"QR code that downloads the Xfinity Mobile eSIM."}],"warn":"The device has to be in **RS (Ready State)** in XM360 first, or the download has nothing to pick up. Show the code on a **different screen** from the phone being activated.","note":"It's the same code for every customer. It points the phone at the Xfinity Mobile eSIM server, which matches the eSIM to that phone.","info":"Use it when the eSIM didn't download by itself. They can also use **Settings › Add eSIM › Use QR code**, then follow the prompts."},{"text":"**Xfinity app QR:** scan it from a phone to open the Xfinity app.","imgs":[{"f":"b7f53d1fbd.svg","w":300,"h":300,"qr":1,"data":"https://xfinity.app.link/overview_aricle1qr","cap":"Xfinity app QR. Opens the Xfinity app (or the app store) to start activation.","alt":"QR code that opens the Xfinity app."}],"info":"Use it while the customer is on a computer or tablet. If the app isn't installed, it opens the App Store / Google Play so they can start activation."},{"text":"**In-store self-activation QR:** hand it to a customer who wants to activate alone.","imgs":[{"f":"b041adf9da.svg","w":300,"h":300,"qr":1,"data":"https://xfinity.app.link/RetailCorp","cap":"In-store self-activation QR (COMMS247). Opens the Xfinity app straight into the guided activation flow.","alt":"QR code for in-store guided self-activation."}],"note":"Works for phones and iPads. **Not for watches.** Watches use the activation built into the device (section 14). More on self-activation in section 15.","info":"It checks for the Xfinity app, then goes straight to the guided activation flow (or to the app store first)."},{"text":"**The customer's own QR code:** in XM360, click **Send QR code** under **Fallback Activation**.","imgs":[{"f":"cf205cc51d.webp","w":960,"h":670,"cap":"XM360 Activations tab. Fallback Activation has the Send QR code and eSIM activation guide buttons.","alt":"XM360 Activations tab. Fallback Activation has the Send QR code and eSIM activation guide buttons."}],"where":"XM360 › **Devices** › **Activations** › device › **Fallback Activation**","note":"Can't scan? The **eSIM activation guide** button next to it gives the manual code, or use section 07.","info":"Open **Devices › Activations** and pick the device first. A copy is also in the email inbox on the customer's account."}],"introMore":"These are the three QR codes Celestial gives for activation, rebuilt sharp so they scan easily off a screen. Each was checked against the Celestial original and opens exactly the same thing."},{"title":"Activate in the Xfinity app (existing line)","nav":"Xfinity app","intro":"For a **new device on an existing line**. Pick one start (steps 1–5), then finish with steps 6–10.","steps":[{"text":"**Push notification:** tap **Xfinity Mobile devices ready to activate**.","imgs":[{"f":"a5e5ef567c.webp","w":687,"h":239,"cap":"The push notification: Xfinity Mobile devices ready to activate.","alt":"The push notification: Xfinity Mobile devices ready to activate."}],"info":"It pops up on the phone."},{"text":"**Overview tab:** in the Xfinity app, tap **Activate your device**.","imgs":[{"f":"0a78a14023.webp","w":450,"h":447,"cap":"Overview card: You have a device to activate › Activate your device.","alt":"Overview card: You have a device to activate › Activate your device."}],"result":"If a device is waiting, the Overview card says **You have a device to activate**."},{"text":"**Services tab:** tap **Activate more devices**, then **Purchased from Xfinity** or **Purchased elsewhere**.","imgs":[{"f":"f07fcea54f.webp","w":520,"h":1020,"cap":"Services tab. Activate more devices is under Connect compatible equipment.","alt":"Services tab. Activate more devices is under Connect compatible equipment."}],"where":"Scroll to **Connect compatible equipment** for **Activate more devices**, then scroll to **Mobile**."},{"text":"**Account tab:** tap **Set up equipment or devices**, then pick the device type.","imgs":[],"where":"Under **Activate WiFi and more**. Scroll to **Mobile** to pick the device type."},{"text":"**Search:** type **Activate Xfinity Mobile device** and tap the device.","imgs":[],"where":"The search icon is at the top of the Overview tab."},{"text":"Tap **Start Activation**, then **Send Code**. Enter it and tap **Confirm Code**.","imgs":[],"result":"The app says the number was activated.","info":"**Send Code** sends a one-time passcode to an email on file, or to the number on the device or SIM being replaced."},{"text":"Confirm identity: tap the **Xfinity app notification**, or enter the emailed or texted code.","imgs":[],"info":"The **code sent by email or text** works the same as the notification."},{"text":"**eSIM:** tap the **Set up eSIM** notification and follow the screens.","imgs":[],"result":"**Cellular Setup Complete**. The phone is on the Xfinity Mobile network.","info":"Follow the cellular plan steps on the screen."},{"text":"**pSIM instead:** put the SIM card in, then tap **The SIM is inserted**.","imgs":[],"info":"Follow the app's prompts. The card may already be in the phone."},{"text":"Check for **signal bars**, then tap **Yes, I have cellular service bars** › **Continue**.","imgs":[],"result":"Xfinity Mobile activates the service and confirms the new device is on the network.","note":"Swapping an eSIM or pSIM? The app asks for one more identity check, by notification or code, before it finishes.","where":"The bars are at the top of the screen. The buttons are in the app."}],"introMore":"This is the way Celestial wants customers to activate a new device on an existing line, whether they bought it from Xfinity or brought it."},{"title":"New line: set up on the phone itself","nav":"New line","intro":"New lines **don't need the app** anymore. The device walks the customer through it.","steps":[{"text":"**New from Xfinity:** update and back up the old phone. Turn on the new one.","imgs":[],"info":"For a **new phone or tablet bought from Xfinity**. Unbox the new one and turn it on."},{"text":"Follow the setup screens. Connect to **WiFi** and install the **eSIM** when it's offered.","imgs":[],"result":"The phone connects to Xfinity Mobile."},{"text":"Keeping the old number? Transfer it in the **Xfinity app**.","imgs":[],"warn":"When the transfer finishes, an iPhone may show **SOS** and an Android may show **No service**. **Restart the phone** to sync the SIM.","info":"Have the old carrier's account info ready."},{"text":"**Brought their own phone?** Follow the brand's steps in the table below.","imgs":[],"info":"On a **dual-SIM** phone, label the new line **Xfinity** and make it the default for **calls, texts and data**."}],"table":{"head":["Phone","Install the eSIM","Dual SIM: also do this"],"rows":[["**iPhone**","Tap the **Settings** notification, or **Settings › Set Up Cellular**. pSIM: put the card in, then power on.","Set Xfinity as the default line for calls, texts and cellular data, and turn it on for **iMessage**."],["**Samsung**","Tap **Add eSIM** on the **eSIM ready to add** notification. Missed it? **Settings › Connections › SIM Manager › Add eSIM › Search for eSIMs**, then **Add**.","Name the Xfinity SIM (e.g. \"Xfinity\"). On the **Messages**, **Calls** and **Data** screens tap that line, then turn on **Data switching**."],["**Motorola**","Tap **Set up your Xfinity Mobile eSIM**, or **Network & Internet › SIMs › Add SIM › Set up an eSIM**, then **Set up**.","**Settings** › switch **Xfinity Mobile** on › **Turn on**. Pick Xfinity for calls (tap **Turn it off** on the Smart SIM pop-up), messages and mobile data (**OK**), then turn on **Switch SIM automatically**."],["**Pixel**","Tap **Set up your Xfinity Mobile eSIM**, or **Network & Internet › SIMs › Add SIM › Set up an eSIM**, then **Set up**.","**Settings** › switch Xfinity on › **Get Started** › **Next**. Choose Xfinity for **calls, texts and data**, then turn on **Automatic data switching**."],["**Other Android**","Put in the pSIM if there is one, power on, and follow the screens.","—"]]},"introMore":"The number transfer happens **after** the phone is connected, in the Xfinity app."},{"title":"Quick transfer: old phone to new phone","nav":"Quick transfer","intro":"Moves the line from the old phone to the new one **without the Xfinity app**. Only **iPhone to iPhone** or **Android to Android**.","steps":[{"text":"Put both phones side by side on **WiFi and Bluetooth**, with **Number Lock off**.","imgs":[],"note":"They may need their Apple ID, Google or Samsung account, and their **Xfinity ID and password**.","info":"Both need the latest software. The old phone needs a **screen lock** (PIN or pattern)."},{"text":"**iPhone (12 and up):** pick **Transfer from nearby iPhone**. Approve **Transfer SIM** on the old one.","imgs":[],"note":"Missed it during setup? **Settings › Cellular › Set Up Cellular › Transfer from Nearby iPhone**. Type the code from the new iPhone into the old one.","info":"On the new iPhone, follow setup and choose **Transfer from nearby iPhone** › **Transfer Number**. Approve **Transfer SIM** on the old iPhone."},{"text":"If asked, sign in with the **Xfinity ID**, then tap **Okay** and **Done**.","imgs":[],"result":"**Cellular Setup Complete**.","info":"Sign in: **Let's go** › password › **Sign In**. Wait for the network and don't close the screen before you tap **Okay**."},{"text":"**Android:** pick **Transfer a SIM from another device**. Scan its QR **with the old phone**.","imgs":[],"where":"Samsung: **Settings › Connections › SIM manager › Add eSIM › Transfer a SIM from another phone**. Samsung to Samsung uses a verification code instead of a QR.","info":"On the new phone, pick it during setup, or **Settings › Network & Internet › SIMs › Add SIM**. Scan the QR code on the new phone with the old phone, confirm the lock code, pick the **Xfinity Mobile eSIM**, and tap **Transfer**."},{"text":"More than one eSIM? Turn the new Xfinity SIM **on** in the SIM settings.","imgs":[],"info":"Do this afterwards, once the transfer is done."}],"table":{"head":["Brand","Works on","Notes"],"rows":[["**iPhone**","iPhone 12 and newer","pSIM → eSIM on a new iPhone, eSIM → eSIM, or **convert pSIM to eSIM on the same iPhone**: **Settings › Cellular › Convert to eSIM**, then take out the SIM card."],["**Google Pixel**","Pixel 6 and newer, Android 12+","During setup or later in Settings. Old phone scans the QR on the new one."],["**Samsung**","e.g. Galaxy S23+, Z Flip/Fold 5+","A pSIM on the old phone becomes an eSIM on the new one. Other Android → Samsung uses the QR scan."],["**Motorola**","e.g. 2025+ moto g, razr, g stylus 5G","During setup or later in Settings."],["**Android, same phone**","—","pSIM → eSIM on the **same** Android phone is **not supported**. Use XM360 (section 11)."]]},"introMore":"The customer needs their old phone with them. It ties up both phones for a few minutes."},{"title":"Activate a device in XM360","nav":"XM360","intro":"Encourage the app first. Use XM360 when the customer needs you. **Not for smartwatches** (see section 14).","steps":[{"text":"**Authenticate** the customer in **Einstein 360**, then open **XM360**.","imgs":[]},{"text":"Select the **Devices** tab, then **Activations**, and pick the device to activate.","imgs":[{"f":"cf205cc51d.webp","w":960,"h":670,"cap":"XM360 Activations tab with the device ready to activate.","alt":"XM360 Activations tab with the device ready to activate."}]},{"text":"Make sure the customer **isn't using** the device, and have them **power it off**.","imgs":[],"note":"A **BYOD** badge marks a customer-owned device. If the iPad asks for **ID proofing** in the store, complete it."},{"text":"Choose **New number** or **Submit port** (keep their current number).","imgs":[{"f":"44701b1e0b.webp","w":960,"h":247,"cap":"Porting: New number or Submit port.","alt":"Porting: New number or Submit port."}],"warn":"Always get an **alternate contact number**. When the port completes, service with the old carrier **ends**."},{"text":"**eSIM:** have the customer turn it on and set it up on **WiFi**.","imgs":[],"note":"**pSIM:** put the card in and skip to step 7.","info":"They follow the setup screens and keep going to the home screen. The eSIM downloads and activates by itself. Check for **bars** in the top right."},{"text":"**eSIM didn't download?** Try in order: notification, settings, **Send QR code**, manual code.","imgs":[{"f":"cf205cc51d.webp","w":960,"h":670,"cap":"Fallback Activation: Send QR code, or the eSIM activation guide for a manual code.","alt":"Fallback Activation: Send QR code, or the eSIM activation guide for a manual code."}],"info":"In order: check for the **Xfinity app push notification** › check the phone's **settings** › **Send QR code** from Fallback Activation (customer scans it with the Camera) › **enter the code manually** (section 07)."},{"text":"Click **Continue** once the eSIM is downloaded or the pSIM is in.","imgs":[],"info":"For a pSIM, answer whether the card was **inserted correctly**."},{"text":"Test it: restart the device, then **call or text with WiFi off**.","imgs":[],"info":"Power the device **off and on**, check that **Xfinity Mobile** shows in the status bar, call or text with WiFi off, and install the **Xfinity app**."},{"text":"All good? Select **Yes: All the steps above were successful** › **Finish**.","imgs":[],"info":"If not, select **No: Some steps weren't successful**."}],"table":{"head":["XM360 / iPad message","What it means","What you do"],"rows":[["**Verification status not started.** Customer must go into the Xfinity app…","The customer hasn't tried activating in the app.","They have to try in the app and get an **unsuccessful** message before you can help."],["**Verification complete.** Customer must go into the Xfinity app…","They didn't finish in the app.","Same: try in the app first."],["**No seasoned contact at this time.**","No trusted contact method on file.","In store: do **ID proofing on the iPad**, including the knowledge-based question, then activate."],["**…Please use iPad or have the customer use the Xfinity app**","Verification not started, pending or done.","Push the **Xfinity app**. If needed, finish ID proofing on the iPad."]]},"introMore":"For new devices, BYOD, and replacements from XMC, Apple or other makers."},{"title":"Replacement device (insurance or OEM)","nav":"Replacement","intro":"For an XMC/Assurant insurance replacement or a manufacturer (OEM) warranty replacement.","steps":[{"text":"On the **Device Details** page, under **Actions**, select **Activate Replacement Device**.","imgs":[{"f":"3e2f768350.webp","w":520,"h":732,"cap":"XM360 Devices page. Activate Replacement Device is in the Actions grid at the bottom.","alt":"XM360 Devices page. Activate Replacement Device is in the Actions grid at the bottom."}],"warn":"Only for a **verified** insurance or OEM replacement. A customer's own phone uses **Replace with eSIM BYOD** or **Replace with no-SIM BYOD**. Updating the IMEI needs **Step Up** authorization."},{"text":"Pick **Insurance Replacement Device** or **OEM Replacement Device**, enter **IMEI 1**, click **Continue**.","imgs":[{"f":"bb63d4d9d4.webp","w":960,"h":567,"cap":"Select the replacement type and enter IMEI 1.","alt":"Select the replacement type and enter IMEI 1."}],"warn":"Use **IMEI 1, not IMEI 2**. Assurant only sends Comcast IMEI 1.","info":"IMEI 1 is 15 digits."},{"text":"Wait for **IMEI update in progress** to finish. It can take **up to 5 minutes**.","imgs":[{"f":"e15972c3a2.webp","w":960,"h":188,"cap":"IMEI update in progress: up to 5 minutes.","alt":"IMEI update in progress: up to 5 minutes."},{"f":"2d2090f86d.webp","w":835,"h":492,"cap":"Customer email: We received your request.","alt":"Customer email: We received your request."}],"result":"The customer gets a **We received your request** email."},{"text":"Wait for the **You're all set** email, then finish from **step 7 of section 05**.","imgs":[{"f":"4b3095e2ff.webp","w":880,"h":445,"cap":"Customer email: You're all set.","alt":"Customer email: You're all set."}],"info":"The customer gets the email when the device is live on the network."},{"text":"**Replacement device must be verified?** The phone **works**, so finish the activation anyway.","imgs":[{"f":"1fcb1146f9.webp","w":430,"h":450,"cap":"IMEI updated, pending verification. The Verify button is in the IMEI section.","alt":"IMEI updated, pending verification. The Verify button is in the IMEI section."}],"info":"The insurer or maker's file hasn't arrived. **Network IMEI** shows **Active** and **Billing System IMEI** shows **Update Pending**, with a **Verify** button."},{"text":"**OEM** replacement showing **Escalate to XM Support**? Open an **XM Support chat in ECM**.","imgs":[{"f":"b69904eb0e.webp","w":927,"h":391,"cap":"Escalate to XM Support overlay.","alt":"Escalate to XM Support overlay."}],"info":"This is what **XM Tier 1** sees. **Insurance** replacements confirm themselves within about **72 hours**, so don't escalate those."},{"text":"After 3 days, select **Confirm Replacement Device**, or **Convert to BYO** if it isn't one.","imgs":[{"f":"10d371f97b.webp","w":822,"h":396,"cap":"Verify replacement device? prompt.","alt":"Verify replacement device? prompt."}],"info":"Only agents with permission can do this. XM Support sees **Verify replacement device** / **Not a replacement device**."},{"text":"**Verified:** only **one IMEI** shows on the Device Details page.","imgs":[{"f":"f48e19260d.webp","w":450,"h":480,"cap":"Device Details after the IMEI is verified.","alt":"Device Details after the IMEI is verified."},{"f":"5ecbd9976b.webp","w":450,"h":468,"cap":"IMEI updated: all features and promotions moved to the new IMEI.","alt":"IMEI updated: all features and promotions moved to the new IMEI."}],"info":"Features, promotions and protection move to the new IMEI."},{"text":"**Not a replacement:** the phone still works. Nothing more is needed unless they want protection.","imgs":[{"f":"5d29cfe9f9.webp","w":800,"h":731,"cap":"Customer email: We couldn't confirm your new device as a replacement.","alt":"Customer email: We couldn't confirm your new device as a replacement."}],"info":"The customer gets a **We couldn't confirm your new device** email, and the page says a **different device is active**, with an **Align** button. That's an OK state. Protection on the new phone is the only reason to do more."}],"warn":"**Don't** send the customer to the maker or Assurant, and **don't** ring it up as a BYOD order."},{"title":"eSIM won't download: enter it by hand","nav":"Manual code","intro":"Last resort. Put the device on **WiFi**, then type the code below. **Tap a code to copy it.**","steps":[],"table":{"head":["Phone","Steps","Type exactly"],"rows":[["**iPhone / iPad**","**Settings › Cellular** (or Mobile Data) › **Add Cellular Plan** / **Add eSIM** › **Use QR code** › **Enter Details Manually** (bottom). Leave **Activation Code** and **Confirmation Code** empty. Tap **Next** (top). If Next is hidden, tap one of the empty code fields.","SM-DP+ Address: `cct.vzw.otgeuicc.com`"],["**Samsung Galaxy**","**Settings › Connections › SIM manager › Add eSIM › Scan QR code** › **Enter Activation code** › **Done**.","`LPA:1$cct.vzw.otgeuicc.com`"],["**Google Pixel**","**Settings › Network & Internet › SIMs › Add SIM › Download a SIM instead** (pick **Use a different network** if Xfinity isn't listed) › **Need help?** › **Enter it manually** › **Continue**.","`LPA:1$cct.vzw.otgeuicc.com$`"],["**Motorola**","**Settings › Network & Internet › Mobile Network** (or SIMs & mobile network) › **Add SIM** or **+** › **Enter code manually** › **Done**.","`LPA:1$cct.vzw.otgeuicc.com$`"]]},"introMore":"Use it after the notification and the QR code have both failed.","warn":"Watch the dollar signs: Samsung's code has **no** $ at the end, Pixel and Motorola end **with** one."},{"title":"Troubleshoot an eSIM in XM360","nav":"Manage SIM","intro":"Not **CN – Connected** or **CN – Installed Enabled** in green? Use **Manage SIM Troubleshooting**.","steps":[{"text":"**Authenticate** in **Einstein 360**, launch **XM360**, and go to **Devices**.","imgs":[]},{"text":"Pick the device and click **Manage SIM Troubleshooting**.","imgs":[{"f":"2624e6cbb0.webp","w":500,"h":534,"cap":"Devices: Manage SIM Troubleshooting next to Network Status.","alt":"Devices: Manage SIM Troubleshooting next to Network Status."},{"f":"fbbbe3fe95.webp","w":811,"h":874,"cap":"Device details with Network Status CN – Connected.","alt":"Device details with Network Status CN – Connected."}]},{"text":"**Still activating?** In **Activations**, click **SIM troubleshooting** on the device.","imgs":[{"f":"03f74c1398.webp","w":960,"h":614,"cap":"Activations: Resolution required on the device. Phone setup shows eSIM manually disabled, with SIM troubleshooting.","alt":"Activations: Resolution required on the device. Phone setup shows eSIM manually disabled, with SIM troubleshooting."}],"result":"A red **Resolution required** shows on the device.","info":"Go to **Activations** instead of Devices."},{"text":"Work the checklist for that phone and tick each step.","imgs":[{"f":"60c18c842e.webp","w":500,"h":693,"cap":"Manage SIM Troubleshooting checklist (Samsung). Reissue eSIM unlocks at the bottom.","alt":"Manage SIM Troubleshooting checklist (Samsung). Reissue eSIM unlocks at the bottom."}],"note":"**No Reissue option?** It's not a SIM problem. Use **Qelp** or the matching **Interactive Troubleshooting Guide (ITG)**.","info":"If it's still broken, **Reissue eSIM** lights up, but only when the Network Status needs a new eSIM."},{"text":"**Red CN-Installed or CN-Downloaded, but service is fine?** Turn the line **off and on**.","imgs":[],"result":"It turns green: **CN Installed Enabled** or **CN Connected**.","info":"The eSIM was activated before XM360 tracked this status. Have the customer turn the Xfinity line off and back on (table below), then **refresh** the Network Status."},{"text":"Have the customer **make a test call** or **download an app with WiFi off**.","imgs":[{"f":"8763bb082d.webp","w":624,"h":667,"cap":"Healthy device: CN – Connected, Compatible.","alt":"Healthy device: CN – Connected, Compatible."}],"info":"This confirms it really works."}],"table":{"head":["Status or phone","What it means / where the toggle is"],"rows":[["**RS**","Ready to set up and connect. Needed before the push notification or QR code will work."],["**CN – Connected / CN – Installed Enabled**","On the network and working. The eSIM was downloaded."],["**iPhone toggle**","**Settings › Cellular › SIM Manager** › Xfinity Mobile › **Turn On This Line** off, then on."],["**Pixel toggle**","**Settings › Network & Internet › SIMs** › Xfinity Mobile eSIM off, then on."],["**Motorola toggle**","**Settings › Network & Internet › SIMs & Mobile Network** › Xfinity Mobile eSIM off, then on."],["**Samsung toggle**","**Settings › Connections › SIM Manager** › Xfinity Mobile eSIM off, then on."]]},"introMore":"XM360 shows each device's **Network Status**. **Green** is good (RS, or connected and working). **Red** means a problem."},{"title":"Error messages during activation","nav":"Errors","intro":"Seen in the buy flow or XM360. **Retry up to two more times.**","steps":[{"text":"**System error / timeout** on the IMEI eligibility check? Click **Retry**.","imgs":[{"f":"450de1e796.webp","w":960,"h":547,"cap":"A system error has occurred. Retry.","alt":"A system error has occurred. Retry."},{"f":"90428f5d58.webp","w":624,"h":280,"cap":"Eligibility and compatibility check in progress.","alt":"Eligibility and compatibility check in progress."}],"info":"After 3 tries the pop-up closes and the error shows on the IMEI checker page."},{"text":"**BYOD check has reached the maximum number of retries:** stop and recheck the BYOD checklist.","imgs":[{"f":"49d2e924cc.webp","w":960,"h":905,"cap":"BYOD: maximum number of retries.","alt":"BYOD: maximum number of retries."}],"info":"Stop retrying. The checklist is on the page: paid off, unlocked, updated, port info, backed up."},{"text":"**ERROR: BYO200** (hard stop): send the customer to their old carrier to unlock it.","imgs":[{"f":"193c24af1e.webp","w":624,"h":65,"cap":"BYO200: locked by its carrier.","alt":"BYO200: locked by its carrier."}],"warn":"**iPhone:** after the old carrier confirms the unlock, the customer must **back up and factory reset** (keep the eSIM — section 13).","info":"The device is locked by its carrier. It can't activate."},{"text":"**This device may be locked** (soft stop): have them check with their old carrier.","imgs":[{"f":"080486bdff.webp","w":624,"h":57,"cap":"May be locked: soft-stop warning.","alt":"May be locked: soft-stop warning."}],"info":"If it really is locked, it can't be activated."},{"text":"**iPhone stuck on SOS** after activating? First make sure an **eSIM is installed**.","imgs":[],"note":"SOS in a no-coverage area after activating is normal.","info":"iPhone 13, 14 and SE (3rd gen) get a **Carrier Cellular Plan Ready to Be Installed** notice: **Settings** › tap it › **Continue**."},{"text":"Still SOS? Turn **Airplane Mode on for 15 seconds**, then off.","imgs":[],"info":"Still SOS: **Settings › General › Transfer or Reset › Reset › Reset Network Settings** (about 5 minutes). Repeat once if needed."}],"introMore":"If it keeps coming back, the device can't activate with an eSIM."},{"title":"pSIM: clean it, swap it, ship a new one","nav":"pSIM","intro":"**No SIM**, **Insert SIM card** or **SOS** on a phone with a physical SIM card. **If the phone supports eSIM, steer them to eSIM** (section 11).","steps":[{"text":"**Clean it:** power off, pop the tray, and wipe the gold contacts.","imgs":[],"note":"Card moved to a different phone and calls stopped? That phone may be reported **lost or stolen**, **prepaid-only**, owe money to the old carrier, or not be **certified** for the network. Service gets suspended for a short time.","info":"Use a SIM tool or paperclip, and a soft cloth. Put it back **chip-side down** and restart."},{"text":"**Swap in store:** see **Error – Defective SIM**? Grab another card.","imgs":[{"f":"24afdb068d.webp","w":960,"h":398,"cap":"Error – Defective SIM: use a different SIM.","alt":"Error – Defective SIM: use a different SIM."}],"info":"It shows when you scan a new card's **ICCID** (16 digits). Throw the bad one away as usual."},{"text":"**Ship a SIM in XM360:** open **Manage SIM Troubleshooting** and choose the reason.","imgs":[{"f":"148194ac20.webp","w":920,"h":587,"cap":"Manage SIM: What does the customer need help with?","alt":"Manage SIM: What does the customer need help with?"}],"note":"Every reason **except Switch SIM activation type** ends in a pSIM replacement.","where":"Devices › device › **Manage SIM Troubleshooting**","info":"Reasons: Unable to make calls, send messages, use data, Damaged SIM, Lost device, 4G to 5G swap."},{"text":"Do the tips. **Tick each one that didn't fix it**, then click **Continue**.","imgs":[{"f":"333692c2c6.webp","w":960,"h":816,"cap":"Troubleshooting tips for Unable to send messages.","alt":"Troubleshooting tips for Unable to send messages."}],"info":"These are the troubleshooting tips for the reason you picked."},{"text":"Tell them the line **won't work until the new card arrives**. Click **Place order**.","imgs":[{"f":"f28eb04d52.webp","w":778,"h":451,"cap":"Ship a new SIM: Place order.","alt":"Ship a new SIM: Place order."}],"warn":"**One SIM per transaction.** Two devices need two orders."},{"text":"**Have a card in the store?** Type or **Scan ICCID**, then **Add SIM**.","imgs":[{"f":"f22ef82842.webp","w":960,"h":712,"cap":"Replace SIM: Enter or scan ICCID.","alt":"Replace SIM: Enter or scan ICCID."}],"info":"Do this instead of clicking **Ship SIM**."},{"text":"Confirmation: the new card arrives in **2–3 business days**. Click **Back to devices**.","imgs":[{"f":"d4d66caa03.webp","w":960,"h":668,"cap":"Order confirmed: Back to devices.","alt":"Order confirmed: Back to devices."}],"note":"**SIM ORDER ERROR?** Try once more. Then open **ECM › XM Support › XM360 Issues › Order Entry/Action Not Available › SIM Change**."}],"introMore":"Some pSIM cards came bad from the maker. They don't hurt the phone."},{"title":"Switch a pSIM to eSIM (same phone)","nav":"pSIM → eSIM","intro":"Only for phones that support both SIM types and are eligible for eSIM. **eSIM back to pSIM is not available.**","steps":[{"text":"In **Manage SIM Troubleshooting**, pick **Switch SIM activation type**, then **Continue**.","imgs":[{"f":"148194ac20.webp","w":920,"h":587,"cap":"Switch SIM activation type: confirm the switch to eSIM.","alt":"Switch SIM activation type: confirm the switch to eSIM."}],"where":"XM360 › Devices › device › **Manage SIM Troubleshooting**","info":"Confirm with the customer before you click **Continue**."},{"text":"Wait for **SIM Switch in progress**, then have the customer **download the eSIM**.","imgs":[],"info":"They download it when the replacement is confirmed (section 05, step 5 onward)."},{"text":"**iPhone shortcut:** **Settings › Cellular › Convert to eSIM**, then take out the SIM card.","imgs":[],"result":"**Converted to eSIM** shows under the number in Settings.","info":"Tap **Convert to eSIM** twice › take out the SIM card › **Continue**, then sign in with the Xfinity ID."}]},{"title":"Recover a deleted eSIM","nav":"Deleted eSIM","intro":"No service until a new eSIM is downloaded. The customer can do it, or you reissue it in XM360 (section 08).","steps":[{"text":"**Online:** in the Xfinity Mobile account, open **eSIM download and help** › **eSIM details**.","imgs":[],"where":"Sign in to the Xfinity Mobile account › **Devices** › the device › **eSIM download and help** › **eSIM details**."},{"text":"**Xfinity app:** open **Device Management** › **Download a new eSIM**.","imgs":[],"where":"**Services** tab › **Mobile lines and data usage** › the line › the device › **Device Management**","info":"They may need to sign in again."},{"text":"Either way: tap **Get a new eSIM** › **Add SIM** and follow the prompts.","imgs":[],"info":"Or scan the **QR code** (section 01), or enter the code by hand (section 07)."},{"text":"Turn the eSIM **on** if it's off.","imgs":[],"where":"Pixel & Motorola: **Settings › Network & Internet › SIMs**. Samsung: **Settings › Connections › SIM Manager**."}],"table":{"head":["Never do this to fix an eSIM activation","Why"],"rows":[["Submit a **provide order** for the eSIM device","Breaks the device status and can **lose the customer's number**."],["Activate it with a **new phone number**","Same risk."],["Try a **Pair SIM** order","Same risk."],["**Deactivate and reactivate** the line","Same risk. If a number does get lost, open a ticket to recover it."],["Swap pSIM ↔ eSIM devices any other way","Only **early upgrade/NDEL with eSIM** or **Replace with eSIM BYOD** in XM360 is correct."]]},"introMore":"The customer needs a **Primary or Manager** Xfinity ID to do it themselves."},{"title":"Delete an eSIM, or reset and keep it","nav":"Delete / reset","intro":"Delete the old eSIM **before** using Replace SIM. Factory resetting? Make sure they choose to **keep** the eSIM.","steps":[],"table":{"head":["Phone","Delete the eSIM","Factory reset, keep the eSIM"],"rows":[["**iPhone / iPad**","**Settings › Cellular** › the plan › **Delete eSIM** › confirm.","**Settings › General › Transfer or Reset › Erase All Content and Settings** › passcode. Choose **keep eSIM**."],["**Samsung**","**Settings › Connections › SIM card manager** › the eSIM › **Remove** › confirm.","**Settings › General management › Reset › Factory data reset › Reset**. Choose **keep eSIM**."],["**Google Pixel**","**Settings › Network and Internet › SIMs** › the eSIM › **Erase SIM** › confirm.","**Settings › System › Reset options › Erase all data**. Choose **keep eSIM**."],["**Motorola**","**Settings › Connected devices › Mobile data** › the eSIM › **Erase SIM** › confirm.","—"]]},"warn":"Skip the delete and XM360 and Retail360 show **SIM Transferred**, and a second replacement leaves the device with **no service**."},{"title":"Activate a smartwatch in XM360","nav":"Smartwatch","intro":"Have them try the **watch app** first. They need a free line and an Xfinity Mobile phone on the **same OS** as the watch.","steps":[{"text":"Open the account in XM360 › **Devices** › the watch › **Activate watch**.","imgs":[{"f":"53e67aed6e.webp","w":960,"h":635,"cap":"Watch details: Cellular Activation Inactive, Activate watch.","alt":"Watch details: Cellular Activation Inactive, Activate watch."}]},{"text":"**Paired watch (Smartwatch fee):** pick the **host line** and click **Continue**.","imgs":[{"f":"b6c9bff192.webp","w":960,"h":878,"cap":"Select host line.","alt":"Select host line."}]},{"text":"Choose **Add as new** or **Replace active watch**, then **Continue**.","imgs":[{"f":"baecf6f9bc.webp","w":960,"h":883,"cap":"Add as new.","alt":"Add as new."},{"f":"512b812465.webp","w":960,"h":909,"cap":"Replace active watch: pick the watch to replace.","alt":"Replace active watch: pick the watch to replace."}],"info":"**Add as new** puts a new watch on this line."},{"text":"Replacing? Pick the watch being replaced, review **Original** vs **Replacement**, and confirm with the customer.","imgs":[{"f":"2f0beef02b.webp","w":960,"h":823,"cap":"Replacement confirmation.","alt":"Replacement confirmation."}],"warn":"The old watch is **deactivated automatically**. XM360 warns you if that line is on a promotion."},{"text":"**Pair the watch:** open **pairing instructions**, walk them through Step 1, then **Continue**.","imgs":[{"f":"b8bf5d391e.webp","w":960,"h":984,"cap":"Pair watch: pairing instructions link.","alt":"Pair watch: pairing instructions link."}],"info":"This pairs the watch with the phone. Step 1 is in the watch app."},{"text":"Enter the **911 emergency address**, confirm it, then **Continue**.","imgs":[{"f":"5b51fc352e.webp","w":520,"h":650,"cap":"Add 911 emergency location information.","alt":"Add 911 emergency location information."},{"f":"9710ae8d7b.webp","w":520,"h":637,"cap":"Verify 911 emergency address.","alt":"Verify 911 emergency address."}],"info":"Enter it › **Continue**. Confirm the address (or **Use address exactly as entered**) › **Continue**."},{"text":"Open **activation instructions**, have them download the watch **eSIM**, then **Continue**.","imgs":[{"f":"2db60314cf.webp","w":960,"h":1023,"cap":"Activate cellular: Ready to activate cellular.","alt":"Activate cellular: Ready to activate cellular."},{"f":"0a6d489181.webp","w":960,"h":875,"cap":"Activation in progress.","alt":"Activation in progress."}],"info":"It's Step 2, for Apple or Android. The customer downloads the eSIM on the watch."},{"text":"While it runs, confirm three things with the customer, then tick the box.","imgs":[{"f":"094b331def.webp","w":960,"h":285,"cap":"Confirm the three items, then tick the box.","alt":"Confirm the three items, then tick the box."}],"info":"They downloaded the eSIM from **Set Up Cellular**, turned on cellular on the watch, and saw success in the watch app."},{"text":"No eSIM after **7 minutes**? Click **Verify eSIM installation**.","imgs":[{"f":"6d7c209612.webp","w":960,"h":284,"cap":"eSIM created and ready for download. Verify eSIM installation.","alt":"eSIM created and ready for download. Verify eSIM installation."}]},{"text":"**Activation complete** › **Continue**. The watch is listed on the **Devices** page.","imgs":[{"f":"eed1b7518a.webp","w":520,"h":637,"cap":"Activation complete.","alt":"Activation complete."},{"f":"bed1076ce1.webp","w":960,"h":846,"cap":"Devices page with the watch listed.","alt":"Devices page with the watch listed."}]},{"text":"**Standalone watch (Smartwatch Data Plan):** pair it, then confirm the **911 address** › **Continue**.","imgs":[{"f":"70f29e7ecc.webp","w":600,"h":598,"cap":"Standalone: Verify 911 emergency address.","alt":"Standalone: Verify 911 emergency address."},{"f":"aef88a79f1.webp","w":600,"h":598,"cap":"Use address exactly as entered.","alt":"Use address exactly as entered."}],"info":"Same start as a paired watch. Enter the 911 address, then confirm it."},{"text":"Open **activation instructions**, **Continue**, wait for **Activation in progress**, then **Verify eSIM installation** › **Finish**.","imgs":[{"f":"b1d5adeedb.webp","w":600,"h":443,"cap":"Ready to activate cellular.","alt":"Ready to activate cellular."},{"f":"2153f96fc4.webp","w":400,"h":452,"cap":"Activation in progress.","alt":"Activation in progress."},{"f":"1eb57a6aec.webp","w":400,"h":452,"cap":"Verify eSIM installation, then Finish.","alt":"Verify eSIM installation, then Finish."}]},{"text":"Done: the **Device Details** page shows the watch with its **own phone number**.","imgs":[{"f":"2851a1da32.webp","w":400,"h":522,"cap":"Device Details with the watch's number.","alt":"Device Details with the watch's number."}]}],"introMore":"Watches always use **eSIM** and have **one IMEI**. The phone must be active on Xfinity Mobile. It takes **up to 30 minutes** (pairing, apps, cellular)."},{"title":"Customer self-activation in store","nav":"Self-activate","intro":"The self-activation QR (section 01) lets a customer activate on their own while you help the next guest. Phones and iPads only, **not watches**. Handouts are reordered in **Hub2U**.","steps":[{"text":"Get the device on **store WiFi**, updated, with the **Xfinity app** installed.","imgs":[],"note":"They can also scan it at home on their home WiFi.","info":"Also: important data and voicemails saved, and **old carrier account info** handy if porting."},{"text":"Seat them at the **community table** with the device and the QR code.","imgs":[],"note":"Something like: \"Here's a step-by-step guide that makes it easy. Sit here and get started. I'll check back in a few minutes.\"","info":"The QR code is in section 01, step 3."},{"text":"Several phones? Hand them the QR and one phone. **Activate the others alongside them.**","imgs":[],"info":"Works well for one family with several phones."},{"text":"Keep an eye on them while you help someone else.","imgs":[],"info":"Let the new guest know you'll check in on the other customer now and then."},{"text":"Stuck? Use your XM360 tools, then the **Center of Excellence**.","imgs":[],"info":"Your tools: section 05, section 06, section 07 and section 08. Contact the Center of Excellence if you can't fix it yourself.","warn":"Don't let them leave until the activation is **done** and they have no questions."}]},{"title":"Who can do what","nav":"Who does what","steps":[],"table":{"head":["eSIM job","Retail","Care (XMC)","Xfinity app"],"rows":[["New line activation","✓","✓","✓"],["Bring your own device (BYOD)","✓","✓","✓"],["New device, existing line (NDEL)","✓","✓","✓"],["Early upgrade","✓","✓","✓"],["BYO new device, existing line (BYONDEL)","✓","✓","✓"],["eSIM replacement","✓","✓","✓"],["pSIM → eSIM on the same phone","✓","✓","✗"],["eSIM → pSIM","✗","✗","✗"]]}},{"title":"Sources in Celestial","nav":"Sources","steps":[],"table":{"head":["Article","Covers","Updated"],"rows":[["[HOW13265](https://celestial.cable.comcast.com/knowledge/article-info/?query=200826155424623)","What to do if an eSIM or pSIM isn't working (QR code, manual entry)","08/24/2026"],["[HOW23576](https://celestial.cable.comcast.com/knowledge/article-info/?query=260813162253563)","Activate on an existing Xfinity Mobile or NOW Mobile line","08/19/2026"],["[HOW13358](https://celestial.cable.comcast.com/knowledge/article-info/?query=200826155424716)","Activate a phone or tablet with Xfinity Mobile","08/18/2026"],["[HOW21239](https://celestial.cable.comcast.com/knowledge/article-info/?query=220922094418000)","eSIM activation support","08/18/2026"],["[HOW21177](https://celestial.cable.comcast.com/knowledge/article-info/?query=220825180708267)","Manage SIM troubleshooting in XM360","08/18/2026"],["[HOW11877](https://celestial.cable.comcast.com/knowledge/article-info/?query=200826155423240)","Activate a device or a replacement device in XM360","08/17/2026"],["[HOW23169](https://celestial.cable.comcast.com/knowledge/article-info/?query=260115123645743)","Quick transfer","05/07/2026"],["[HOW21262](https://celestial.cable.comcast.com/knowledge/article-info/?query=221003091917003)","Delete an eSIM","04/30/2026"],["[HOW21638](https://celestial.cable.comcast.com/knowledge/article-info/?query=230420173336647)","Activate a smartwatch in XM360","12/18/2025"],["[COMMS247](https://celestial.cable.comcast.com/knowledge/article-info/?query=240530160939907)","Customer self-activation QR code","11/13/2025"],["[HOW13360](https://celestial.cable.comcast.com/knowledge/article-info/?query=200826155424718)","Why won't my mobile device activate?","05/08/2025"]]}}],"qrs":[{"f":"464b830b3a.svg","w":300,"h":300,"qr":1,"data":"LPA:1$cct.vzw.otgeuicc.com$","cap":"eSIM download QR. Scans to **LPA:1$cct.vzw.otgeuicc.com$** — the Xfinity Mobile eSIM server.","alt":"QR code that downloads the Xfinity Mobile eSIM.","key":"esim"},{"f":"b7f53d1fbd.svg","w":300,"h":300,"qr":1,"data":"https://xfinity.app.link/overview_aricle1qr","cap":"Xfinity app QR. Opens the Xfinity app (or the app store) to start activation.","alt":"QR code that opens the Xfinity app.","key":"app"},{"f":"b041adf9da.svg","w":300,"h":300,"qr":1,"data":"https://xfinity.app.link/RetailCorp","cap":"In-store self-activation QR (COMMS247). Opens the Xfinity app straight into the guided activation flow.","alt":"QR code for in-store guided self-activation.","key":"self"}],"groups":[{"id":"scan","name":"Scan & self-activate","c":"var(--g-scan)"},{"id":"phone","name":"Phone or tablet","c":"var(--g-phone)"},{"id":"watch","name":"Smartwatch","c":"var(--g-watch)"},{"id":"fix","name":"eSIM not working","c":"var(--g-fix)"},{"id":"psim","name":"Physical SIM (pSIM)","c":"var(--g-psim)"},{"id":"ref","name":"Reference","c":"var(--g-ref)"}],"tasks":[{"slug":"qr-codes","g":"scan","title":"Scan to activate: the QR codes","from":0,"items":[{"si":0,"ti":0,"rep":false},{"si":0,"ti":1,"rep":false},{"si":0,"ti":2,"rep":false},{"si":0,"ti":3,"rep":false}],"intro":"Tap **Show full screen** to hold a code up for the customer.","introMore":"These are the three QR codes Celestial gives for activation, rebuilt sharp so they scan easily off a screen. Each was checked against the Celestial original and opens exactly the same thing.","qr":true},{"slug":"self-activate","g":"scan","title":"Customer self-activation in store","from":14,"items":[{"si":14,"ti":0,"rep":false},{"si":14,"ti":1,"rep":false},{"si":14,"ti":2,"rep":false},{"si":14,"ti":3,"rep":false},{"si":14,"ti":4,"rep":false}],"intro":"The self-activation QR (section 01) lets a customer activate on their own while you help the next guest. Phones and iPads only, **not watches**. Handouts are reordered in **Hub2U**."},{"slug":"xfinity-app","g":"phone","title":"Activate in the Xfinity app (existing line)","from":1,"items":[{"si":1,"ti":0,"rep":false},{"si":1,"ti":1,"rep":false},{"si":1,"ti":2,"rep":false},{"si":1,"ti":3,"rep":false},{"si":1,"ti":4,"rep":false},{"si":1,"ti":5,"rep":false},{"si":1,"ti":6,"rep":false},{"si":1,"ti":7,"rep":false},{"si":1,"ti":8,"rep":false},{"si":1,"ti":9,"rep":false}],"intro":"For a **new device on an existing line**. Pick one start (steps 1–5), then finish with steps 6–10.","introMore":"This is the way Celestial wants customers to activate a new device on an existing line, whether they bought it from Xfinity or brought it."},{"slug":"new-line-from-xfinity","g":"phone","title":"New line: phone or tablet from Xfinity","from":2,"items":[{"si":2,"ti":0,"rep":false},{"si":2,"ti":1,"rep":false},{"si":2,"ti":2,"rep":false}],"intro":"New lines **don't need the app** anymore. The device walks the customer through it.","introMore":"The number transfer happens **after** the phone is connected, in the Xfinity app."},{"slug":"new-line-byod","g":"phone","title":"New line: they brought their own phone","from":2,"items":[{"si":2,"ti":3,"rep":false},{"si":2,"ti":2,"rep":true}],"intro":"New lines **don't need the app** anymore. The device walks the customer through it.","introMore":"The number transfer happens **after** the phone is connected, in the Xfinity app.","table":2},{"slug":"quick-transfer-iphone","g":"phone","title":"Quick transfer: iPhone to iPhone","from":3,"items":[{"si":3,"ti":0,"rep":false},{"si":3,"ti":1,"rep":false},{"si":3,"ti":2,"rep":false},{"si":3,"ti":4,"rep":true}],"intro":"Moves the line from the old phone to the new one **without the Xfinity app**. Only **iPhone to iPhone** or **Android to Android**.","introMore":"The customer needs their old phone with them. It ties up both phones for a few minutes.","table":3,"rows":[0]},{"slug":"quick-transfer-android","g":"phone","title":"Quick transfer: Android to Android","from":3,"items":[{"si":3,"ti":0,"rep":true},{"si":3,"ti":3,"rep":false},{"si":3,"ti":4,"rep":false}],"intro const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const plain=s=>String(s??'').replace(/\[(.+?)\]\([^)]+\)/g,'$1').replace(/\*\*|`/g,'');
const plural=(n,w)=>`${n} ${w}${n===1?'':'s'}`;
const SV={check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>',pin:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>',eye:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>',arr:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>'};

/* ---------- data model: one transaction per task page (#/do/<slug>), the whole guide at #/all ---------- */
const TASKS=G.tasks.map((t,k)=>({...t,k}));
const grpOf=t=>G.groups.find(g=>g.id===t.g);
const ALL=G.sections.map((_,i)=>i);
const secTask=si=>TASKS.find(t=>t.from===si);
const homeTask=(si,ti)=>TASKS.find(t=>t.items.some(i=>!i.rep&&i.si===si&&i.ti===ti));
const rowTask=(si,ri)=>TASKS.find(t=>t.table===si&&(!t.rows||t.rows.includes(ri)));
const taskHref=(t,anchor)=>`#/do/${t.slug}${anchor?'~'+anchor:''}`;
const no=si=>String(si+1).padStart(2,'0');
/* "section 07" in the text becomes a link to that task, named by its title */
const xref=h=>h.replace(/\bsection (\d\d)\b/g,(m,n)=>{ const t=secTask(+n-1); return t?`<a class="xref" href="${taskHref(t)}">${esc(t.title)}</a>`:m; });
const rich=s=>xref(esc(s).replace(/\[(.+?)\]\((https:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1 ↗</a>').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`(.+?)`/g,'<code>$1</code>'));
const stepsOfSecs=sis=>sis.flatMap(si=>(G.sections[si].steps||[]).map((st,ti)=>({st,si,ti,sec:G.sections[si].title,id:`s${si}-${ti}`})));
/* a shared setup step repeated at the top of another task gets its own tick-off id */
const stepsOfTask=t=>t.items.map(it=>{ const o=G.sections[it.si].steps[it.ti]; return {st:it.text?{...o,text:it.text}:o,si:it.si,ti:it.ti,sec:t.title,rep:it.rep,id:it.rep?`t${t.k}-${it.si}-${it.ti}`:`s${it.si}-${it.ti}`}; });
const STEPS=stepsOfSecs(ALL);
const uniq=a=>new Set(a).size;
const picsOf=list=>uniq(list.flatMap(x=>x.st.imgs.map(i=>i.f)));
const imgCount=picsOf(STEPS);

/* ---------- progress memory (this device only) ---------- */
const DK='esim-done-v1';
function getDone(){ try{return new Set(JSON.parse(localStorage.getItem(DK)||'[]'))}catch(_){return new Set()} }
function setDone(set){ try{localStorage.setItem(DK,JSON.stringify([...set]))}catch(_){} }

/* ---------- markup ---------- */
function figHtml(st){
  if(!st.imgs.length) return '';
  const tall=st.imgs.length>1 && st.imgs.every(im=>im.h>im.w*1.15);
  return `<div class="shots${tall?' pair':''}">${st.imgs.map(im=>`<figure tabindex="0" role="button" aria-label="Enlarge picture: ${esc(im.alt||plain(im.cap))}" class="shot${im.qr?' qr':''}" style="width:${im.w}px"><img loading="lazy" decoding="async" src="shots/${im.f}" width="${im.w}" height="${im.h}" alt="${esc(im.alt||im.cap)}"><figcaption>${rich(im.cap)}${im.qr?'<span class="qfull">Show full screen ↗</span>':''}</figcaption></figure>`).join('')}</div>`;
}
function moreHtml(x){
  const extra=`${x.info?`<p class="minfo">${rich(x.info)}</p>`:''}${x.where?`<div class="mrow">${SV.pin}<span><b>Where:</b> ${rich(x.where)}</span></div>`:''}${x.result?`<div class="mrow">${SV.eye}<span><b>You'll see:</b> ${rich(x.result)}</span></div>`:''}${x.note?`<div class="callout"><span class="lbl">Tip</span>${rich(x.note)}</div>`:''}`;
  return extra?`<details class="more"><summary><span>More info</span></summary>${extra}</details>`:'';
}
/* CSG pattern: one action line, a visible "Heads up" only for real warnings, pictures always visible, the rest behind "More info" */
function stepInner(st){
  return `${st.warn?`<div class="callout warn"><span class="lbl">Heads up</span>${rich(st.warn)}</div>`:''}
    ${figHtml(st)}
    ${moreHtml(st)}`;
}
function stepHtml(x,n,done,i){
  return `<li id="${x.id}" class="rise${done?' done':''}" style="--i:${i}"><button class="num" type="button" data-sid="${x.id}" aria-pressed="${done}" aria-label="Mark step ${n} done"><span>${n}</span>${SV.check}</button><div class="step-body">${x.rep?'<span class="again">Same as the other tasks</span>':''}<p class="do">${rich(x.st.text)}</p>${stepInner(x.st)}</div></li>`;
}
function tableHtml(t,id,rows){
  return `<div class="tbl" id="${id}"><table><thead><tr>${t.head.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${t.rows.map((r,ri)=>rows&&!rows.includes(ri)?'':`<tr id="${id}${ri}">${r.map((c,ci)=>`<td data-h="${esc(t.head[ci]||'')}">${rich(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
const panelHtml=(id,title,items)=>`<details class="panel" id="${id}"><summary><h3>${title}</h3></summary><ul>${items.map(x=>`<li>${rich(x)}</li>`).join('')}</ul></details>`;
function pickOptions(){
  return `<option value="">Choose a task…</option>`+G.groups.map(g=>`<optgroup label="${esc(g.name)}">${TASKS.filter(t=>t.g===g.id).map(t=>`<option value="${esc(t.slug)}">${esc(t.title)}</option>`).join('')}</optgroup>`).join('')
    +`<optgroup label="Whole guide"><option value="all">Every step, start to finish</option></optgroup>`;
}
function qrStrip(){
  return `<div class="qrstrip">${G.qrs.map(q=>`<button type="button" class="qrcard" data-qr="${q.key}"><img src="shots/${q.f}" width="132" height="132" alt="${esc(q.alt)}"><span><b>${esc({esim:'eSIM download',app:'Xfinity app',self:'Self-activation'}[q.key])}</b><small>${esc({esim:'If the eSIM didn’t download',app:'Start activation in the app',self:'Guided, in store'}[q.key])}</small><i>Show full screen ↗</i></span></button>`).join('')}</div>`;
}

/* ---------- views ---------- */
let VIEW='', CUR=null;
function setView(html,anim,after){
  const apply=()=>{ $('#view').innerHTML=html; if(after) after(); };
  if(anim && !RM() && document.startViewTransition && setView.ready) document.startViewTransition(apply);
  else { apply(); if(anim && !RM()){ const v=$('#view'); v.classList.remove('enter'); void v.offsetWidth; v.classList.add('enter'); } }
  setView.ready=true;
}
function renderHome(){

  const D=getDone();
  setView(`
  <section class="hero">

      <div class="tk">${TASKS.filter(t=>t.g===g.id).map(t=>{ const ids=stepsOfTask(t).map(x=>x.id), k=ids.filter(x=>D.has(x)).length; return `<a href="${taskHref(t)}"><span>${esc(t.title)}</span><small${ids.length&&k===ids.length?' class="all"':''}>${ids.length?`${k?`${k}/`:''}${plural(ids.length,'step')}`:'Table'}</small></a>`; }).join('')}</div>
    </div>`).join('')}
    <div class="cat-card whole rise" style="--c:var(--brass);--i:${G.groups.length}">
