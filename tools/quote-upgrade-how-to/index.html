<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <meta name="referrer" content="no-referrer">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%B3%3C/text%3E%3C/svg%3E">
  <title>Upgrade Quote Sheet How To | Cook County Cooks</title>
  <!-- Self-hosted fonts (same files as the site). build/fingerprint.mjs rewrites
       these names to their hashed copies — tools/quote-upgrade-how-to is in HTML_FILES. -->
  <style>
    @font-face { font-family: 'Archivo'; font-style: normal; font-weight: 300 700; font-stretch: 62% 125%; font-display: swap;
      src: url(../../assets/fonts/archivo-latin.e3a28eade2.woff2) format('woff2'); }
    @font-face { font-family: 'Bodoni Moda'; font-style: normal; font-weight: 400 900; font-display: swap;
      src: url(../../assets/fonts/bodoni-moda-latin.c032219ef6.woff2) format('woff2'); }
    @font-face { font-family: 'Bodoni Moda'; font-style: italic; font-weight: 400 700; font-display: swap;
      src: url(../../assets/fonts/bodoni-moda-italic-latin.b737328c13.woff2) format('woff2'); }
  </style>
  <style>
    /* Upgrade Quote Sheet How To (Oct 2026): a 3:34 training video on building a
       bundle with the Upgrade Quote Sheet. It hangs under that sheet's chip in the
       Pass (data/tools.5ceb9a18e3.json: "under":"quote-upgrade"). Same player as
       tools/site-tour: HLS (video/howto.m3u8, .ts segments), native on Safari/iPad,
       the vendored hls.light.min.js everywhere else. */
    :root{ --ink:#05070a; --ink2:#0d131b; --bone:#f4efe6; --dim:#b9b1a3; --brass:#c8973f; --brass-hi:#e2b866;
      --serif:'Bodoni Moda', Georgia, serif; --sans:'Archivo', system-ui, -apple-system, 'Segoe UI', sans-serif; }
    *{ box-sizing:border-box; margin:0; }
    html,body{ height:100%; }
    body{ background:radial-gradient(1200px 600px at 50% -10%, rgba(200,151,63,.14), transparent 60%), var(--ink);
      color:var(--bone); font:400 16px/1.5 var(--sans); display:flex; flex-direction:column; align-items:center; justify-content:center;
      padding:clamp(12px,3vw,40px) 16px calc(16px + env(safe-area-inset-bottom)); gap:clamp(10px,2vh,22px); }
    header{ text-align:center; }
    .kicker{ font-weight:700; font-size:12px; letter-spacing:.32em; color:var(--brass-hi); text-transform:uppercase; }
    h1{ font-family:var(--serif); font-weight:400; font-size:clamp(28px,4.4vw,52px); line-height:1.05; margin-top:6px; }
    h1 em{ color:var(--brass-hi); }
    .frame{ position:relative; width:min(100%, calc((100svh - 190px) * 16 / 9), 1600px); aspect-ratio:16/9; border-radius:14px; overflow:hidden;
      background:#000; box-shadow:0 40px 100px rgba(0,0,0,.6), 0 0 0 1px rgba(226,184,102,.3); }
    video{ position:absolute; inset:0; width:100%; height:100%; background:#000; }
    .play{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
      background:rgba(5,7,10,.35); border:0; cursor:pointer; color:var(--bone); font:inherit; transition:opacity .3s; }
    .play[hidden]{ display:none; }
    .play .btn{ width:clamp(72px,9vw,112px); height:clamp(72px,9vw,112px); border-radius:50%; display:grid; place-items:center;
      background:linear-gradient(135deg,var(--brass-hi),var(--brass)); box-shadow:0 0 0 10px rgba(226,184,102,.18), 0 20px 50px rgba(0,0,0,.6); }
    .play .btn svg{ width:38%; height:38%; margin-left:8%; }
    .play .lbl{ font-weight:700; font-size:clamp(13px,1.3vw,16px); letter-spacing:.28em; text-transform:uppercase; text-shadow:0 2px 12px #000; }
    .play:hover .btn, .play:focus-visible .btn{ transform:scale(1.06); }
    .play:focus-visible{ outline:3px solid var(--brass-hi); outline-offset:-3px; }
    .note{ color:var(--dim); font-size:13px; letter-spacing:.04em; text-align:center; }
    .note.err{ color:#ffc2b6; font-size:15px; max-width:60ch; }
    .note[hidden]{ display:none; }
    @media (prefers-reduced-motion: reduce){ .play .btn{ transition:none; } }
  </style>
</head>
<body>
  <header>
    <div class="kicker">The Pass · 3 min 34 s</div>
    <h1>Upgrade Quote Sheet <em>How To</em></h1>
  </header>
  <div class="frame">
    <video id="v" playsinline preload="metadata" poster="video/poster.jpg" controls crossorigin="anonymous">
      <track kind="captions" src="video/captions.vtt" srclang="en" label="English">
    </video>
    <button class="play" id="play" type="button" aria-label="Play the Upgrade Quote Sheet How To video">
      <span class="btn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3l16 9-16 9z" fill="#141008"/></svg></span>
      <span class="lbl">Play the video</span>
    </button>
  </div>
  <p class="note">How to turn an upgrade into a bundle with the Upgrade Quote Sheet. Turn the sound on — or tap CC for captions.</p>
  <p class="note err" id="msg" role="alert" hidden></p>
  <script src="hls.light.min.js"></script>
  <script>
    (function(){
      var v = document.getElementById('v'), play = document.getElementById('play'), msg = document.getElementById('msg');
      var lbl = play.querySelector('.lbl');
      var SRC = 'video/howto.m3u8';
      var hls = null, attached = false, failed = false;
      // Native controls stay hidden behind the big play button (they'd show a dead
      // 0:00 bar and collide with the label on a phone); they come back on Play.
      // Without JS the controls attribute in the markup still works.
      v.controls = false;
      function fail(unsupported){
        if (failed) return; failed = true;
        msg.textContent = unsupported
          ? 'This browser can\u2019t play this video. Open the site in Chrome or Safari, or update your browser.'
          : 'The video didn\u2019t load. Check your connection, then tap Try again.';
        msg.hidden = false;
        lbl.textContent = 'Try again';
        play.setAttribute('aria-label', 'Try playing the video again');
        play.hidden = false; v.controls = false;
      }
      function reset(){
        if (hls) { try { hls.destroy(); } catch (_) {} hls = null; }
        v.removeAttribute('src'); try { v.load(); } catch (_) {}
        attached = false; failed = false; msg.hidden = true;
      }
      function attach(){
        if (attached) return; attached = true;
        if (v.canPlayType('application/vnd.apple.mpegurl')) { v.src = SRC; }
        else if (window.Hls && Hls.isSupported()) {
          hls = new Hls({ capLevelToPlayerSize:true, maxBufferLength:30 });
          var recovered = false;
          hls.on(Hls.Events.ERROR, function(_e, d){
            if (!d || !d.fatal) return;
            // hls.js has already retried network loads on its own by now.
            if (d.type === Hls.ErrorTypes.MEDIA_ERROR && /Codec/i.test(d.details || '')) { fail(true); return; }
            if (d.type === Hls.ErrorTypes.MEDIA_ERROR && !recovered) { recovered = true; hls.recoverMediaError(); return; }
            fail(false);
          });
          hls.loadSource(SRC); hls.attachMedia(v);
        }
        else { v.src = SRC; }
      }
      function start(){
        if (failed) reset();
        attach(); v.controls = true; play.hidden = true;
        var p = v.play();
        if (p && p.catch) p.catch(function(err){ if (!failed && v.paused) { play.hidden = false; v.controls = false; } if (err && err.name === 'NotSupportedError') fail(true); });
      }
      play.addEventListener('click', start);
      v.addEventListener('play', function(){ play.hidden = true; msg.hidden = true; v.controls = true; });
      v.addEventListener('ended', function(){ play.hidden = false; v.controls = false; lbl.textContent = 'Watch again'; play.setAttribute('aria-label', 'Watch the video again'); });
      v.addEventListener('error', function(){ if (!v.getAttribute('src') && !hls) return; fail(!!(v.error && v.error.code === 4)); });
      // A native control press (Safari) before our button: make sure the source is there.
      v.addEventListener('click', attach, { once:true });
    })();
  </script>
</body>
</html>
