<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="theme-color" content="#000000">
<title>CSG How To Guides</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Bodoni+Moda:opsz,wght@6..96,500;6..96,700&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{
  --ink:#000;--ink-1:#07090c;--ink-2:#0d1116;--ink-3:#151b22;
  --line:rgba(255,255,255,.08);--line-2:rgba(255,255,255,.14);
  --text:#f2efe8;--text-2:#b9b4aa;--text-3:#7d7a74;
  --brass:#d4a94f;--brass-2:#f0cf86;--brass-dim:rgba(212,169,79,.16);
  --internet:#5cc8ff;--tv:#b48cff;--voice:#5be3a0;--xh:#ffb05c;--account:#d4a94f;--orders:#ff7eb6;--billing:#d4a94f;--equipment:#6fe3d6;--basics:#c9c3ff;
  --warn:#ff8a65;--ok:#5be3a0;
  --display:'Bodoni Moda',Didot,'Times New Roman',serif;
  --sans:'Archivo',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  --r:4px;--gut:16px;--max:1180px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:88px}
body{margin:0;background:var(--ink);color:var(--text);font:400 18px/1.6 var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(900px 500px at 85% -10%,rgba(212,169,79,.10),transparent 60%),radial-gradient(700px 500px at -10% 110%,rgba(92,200,255,.06),transparent 60%)}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--brass-2);outline-offset:2px;border-radius:2px}
.wrap{position:relative;z-index:1;max-width:var(--max);margin:0 auto;padding:0 var(--gut)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.hair{height:1px;background:linear-gradient(90deg,transparent,var(--brass) 20%,var(--brass) 80%,transparent);opacity:.45}

/* ---------- gate ---------- */
#gate{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:#000;padding:var(--gut)}
#gate .card{width:100%;max-width:400px;text-align:center}
.mark{font:700 13px/1 var(--sans);letter-spacing:.32em;text-transform:uppercase;color:var(--brass)}
#gate h1{font:700 clamp(40px,10vw,58px)/1 var(--display);margin:18px 0 10px;letter-spacing:-.01em}
#gate h1 em{font-style:italic;color:var(--brass-2)}
#gate p{color:var(--text-2);margin:0 0 28px}
#gate .gate-row{display:flex;gap:8px}
#gate .gate-row input{flex:1;min-width:0;height:52px;padding:0 16px;background:var(--ink-2);border:0;box-shadow:inset 0 0 0 1px var(--line-2);border-radius:var(--r);color:var(--text);font:500 17px var(--sans);letter-spacing:.04em}
#gate .gate-row input:focus{outline:none;box-shadow:inset 0 0 0 1px var(--brass)}
.btn{height:52px;padding:0 22px;border-radius:var(--r);background:var(--brass);color:#120d03;font-weight:700;letter-spacing:.04em}
.btn:hover{background:var(--brass-2)}
#gate .err{min-height:22px;margin-top:12px;color:var(--warn);font-size:14px}
#gate.shake .card{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#gate label.rem{display:flex;gap:10px;align-items:center;justify-content:center;min-height:44px;margin-top:8px;color:var(--text-2);font-size:15px;cursor:pointer}
#gate label.rem input{width:20px;height:20px;margin:0;accent-color:var(--brass)}

/* ---------- header ---------- */
header.top{position:sticky;top:0;z-index:20;background:rgba(0,0,0,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:14px;height:64px}
.brand{display:flex;align-items:baseline;gap:10px;text-decoration:none;white-space:nowrap}
.brand b{font:700 24px/1 var(--display)}
.brand b em{color:var(--brass-2)}
.brand span{font:600 10px/1 var(--sans);letter-spacing:.28em;text-transform:uppercase;color:var(--text-3)}
.search{position:relative;flex:1;max-width:520px;margin-left:auto}
.search input{width:100%;height:48px;padding:0 44px 0 42px;background:var(--ink-2);border:0;box-shadow:inset 0 0 0 1px var(--line-2);border-radius:999px;color:var(--text);font:500 17px var(--sans)}
.search input::placeholder{color:var(--text-3)}
.search input:focus{outline:none;box-shadow:inset 0 0 0 1px var(--brass)}
.search svg{position:absolute;left:15px;top:15px;width:18px;height:18px;stroke:var(--text-3)}
.search kbd{position:absolute;right:12px;top:11px;font:500 11px var(--mono);color:var(--text-3);border:1px solid var(--line-2);border-radius:4px;padding:2px 6px}
.search .clear{position:absolute;right:6px;top:4px;width:36px;height:36px;border-radius:50%;color:var(--text-2);display:none;font-size:20px}
.search.has .clear{display:block}.search.has kbd{display:none}

/* ---------- home ---------- */
.hero{padding:56px 0 34px}
.eyebrow{font:600 12px/1 var(--sans);letter-spacing:.28em;text-transform:uppercase;color:var(--brass)}
.hero h1{font:700 clamp(42px,8.4vw,92px)/.98 var(--display);letter-spacing:-.015em;margin:18px 0 18px;max-width:14ch}
.hero h1 em{color:var(--brass-2)}
.hero p{max-width:56ch;color:var(--text-2);font-size:20px;margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:14px}
.cat-card{position:relative;display:flex;flex-direction:column;gap:10px;min-height:190px;padding:24px;border-radius:6px;text-decoration:none;background:linear-gradient(160deg,var(--ink-2),var(--ink-1));box-shadow:inset 0 0 0 1px var(--line);overflow:hidden;transition:transform .2s,box-shadow .2s}
.cat-card::after{content:"";position:absolute;right:-60px;top:-60px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,var(--c),transparent 70%);opacity:.18;transition:.3s}
.cat-card:hover{transform:translateY(-2px);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 55%,transparent)}
.cat-card:hover::after{opacity:.32}
.cat-card .ico{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c)}
.cat-card .ico svg{width:24px;height:24px}
.cat-card h3{font:700 30px/1.05 var(--display);margin:6px 0 0}
.cat-card p{margin:0;color:var(--text-2);font-size:17px;line-height:1.5}
.cat-card .n{margin-top:auto;font:700 13px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--c)}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:56px 0 16px}
.section-h h2{font:700 30px/1.1 var(--display);margin:0}
.section-h span{color:var(--text-2);font-size:16px}

/* ---------- guide list ---------- */
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,360px),1fr));gap:10px}
.g-row{display:flex;gap:14px;align-items:flex-start;padding:18px;border-radius:6px;text-decoration:none;background:var(--ink-1);box-shadow:inset 0 0 0 1px var(--line);transition:.15s}
.g-row:hover{background:var(--ink-2);box-shadow:inset 0 0 0 1px var(--line-2)}
.g-row .dot{flex:none;width:10px;height:10px;margin-top:7px;border-radius:50%;background:var(--c);box-shadow:0 0 12px var(--c)}
.g-row h4{margin:0 0 6px;font:600 19px/1.3 var(--sans)}
.g-row p{margin:0;color:var(--text-2);font-size:16px;line-height:1.55}
.g-row .meta{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap}
.tag{font:700 12px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;padding:5px 8px;border-radius:3px;background:var(--ink-3);color:var(--text-2)}
.tag.soon{background:var(--brass-dim);color:var(--brass-2)}

/* ---------- category page ---------- */
.cat-head{padding:44px 0 24px;border-bottom:1px solid var(--line);margin-bottom:24px}
.cat-head h1{font:700 clamp(40px,7vw,72px)/1 var(--display);margin:12px 0 10px}
.cat-head h1 em{color:var(--c);font-style:normal}
.cat-head p{margin:0;color:var(--text-2);font-size:19px}
.empty{padding:48px 24px;text-align:center;border-radius:6px;box-shadow:inset 0 0 0 1px var(--line);color:var(--text-2)}
.empty b{display:block;font:700 26px var(--display);color:var(--text);margin-bottom:8px}

/* ---------- guide page ---------- */
.crumbs{display:flex;gap:8px;align-items:center;padding:26px 0 0;font-size:16px;color:var(--text-3);flex-wrap:wrap}
.crumbs a{text-decoration:none;color:var(--text-2)}.crumbs a:hover{color:var(--text)}
.g-head{padding:18px 0 28px}
.g-head h1{font:700 clamp(34px,6vw,60px)/1.04 var(--display);margin:10px 0 14px;max-width:22ch}
.g-head .sum{font-size:21px;line-height:1.5;color:var(--text-2);max-width:62ch;margin:0}
.g-head .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.layout{display:grid;grid-template-columns:1fr;gap:32px;padding-bottom:80px}
@media(min-width:980px){.layout{grid-template-columns:minmax(0,1fr) 260px}}
.toc{display:none}
@media(min-width:980px){.toc{display:block;position:sticky;top:140px;align-self:start}}
.toc h5{margin:0 0 10px;font:600 11px var(--sans);letter-spacing:.24em;text-transform:uppercase;color:var(--text-3)}
.toc a{display:block;padding:8px 0 8px 14px;border-left:1px solid var(--line-2);text-decoration:none;color:var(--text-2);font-size:16px}
.toc a:hover,.toc a.on{color:var(--text);border-color:var(--c)}
.g-sec{margin-bottom:44px}
.g-sec h2{display:flex;align-items:flex-start;gap:12px;font:700 32px/1.15 var(--display);margin:0 0 6px}
.g-sec h2::before{content:"";flex:none;width:22px;height:2px;margin-top:.6em;background:var(--c)}
.g-sec .intro{color:var(--text-2);margin:0 0 18px;font-size:19px}
ol.steps{list-style:none;margin:0;padding:0;counter-reset:s;display:grid;gap:12px}
ol.steps>li{counter-increment:s;position:relative;display:grid;grid-template-columns:44px 1fr;gap:14px;padding:18px;border-radius:6px;background:var(--ink-1);box-shadow:inset 0 0 0 1px var(--line)}
ol.steps>li::before{content:counter(s);display:grid;place-items:center;width:40px;height:40px;border-radius:50%;font:700 18px var(--display);color:#000;background:var(--c)}
ol.steps>li.hit{box-shadow:inset 0 0 0 1px var(--brass);animation:glow 1.6s}
@keyframes glow{0%{background:rgba(212,169,79,.18)}100%{background:var(--ink-1)}}
.step-body{min-width:0}
.step-body p{margin:8px 0 0}
.step-body p.do{margin-top:8px}
.step-body code,.g-sec code{font:500 .9em var(--mono);background:var(--ink-3);color:var(--brass-2);padding:2px 6px;border-radius:3px}
.callout{margin-top:14px;padding:14px 16px;border-radius:4px;font-size:18px;line-height:1.55;background:var(--ink-2);box-shadow:inset 3px 0 0 var(--brass)}
.callout.warn{box-shadow:inset 3px 0 0 var(--warn)}
.callout .lbl{display:block;font:700 13px var(--sans);letter-spacing:.18em;text-transform:uppercase;margin-bottom:4px;color:var(--brass-2)}
.callout.warn .lbl{color:var(--warn)}
figure.shot{width:fit-content;max-width:100%;margin:14px 0 0;border-radius:6px;overflow:hidden;background:#fff;box-shadow:0 0 0 1px var(--line-2),0 12px 40px rgba(0,0,0,.5);cursor:zoom-in;position:relative}
figure.shot img{display:block;width:100%;height:auto;margin:0 auto}
figure.shot figcaption{background:var(--ink-2);color:var(--text-2);font-size:16px;line-height:1.5;padding:10px 14px}
figure.shot::after{content:"Tap to enlarge";position:absolute;right:10px;top:10px;font:600 11px var(--sans);letter-spacing:.08em;padding:5px 8px;border-radius:3px;background:rgba(0,0,0,.72);color:#fff;opacity:0;transition:.2s}
figure.shot:hover::after{opacity:1}
.panel{padding:20px;border-radius:6px;background:var(--ink-1);box-shadow:inset 0 0 0 1px var(--line);margin-bottom:28px}
.panel h3{margin:0 0 12px;font:700 26px var(--display)}
.panel ul{margin:0;padding-left:22px;color:var(--text);font-size:18px;line-height:1.55}
.panel li+li{margin-top:6px}
.src{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 18px;border-radius:999px;text-decoration:none;font-weight:600;font-size:16px;box-shadow:inset 0 0 0 1px var(--line-2)}
.src:hover{box-shadow:inset 0 0 0 1px var(--brass);color:var(--brass-2)}
.soon-box{padding:40px 24px;border-radius:6px;text-align:center;background:linear-gradient(160deg,var(--ink-2),var(--ink-1));box-shadow:inset 0 0 0 1px var(--line)}
.soon-box b{display:block;font:700 28px var(--display);margin-bottom:8px}
.soon-box p{color:var(--text-2);margin:0 auto 20px;max-width:46ch}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
.pager a{padding:16px;border-radius:6px;text-decoration:none;box-shadow:inset 0 0 0 1px var(--line)}
.pager a:hover{box-shadow:inset 0 0 0 1px var(--line-2)}
.pager small{display:block;color:var(--text-3);font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.pager .nx{text-align:right}

/* ---------- search ---------- */
.s-head{padding:40px 0 20px}
.s-head h1{font:700 clamp(32px,5vw,48px)/1.1 var(--display);margin:0}
.s-head p{color:var(--text-2);margin:8px 0 0}
.hits{display:grid;gap:10px;padding-bottom:80px}
.hit{display:block;padding:18px;border-radius:6px;text-decoration:none;background:var(--ink-1);box-shadow:inset 0 0 0 1px var(--line)}
.hit:hover{background:var(--ink-2)}
.hit .where{display:flex;gap:8px;align-items:center;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--c);font-weight:600}
.hit h4{margin:6px 0 6px;font:600 20px/1.3 var(--sans)}
.hit p{margin:0;color:var(--text-2);font-size:17px;line-height:1.55}
mark{background:rgba(240,207,134,.25);color:var(--brass-2);border-radius:2px;padding:0 2px}

/* ---------- lightbox ---------- */
#lb{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.94);display:none;place-items:center;padding:20px;cursor:zoom-out}
#lb.on{display:grid}
#lb img{max-width:100%;max-height:86vh;border-radius:4px;background:#fff}
#lb p{color:var(--text-2);text-align:center;font-size:14px;max-width:70ch;margin:12px auto 0}
#lb button{position:absolute;top:14px;right:14px;width:44px;height:44px;border-radius:50%;background:var(--ink-3);font-size:22px}


.tbl{margin-top:14px;border-radius:6px;overflow:auto;box-shadow:inset 0 0 0 1px var(--line)}
.tbl table{width:100%;border-collapse:collapse;font-size:17px;line-height:1.5}
.tbl th{position:sticky;top:0;text-align:left;font:700 13px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--c,var(--brass));background:var(--ink-2);padding:12px 14px;border-bottom:1px solid var(--line-2)}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--text)}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:nth-child(even) td{background:rgba(255,255,255,.015)}
.tbl tr.hit td{background:rgba(212,169,79,.16)}
@media(max-width:640px){
  .tbl{box-shadow:none;overflow:visible}
  .tbl thead{display:none}
  .tbl table,.tbl tbody,.tbl tr,.tbl td{display:block;width:100%}
  .tbl tr{margin-bottom:10px;border-radius:6px;background:var(--ink-1);box-shadow:inset 0 0 0 1px var(--line);padding:6px 0}
  .tbl td{border:0;padding:6px 14px}
  .tbl td::before{content:attr(data-h);display:block;font:600 10px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--c,var(--brass))}
  .tbl tbody tr:nth-child(even) td{background:none}
}
.ico-in{display:inline-block;vertical-align:middle;max-height:34px;max-width:120px;background:#fff;border-radius:3px;padding:2px}

/* ===== v2: interactive steps, walkthrough, motion ===== */
#view{view-transition-name:view}
::view-transition-old(view){animation:vtOut .28s cubic-bezier(.4,0,1,1) both}
::view-transition-new(view){animation:vtIn .55s cubic-bezier(.16,1,.3,1) both}
@keyframes vtOut{to{opacity:0;transform:translateY(-14px) scale(.985);filter:blur(6px)}}
@keyframes vtIn{from{opacity:0;transform:translateY(28px) scale(.975);filter:blur(10px)}}
#view.enter{animation:vtIn .55s cubic-bezier(.16,1,.3,1) backwards}
.rise{animation:rise .6s cubic-bezier(.16,1,.3,1) backwards;animation-delay:calc(min(var(--i,0),14) * 45ms)}
@keyframes rise{from{opacity:0;transform:translateY(22px) scale(.98)}}
.cat-card,.g-row{--mx:50%;--my:50%}
.cat-card::before,.g-row::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .25s;background:radial-gradient(260px circle at var(--mx) var(--my),color-mix(in srgb,var(--c,var(--brass)) 22%,transparent),transparent 60%)}
.cat-card:hover::before,.g-row:hover::before{opacity:1}
.g-row{position:relative;overflow:hidden}
.hero h1 em{background:linear-gradient(100deg,var(--brass) 0%,var(--brass-2) 40%,#fff6dc 50%,var(--brass-2) 60%,var(--brass) 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sheen 5s ease-in-out infinite}
@keyframes sheen{0%,100%{background-position:100% 0}50%{background-position:0 0}}
#gate.opening .card{animation:gateOut .6s cubic-bezier(.7,0,.3,1) forwards}
#gate.opening{animation:gateFade .7s .15s ease forwards;background:radial-gradient(circle at 50% 50%,rgba(240,207,134,.35),#000 55%)}
@keyframes gateOut{to{opacity:0;transform:scale(1.18);filter:blur(12px)}}
@keyframes gateFade{to{opacity:0}}

/* step cards v2 */
ol.steps>li{grid-template-columns:52px 1fr;transition:background .25s,box-shadow .25s,opacity .25s}
ol.steps>li::before{content:none}
.num{position:relative;display:grid;place-items:center;width:44px;height:44px;border-radius:50%;font:700 19px var(--display);color:#000;background:var(--c);transition:transform .2s cubic-bezier(.3,1.6,.5,1),background .2s;box-shadow:0 0 0 0 var(--c)}
.num:hover{transform:scale(1.08)}
.num svg{position:absolute;width:22px;height:22px;opacity:0;transform:scale(.4);transition:.25s cubic-bezier(.3,1.6,.5,1)}
.num span{transition:.2s}
li.done .num{background:var(--ok)}
li.done .num span{opacity:0;transform:scale(.4)}
li.done .num svg{opacity:1;transform:scale(1)}
li.done .num{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{40%{transform:scale(1.25);box-shadow:0 0 0 10px rgba(91,227,160,.18)}}
li.done{background:rgba(91,227,160,.035)!important;box-shadow:inset 0 0 0 1px rgba(91,227,160,.28)!important}
li.done .do{color:var(--text-2)}
.step-body p.do{margin:8px 0 0;font-size:21px;line-height:1.45;font-weight:500}
.mrow{display:flex;gap:10px;align-items:flex-start;margin-top:12px;font-size:18px;line-height:1.5;color:var(--text-2)}
.mrow svg{flex:none;width:20px;height:20px;margin-top:3px;stroke:var(--c)}
.mrow b{color:var(--text);font-weight:600}
figure.shot.ex{background:#fff}
figure.shot{background:#e8ebef!important}
.exb{display:block;font:700 10px var(--sans);letter-spacing:.14em;text-transform:uppercase;padding:7px 12px;background:var(--brass);color:#120d03}
figure.shot img{transition:transform .5s cubic-bezier(.16,1,.3,1)}
figure.shot:hover img{transform:scale(1.015)}

/* progress dock */
.dock{position:sticky;top:112px;z-index:15;margin:0 0 26px;padding:12px 14px;border-radius:8px;background:rgba(10,13,17,.86);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:inset 0 0 0 1px var(--line-2),0 10px 30px rgba(0,0,0,.4);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.dock .meter{flex:1;min-width:140px}
.dock .meter small{display:flex;justify-content:space-between;font-size:14px;color:var(--text-3);letter-spacing:.06em;margin-bottom:6px}
.dock .meter small b{color:var(--text)}
.bar-o{height:6px;border-radius:99px;background:var(--ink-3);overflow:hidden}
.bar-i{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--c),var(--ok));transition:width .6s cubic-bezier(.16,1,.3,1)}
.go{display:inline-flex;align-items:center;gap:10px;height:50px;padding:0 22px;border-radius:999px;background:var(--c);color:#000;font-weight:700;font-size:17px;letter-spacing:.02em;position:relative;overflow:hidden;transition:transform .15s}

<!-- PART 3 · JS — paste once, before your app script runs; then call
       topMenu.build(groups)   once the data is ready
       topMenu.sync()          at the end of every route() (it also runs on hashchange)
     groups = [{ name:'Internet', c:'var(--internet)', items:[{ label:'Add a modem', href:'#/guide/add-modem' }, ...] }, ...]
     A group with a single item that IS the group may pass items:[] and href:'#/x' instead. -->
<script>
const topMenu=(()=>{
  const btn=()=>document.getElementById('mnu-btn'), nav=()=>document.getElementById('mnu');
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  let wired=false;
  function place(){ const h=document.querySelector('header.top'); if(h) document.documentElement.style.setProperty('--mnu-top',(h.getBoundingClientRect().bottom+8)+'px'); }
  function open(){ place(); nav().classList.add('on'); btn().setAttribute('aria-expanded','true'); btn().setAttribute('aria-label','Close menu'); const cur=nav().querySelector('a[aria-current]')||nav().querySelector('a'); if(cur){ cur.scrollIntoView({block:'nearest'}); cur.focus({preventScroll:true}); } }
  function close(refocus){ if(!nav().classList.contains('on')) return; nav().classList.remove('on'); btn().setAttribute('aria-expanded','false'); btn().setAttribute('aria-label','Open menu'); if(refocus) btn().focus({preventScroll:true}); }
  function build(groups){
    nav().innerHTML=`<a class="mnu-home" href="#/">Home</a>`+groups.map(g=>`<div class="mnu-g" style="--c:${g.c||'var(--brass)'}">${g.href&&!(g.items||[]).length?`<a href="${esc(g.href)}" style="padding-left:12px;font-weight:600">${esc(g.name)}</a>`:`<h6><i></i>${esc(g.name)}</h6>${(g.items||[]).map(it=>`<a href="${esc(it.href)}">${esc(it.label)}</a>`).join('')}`}</div>`).join('');
    if(!wired){ wired=true;
      btn().addEventListener('click',e=>{ e.stopPropagation(); nav().classList.contains('on')?close(true):open(); });
      nav().addEventListener('click',e=>{ if(e.target.closest('a')) close(false); });
      document.addEventListener('click',e=>{ if(!e.target.closest('#mnu,#mnu-btn')) close(false); });
      document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&nav().classList.contains('on')){ e.stopImmediatePropagation(); close(true); } },true);
      addEventListener('hashchange',()=>{ close(false); sync(); });
      addEventListener('resize',place,{passive:true});
    }
    sync();
  }
  function sync(){
    const h=location.hash||'#/';
    let best=null,len=0;
    nav().querySelectorAll('a').forEach(a=>{ a.removeAttribute('aria-current'); const href=a.getAttribute('href'); const key=href.split('~')[0];
      if((h===href||h.split('~')[0]===key||(key!=='#/'&&h.startsWith(key+'/')))&&key.length>len){ best=a; len=key.length; } });
    if(best) best.setAttribute('aria-current','page');
  }
  return {build,sync,open,close};
})();
</script>

/* ---------- unlock ---------- */
async function deriveKey(pass,salt,iter){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['decrypt']);
}
async function openWith(key){
  const p=JSON.parse(atob(await loadPayload()));
  const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(p.iv)},key,b64(p.ct));
  const raw=new Uint8Array(plain);
  const ds=new Blob([raw]).stream().pipeThrough(new DecompressionStream('gzip'));
  return JSON.parse(await new Response(ds).text());
}
async function unlock(pass,remember){
  const p=JSON.parse(atob(await loadPayload()));
  const key=await deriveKey(pass,b64(p.salt),p.iter);
  const data=await openWith(key);
  if(remember){ try{ const jwk=await crypto.subtle.exportKey('raw',key); localStorage.setItem('csg-k',JSON.stringify({v:p.v,k:btoa(String.fromCharCode(...new Uint8Array(jwk)))})); }catch(e){} }
  return data;
}
async function tryRemembered(){
  try{
    const s=JSON.parse(localStorage.getItem('csg-k')||'null'); if(!s) return null;
    const p=JSON.parse(atob(await loadPayload())); if(s.v!==p.v){localStorage.removeItem('csg-k');return null;}
    const key=await crypto.subtle.importKey('raw',b64(s.k),'AES-GCM',false,['decrypt']);
    return await openWith(key);
  }catch(e){ try{localStorage.removeItem('csg-k')}catch(_){} return null; }
}
async function doOpen(){
  const btn=$('#open-btn'); if(btn.disabled) return;
  if(!(window.crypto&&crypto.subtle)){ $('#gate-err').textContent='This browser view can’t unlock the guides. Open the page in Chrome or Safari.'; return; }
  if(!$('#pass').value.trim()){ $('#gate-err').textContent='Type the team passcode first.'; $('#pass').focus(); return; }
  btn.textContent='Opening…'; btn.disabled=true; $('#gate-err').textContent='';
  try{ start(await unlock($('#pass').value,$('#remember').checked)); }
  catch(err){ if(err&&err.name==='PayloadError'){ $('#gate-err').textContent='Couldn’t load the guides. Check your connection and try again.'; return; } if(!err||err.name!=='OperationError') console.error(err); $('#gate-err').textContent='That passcode didn’t work. Try again.'; $('#gate').classList.remove('shake'); void $('#gate').offsetWidth; $('#gate').classList.add('shake'); $('#pass').select(); }
  finally{ btn.textContent='Open'; btn.disabled=false; }
}

function start(data){
  DATA=data; buildIndex();
  const gate=$('#gate'); $('#app').hidden=false;
  if(gate){ if(RM2()) gate.remove(); else { gate.classList.add('opening'); setTimeout(()=>gate.remove(),850); } }
  topMenu.build(DATA.categories.map(c=>{ const gs=guidesIn(c.id).slice().sort((x,y)=>x.title.localeCompare(y.title));
    return gs.length?{name:c.name,c:`var(--${c.id})`,items:gs.map(g=>({label:g.title,href:`#/guide/${g.id}`}))}:{name:c.name,c:`var(--${c.id})`,items:[],href:`#/${c.id}`}; }));
  window.addEventListener('hashchange',route); route();
}
function buildIndex(){
  IDX=[];
  for(const g of DATA.guides){
    IDX.push({g,anchor:'',kind:'Guide',title:g.title,text:[g.title,g.summary,(g.keywords||[]).join(' ')].join(' ')});
    (g.sections||[]).forEach((s,si)=>{
      IDX.push({g,anchor:`s${si}`,kind:s.title,title:s.title,text:[s.title,s.intro||''].join(' ')});
      if(s.table) s.table.rows.forEach((r,ri)=>IDX.push({g,anchor:`s${si}-t${ri}`,kind:`${s.title} · Table`,title:g.title,text:r.join(' · ')}));
      (s.steps||[]).forEach((st,ti)=>IDX.push({g,anchor:`s${si}-${ti}`,kind:`${s.title} · Step ${ti+1}`,title:g.title,text:[st.text,st.where||'',st.result||'',st.note||'',st.warn||'',st.img?.alt||''].join(' ')}));
    });
    (g.tips||[]).forEach(t=>IDX.push({g,anchor:'tips',kind:'Good to know',title:g.title,text:t}));
  }
  IDX.forEach(r=>{r.text=r.text.replace(/\{\{img:[^}]+\}\}/g,'').replace(/\s+/g,' ').trim();r.lc=r.text.toLowerCase();});
}
function route(){
  row.i=0;
  const h=decodeURIComponent(location.hash.replace(/^#\/?/,''));
  const [a,b]=h.split('/');
  const prevA=LASTA; LASTA=a||'';
  if(a==='search'){ LASTA=prevA; renderSearch(b||''); LASTA='search'; }
  else if(a==='guide') renderGuide(b||'');
  else if(a && catOf(a)) renderCat(a);
  else renderHome();
  topMenu.sync();
}

}

/* progress memory (per device) */
const doneKey=g=>'csg-done-'+g.id;
function getDone(g){ try{return new Set(JSON.parse(localStorage.getItem(doneKey(g))||'[]'))}catch(_){return new Set()} }
function setDone(g,set){ try{localStorage.setItem(doneKey(g),JSON.stringify([...set]))}catch(_){} }
const allSteps=g=>g.sections.flatMap((s,si)=>(s.steps||[]).map((st,ti)=>({st,si,ti,sec:s.title,id:`s${si}-${ti}`})));
function paintDock(g){
  const steps=allSteps(g), d=getDone(g), n=steps.filter(x=>d.has(x.id)).length;
  const b=document.querySelector('.dock .bar-i'); if(!b) return;
  b.style.width=(steps.length?n/steps.length*100:0)+'%';
  document.querySelector('.dock .cnt').textContent=`${n} of ${steps.length} done`;
  document.querySelector('.dock .go b').textContent=n&&n<steps.length?'Resume step-by-step':'Start step-by-step';
}
function tableHtml(t,id){
  return `<div class="tbl" id="${id}"><table><thead><tr>${t.head.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${t.rows.map((r,ri)=>`<tr id="${id}${ri}">${r.map((c,ci)=>`<td data-h="${esc(t.head[ci]||'')}">${rich(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;

function renderGuide(param){
  const [gid,anchor]=param.split('~');
  /* guides split into one-task guides keep their old links working: send the old id (and old ~anchor, when it still has a home) to the new guide */
  if(!DATA.guides.some(x=>x.id===gid)&&DATA.redirects&&DATA.redirects[gid]){
    const m=(DATA.redirectAnchors||{})[gid]||{}, hit=anchor&&(m[anchor]||m[anchor.split('-')[0]]);
    const to=hit||DATA.redirects[gid];
    history.replaceState(null,'','#/guide/'+to); return renderGuide(to);
  }
  const g=DATA.guides.find(x=>x.id===gid); if(!g) return renderHome();
  const c=catOf(g.cat), sib=guidesIn(g.cat), i=sib.indexOf(g), prev=sib[i-1], next=sib[i+1];
  const DONE=getDone(g); CUR=g;
  const body = ready(g) ? `

    ${g.tips&&g.tips.length?`<details class="panel" id="tips"><summary><h3>Good to know</h3></summary><ul>${g.tips.map(x=>`<li>${rich(x)}</li>`).join('')}</ul></details>`:''}`
  : `<div class="soon-box"><b>This guide is being written.</b><p>The simplified step-by-step version with pictures is on its way. Until then, use the full article in Celestial.</p>${g.source?`<a class="src" href="${esc(g.source)}" target="_blank" rel="noopener">Open in Celestial ↗</a>`:''}</div>`;

    if(ready(g)) paintDock(g); dispatchEvent(new Event('scroll'));

/* keep a deep-linked step in place while cards animate in and pictures above it load; stop as soon as the user scrolls */
function settleOn(el){
  let quit=false; const t0=Date.now(), go=()=>{ if(!quit&&el.isConnected) el.scrollIntoView({block:'start'}); };
  const stop=()=>{ quit=true; document.removeEventListener('load',onImg,true); };
  const onImg=e=>{ if(Date.now()-t0>3000) return stop(); if(e.target.tagName==='IMG') requestAnimationFrame(go); };
  document.addEventListener('load',onImg,true);
  ['wheel','touchstart','keydown','pointerdown'].forEach(ev=>addEventListener(ev,stop,{once:true,passive:true}));
  setTimeout(go,700); setTimeout(()=>{ go(); stop(); },1400);
}
function snippet(text,terms){
  const lc=text.toLowerCase(); let at=-1;
  for(const t of terms){ const k=lc.indexOf(t); if(k>=0&&(at<0||k<at)) at=k; }
  let s=at>60?'…'+text.slice(at-50):text; if(s.length>190) s=s.slice(0,190)+'…';
  let out=esc(s); for(const t of terms){ if(t.length<2) continue; out=out.replace(new RegExp('('+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'),'<mark>$1</mark>'); }
  return out;
}
function search(q){
  const terms=q.toLowerCase().split(/\s+/).filter(Boolean); if(!terms.length) return [];
  const res=[];
  for(const r of IDX){
    if(!terms.every(t=>r.lc.includes(t))) continue;
    let score=0; for(const t of terms){ if(r.g.title.toLowerCase().includes(t)) score+=5; if(r.kind==='Guide') score+=2; score+=1; }
    res.push({r,score});
  }
  return res.sort((a,b)=>b.score-a.score).slice(0,60);
}
let LASTA='';
function renderSearch(q){ const anim=LASTA!=='search';
  const terms=q.toLowerCase().split(/\s+/).filter(Boolean), res=search(q);

}

/* never blow small screenshots up past 1.4x their real size */
document.addEventListener('load',e=>{ const im=e.target; if(im.tagName==='IMG'&&im.closest('figure.shot')&&im.naturalWidth){ im.style.maxWidth=Math.round(im.naturalWidth*1.4)+'px'; } },true);
/* delegated interactions */
document.addEventListener('click',e=>{
  const f=e.target.closest('figure.shot'); if(f){ openLB(f.querySelector('img')); return; }
  const nb=e.target.closest('.num'); if(nb&&CUR){ const d=getDone(CUR), id=nb.dataset.sid, li=nb.closest('li');
    if(d.has(id)){d.delete(id);li.classList.remove('done');nb.setAttribute('aria-pressed','false');} else {d.add(id);li.classList.add('done');nb.setAttribute('aria-pressed','true'); burst(nb,8);}
    setDone(CUR,d); paintDock(CUR); return; }
  if(e.target.closest('#go,#go2')&&CUR){ wkOpen(CUR); return; }
  if(e.target.closest('#reset')&&CUR){ setDone(CUR,new Set()); document.querySelectorAll('ol.steps li.done').forEach(li=>{li.classList.remove('done');li.querySelector('.num').setAttribute('aria-pressed','false')}); paintDock(CUR); return; }
});
document.addEventListener('pointermove',e=>{ const c=e.target.closest&&e.target.closest('.cat-card,.g-row'); if(!c) return; const r=c.getBoundingClientRect(); c.style.setProperty('--mx',(e.clientX-r.left)+'px'); c.style.setProperty('--my',(e.clientY-r.top)+'px'); },{passive:true});
function burst(el,n){ if(RM2()) return; const r=el.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2, cols=['#5be3a0','#f0cf86','#5cc8ff','#b48cff','#ffb05c'];
  for(let k=0;k<n;k++){ const p=document.createElement('i'); p.className='spark'; const a=Math.random()*Math.PI*2, d=40+Math.random()*(n>12?160:60);
    p.style.cssText=`left:${cx}px;top:${cy}px;background:${cols[k%cols.length]};--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d}px;--r:${Math.random()*540}deg`; document.body.appendChild(p); setTimeout(()=>p.remove(),1200); } }
/* ---------- walkthrough ---------- */
let WK=null;
function wkOpen(g){ const steps=allSteps(g); if(!steps.length) return; const d=getDone(g); let start=steps.findIndex(x=>!d.has(x.id)); if(start<0) start=0;
  WK={g,steps,i:start}; $('#wk').style.setProperty('--c',`var(--${g.cat})`); $('#wk-title').textContent=g.title; $('#wk').classList.add('on'); document.body.style.overflow='hidden'; wkRender(0); $('#wk-next').focus(); }
function wkClose(){ $('#wk').classList.remove('on'); document.body.style.overflow=''; if(WK){ const g=WK.g; WK=null; route(); } }
function wkRender(dir){ const {g,steps,i}=WK, stg=$('#wk-stage');
  if(i>=steps.length){ $('#wk-sec').textContent='Finished'; $('#wk-bar').style.width='100%';
    stg.innerHTML=`<div class="wk-card wk-done in-r"><div class="ring">${SV.check}</div><h2>All ${steps.length} steps done.</h2><p>${esc(g.title)} — nice work.</p></div>`;
    $('#wk-next').innerHTML='Back to the guide'; $('#wk-back').disabled=false; burst($('.wk-done .ring'),36); return; }
  const x=steps[i]; $('#wk-sec').textContent=x.sec; $('#wk-bar').style.width=(i/steps.length*100)+'%';
  stg.innerHTML=`<div class="wk-card ${dir<0?'in-l':'in-r'}"><div class="wk-count"><span class="big">${i+1}</span><span>Step ${i+1} of ${steps.length}<br>${esc(x.sec)} · ${x.ti+1}</span></div><p class="wk-text">${rich(x.st.text)}</p>${stepInner(x.st)}<p class="wk-hint">Tap a picture to zoom · Swipe or use ← → keys</p></div>`;
  stg.scrollTop=0; $('#wk-back').disabled=i===0;
  $('#wk-next').innerHTML=i===steps.length-1?`Done — finish ${SV.check}`:`Done — next step ${SV.arr}`; }
function wkNext(){ if(!WK) return; if(WK.i>=WK.steps.length){ wkClose(); return; } const d=getDone(WK.g); d.add(WK.steps[WK.i].id); setDone(WK.g,d); WK.i++; wkRender(1); }
function wkPrev(){ if(!WK||WK.i===0) return; WK.i--; wkRender(-1); }
$('#wk-next').addEventListener('click',wkNext); $('#wk-back').addEventListener('click',wkPrev); $('#wk-x').addEventListener('click',wkClose);
document.addEventListener('keydown',e=>{ if(!WK||$('#lb').classList.contains('on')) return; if(e.key==='ArrowRight'){e.preventDefault();wkNext();} else if(e.key==='ArrowLeft'){e.preventDefault();wkPrev();} else if(e.key==='Escape'){wkClose();} });
let tx=null; $('#wk-stage').addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
$('#wk-stage').addEventListener('touchend',e=>{ if(tx==null) return; const dx=e.changedTouches[0].clientX-tx; tx=null; if(Math.abs(dx)>70){ dx<0?wkNext():wkPrev(); } },{passive:true});
</script>
