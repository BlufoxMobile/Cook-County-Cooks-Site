<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="theme-color" content="#000000">
<title>BAPIS: Scan, Pack &amp; Pick Up</title>
<style>
  @font-face { font-family: 'Archivo'; font-style: normal; font-weight: 300 700; font-stretch: 62% 125%; font-display: swap;
    src: url(../../assets/fonts/archivo-latin.e3a28eade2.woff2) format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: 'Bodoni Moda'; font-style: normal; font-weight: 400 900; font-display: swap;
    src: url(../../assets/fonts/bodoni-moda-latin.c032219ef6.woff2) format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: 'Bodoni Moda'; font-style: italic; font-weight: 400 700; font-display: swap;
    src: url(../../assets/fonts/bodoni-moda-italic-latin.b737328c13.woff2) format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
</style>
<style>
/* Same design system as tools/csg-how-to (CSG How To Guides), so the two read as one set.
   Accent is CSG's "orders" colour. */
:root{
  --ink:#000;--ink-1:#07090c;--ink-2:#0d1116;--ink-3:#151b22;
  --line:rgba(255,255,255,.08);--line-2:rgba(255,255,255,.14);
  --text:#f2efe8;--text-2:#b9b4aa;--text-3:#7d7a74;
  --brass:#d4a94f;--brass-2:#f0cf86;--brass-dim:rgba(212,169,79,.16);
  --c:#ff7eb6;
  --warn:#ff8a65;--ok:#5be3a0;
  --display:'Bodoni Moda',Didot,'Times New Roman',serif;
  --sans:'Archivo',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:ui-monospace,'JetBrains Mono',Consolas,monospace;
  --r:4px;--gut:16px;--max:1180px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:190px}
body{margin:0;background:var(--ink);color:var(--text);font:400 16px/1.6 var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(900px 500px at 85% -10%,rgba(255,126,182,.10),transparent 60%),radial-gradient(700px 500px at -10% 110%,rgba(212,169,79,.07),transparent 60%)}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--brass-2);outline-offset:2px;border-radius:2px}
.wrap{position:relative;z-index:1;max-width:var(--max);margin:0 auto;padding:0 var(--gut)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.hair{height:1px;background:linear-gradient(90deg,transparent,var(--c) 20%,var(--c) 80%,transparent);opacity:.45}

/* ---------- header ---------- */
header.top{position:sticky;top:0;z-index:20;background:rgba(0,0,0,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:14px;height:64px}
.brand{display:flex;align-items:baseline;gap:10px;text-decoration:none;white-space:nowrap}
.brand b{font:700 24px/1 var(--display)}
.brand b em{color:var(--c)}
.brand span{font:600 10px/1 var(--sans);letter-spacing:.28em;text-transform:uppercase;color:var(--text-3)}
.search{position:relative;flex:1;max-width:520px;margin-left:auto}
.search input{width:100%;height:44px;padding:0 44px 0 42px;background:var(--ink-2);border:0;box-shadow:inset 0 0 0 1px var(--line-2);border-radius:999px;color:var(--text);font:500 15px var(--sans)}
.search input::placeholder{color:var(--text-3)}
.search input:focus{outline:none;box-shadow:inset 0 0 0 1px var(--c)}
.search input::-webkit-search-cancel-button{display:none}
.search svg{position:absolute;left:15px;top:13px;width:18px;height:18px;stroke:var(--text-3)}
.search kbd{position:absolute;right:12px;top:11px;font:500 11px var(--mono);color:var(--text-3);border:1px solid var(--line-2);border-radius:4px;padding:2px 6px}
.search .clear{position:absolute;right:6px;top:4px;width:36px;height:36px;border-radius:50%;color:var(--text-2);display:none;font-size:20px}
.search.has .clear{display:block}.search.has kbd{display:none}

/* ---------- guide page ---------- */
.g-head{padding:44px 0 28px}
.eyebrow{font:600 12px/1 var(--sans);letter-spacing:.28em;text-transform:uppercase;color:var(--c)}
.g-head h1{font:700 clamp(38px,7vw,76px)/1 var(--display);margin:14px 0 16px;max-width:18ch;letter-spacing:-.012em}
.g-head h1 em{background:linear-gradient(100deg,var(--c) 0%,#ffc2dc 40%,#fff2f8 50%,#ffc2dc 60%,var(--c) 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sheen 5s ease-in-out infinite;font-style:italic}
@keyframes sheen{0%,100%{background-position:100% 0}50%{background-position:0 0}}
.g-head .sum{font-size:18px;color:var(--text-2);max-width:62ch;margin:0}
.g-head .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:18px}
.tag{font:600 11px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;padding:5px 8px;border-radius:3px;background:var(--ink-3);color:var(--text-2)}
.layout{display:grid;grid-template-columns:1fr;gap:32px;padding:28px 0 80px}
@media(min-width:980px){.layout{grid-template-columns:minmax(0,1fr) 260px}}
.toc{display:none}
@media(min-width:980px){.toc{display:block;position:sticky;top:140px;align-self:start}}
.toc h5{margin:0 0 10px;font:600 11px var(--sans);letter-spacing:.24em;text-transform:uppercase;color:var(--text-3)}
.toc a{display:flex;justify-content:space-between;gap:8px;padding:7px 0 7px 14px;border-left:1px solid var(--line-2);text-decoration:none;color:var(--text-2);font-size:14px;transition:color .15s,border-color .15s}
.toc a small{color:var(--text-3);font-size:12px}
.toc a:hover,.toc a.on{color:var(--text);border-color:var(--c)}
.toc a.all small{color:var(--ok)}
.g-sec{margin-bottom:44px}
.g-sec h2{display:flex;align-items:center;gap:12px;font:700 28px/1.15 var(--display);margin:0 0 6px}
.g-sec h2::before{content:"";flex:none;width:22px;height:2px;background:var(--c)}
.g-sec .intro{color:var(--text-2);margin:0 0 18px}
.g-sec .intro b{color:var(--text)}
ol.steps{list-style:none;margin:0;padding:0;display:grid;gap:12px}
ol.steps>li{position:relative;display:grid;grid-template-columns:52px 1fr;gap:14px;padding:18px;border-radius:6px;background:var(--ink-1);box-shadow:inset 0 0 0 1px var(--line);transition:background .25s,box-shadow .25s,opacity .25s}
ol.steps>li.hit{box-shadow:inset 0 0 0 1px var(--brass);animation:glow 1.6s}
@keyframes glow{0%{background:rgba(212,169,79,.18)}100%{background:var(--ink-1)}}
.step-body{min-width:0}
.step-body .do{margin:8px 0 0;font-size:18px;line-height:1.5}
.step-body code{font:500 .9em var(--mono);background:var(--ink-3);color:var(--brass-2);padding:2px 6px;border-radius:3px}
.callout{margin-top:12px;padding:12px 14px;border-radius:4px;font-size:15px;background:var(--ink-2);box-shadow:inset 3px 0 0 var(--brass)}
.callout.warn{box-shadow:inset 3px 0 0 var(--warn)}
.callout .lbl{display:block;font:700 11px var(--sans);letter-spacing:.18em;text-transform:uppercase;margin-bottom:4px;color:var(--brass-2)}
.callout.warn .lbl{color:var(--warn)}
.callout a,.mrow a,.panel a{color:var(--brass-2)}
.shots{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}
figure.shot{width:fit-content;max-width:100%;margin:14px 0 0;border-radius:6px;overflow:hidden;background:#e8ebef;box-shadow:0 0 0 1px var(--line-2),0 12px 40px rgba(0,0,0,.5);cursor:zoom-in;position:relative}
figure.shot img{display:block;width:100%;height:auto;margin:0 auto;transition:transform .5s cubic-bezier(.16,1,.3,1)}
figure.shot:hover img{transform:scale(1.015)}
figure.shot figcaption{background:var(--ink-2);color:var(--text-3);font-size:13px;padding:8px 12px}
figure.shot::after{content:"Tap to enlarge";position:absolute;right:10px;top:10px;font:600 11px var(--sans);letter-spacing:.08em;padding:5px 8px;border-radius:3px;background:rgba(0,0,0,.72);color:#fff;opacity:0;transition:.2s}
figure.shot:hover::after{opacity:1}
/* tall phone-camera shots read better side by side than stacked */
@media(min-width:700px){.shots.pair figure.shot{max-width:calc(50% - 6px)}}
.panel{padding:20px;border-radius:6px;background:var(--ink-1);box-shadow:inset 0 0 0 1px var(--line);margin-bottom:28px}
.panel h3{margin:0 0 10px;font:700 22px var(--display)}
.panel ul{margin:0;padding-left:20px;color:var(--text-2)}
.panel li b{color:var(--text)}
.panel li+li{margin-top:6px}
.src{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 12px;border-radius:999px;text-decoration:none;font-weight:600;font-size:12px;box-shadow:inset 0 0 0 1px var(--line-2)}
.src:hover{box-shadow:inset 0 0 0 1px var(--c);color:var(--c)}
.tbl{margin-top:14px;border-radius:6px;overflow:auto;box-shadow:inset 0 0 0 1px var(--line)}
.tbl table{width:100%;border-collapse:collapse;font-size:15px}
.tbl th{text-align:left;font:600 11px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--c);background:var(--ink-2);padding:12px 14px;border-bottom:1px solid var(--line-2)}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--text)}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.hit td{background:rgba(212,169,79,.16)}
@media(max-width:640px){
  .tbl{box-shadow:none;overflow:visible}
  .tbl thead{display:none}
  .tbl table,.tbl tbody,.tbl tr,.tbl td{display:block;width:100%}
  .tbl tr{margin-bottom:10px;border-radius:6px;background:var(--ink-1);box-shadow:inset 0 0 0 1px var(--line);padding:6px 0}
  .tbl td{border:0;padding:6px 14px}
  .tbl td::before{content:attr(data-h);display:block;font:600 10px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--c)}
}

/* ---------- search ---------- */
.s-head{padding:40px 0 20px}
.s-head h1{font:700 clamp(32px,5vw,48px)/1.1 var(--display);margin:10px 0 0}
.s-head p{color:var(--text-2);margin:8px 0 0}
.s-head button{margin-top:14px;color:var(--text-2);text-decoration:underline;font-size:14px}
.hits{display:grid;gap:10px;padding-bottom:80px}
a.hit{display:block;padding:18px;border-radius:6px;text-decoration:none;background:var(--ink-1);box-shadow:inset 0 0 0 1px var(--line)}
a.hit:hover{background:var(--ink-2)}
a.hit .where{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--c);font-weight:600}
a.hit h4{margin:6px 0 4px;font:600 18px/1.3 var(--sans)}
a.hit p{margin:0;color:var(--text-2);font-size:15px}
mark{background:rgba(240,207,134,.25);color:var(--brass-2);border-radius:2px;padding:0 2px}

/* ---------- motion ---------- */
#view{view-transition-name:view}
::view-transition-old(view){animation:vtOut .28s cubic-bezier(.4,0,1,1) both}
::view-transition-new(view){animation:vtIn .55s cubic-bezier(.16,1,.3,1) both}
@keyframes vtOut{to{opacity:0;transform:translateY(-14px) scale(.985);filter:blur(6px)}}
@keyframes vtIn{from{opacity:0;transform:translateY(28px) scale(.975);filter:blur(10px)}}
#view.enter{animation:vtIn .55s cubic-bezier(.16,1,.3,1) both}
.rise{animation:rise .6s cubic-bezier(.16,1,.3,1) both;animation-delay:calc(min(var(--i,0),14) * 45ms)}
@keyframes rise{from{opacity:0;transform:translateY(22px) scale(.98)}}

/* step check-offs */
.num{position:relative;display:grid;place-items:center;width:44px;height:44px;border-radius:50%;font:700 19px var(--display);color:#000;background:var(--c);transition:transform .2s cubic-bezier(.3,1.6,.5,1),background .2s}
.num:hover{transform:scale(1.08)}
.num svg{position:absolute;width:22px;height:22px;opacity:0;transform:scale(.4);transition:.25s cubic-bezier(.3,1.6,.5,1)}
.num span{transition:.2s}
li.done .num{background:var(--ok);animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
li.done .num span{opacity:0;transform:scale(.4)}
li.done .num svg{opacity:1;transform:scale(1)}
@keyframes pop{40%{transform:scale(1.25);box-shadow:0 0 0 10px rgba(91,227,160,.18)}}
li.done{background:rgba(91,227,160,.035)!important;box-shadow:inset 0 0 0 1px rgba(91,227,160,.28)!important}
li.done .do{color:var(--text-2)}
.mrow{display:flex;gap:10px;align-items:flex-start;margin-top:10px;font-size:15px;color:var(--text-2)}
.mrow svg{flex:none;width:18px;height:18px;margin-top:2px;stroke:var(--c)}
.mrow b{color:var(--text);font-weight:600}

/* progress dock */
.dock{position:sticky;top:112px;z-index:15;margin:0 0 26px;padding:12px 14px;border-radius:8px;background:rgba(10,13,17,.86);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:inset 0 0 0 1px var(--line-2),0 10px 30px rgba(0,0,0,.4);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.dock .meter{flex:1;min-width:140px}
.dock .meter small{display:flex;justify-content:space-between;font-size:12px;color:var(--text-3);letter-spacing:.06em;margin-bottom:6px}
.dock .meter small b{color:var(--text)}
.bar-o{height:6px;border-radius:99px;background:var(--ink-3);overflow:hidden}
.bar-i{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--c),var(--ok));transition:width .6s cubic-bezier(.16,1,.3,1)}
.go{display:inline-flex;align-items:center;gap:10px;height:46px;padding:0 20px;border-radius:999px;background:var(--c);color:#000;font-weight:700;font-size:15px;letter-spacing:.02em;position:relative;overflow:hidden;transition:transform .15s}
.go:hover{transform:translateY(-1px)}
.go::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);transform:translateX(-120%);animation:sweep 3.2s 1s ease-in-out infinite}
@keyframes sweep{60%,100%{transform:translateX(120%)}}
.go svg{width:18px;height:18px}
.ghost{height:46px;padding:0 14px;border-radius:999px;color:var(--text-2);font-size:14px;box-shadow:inset 0 0 0 1px var(--line-2)}
.ghost:hover{color:var(--text)}

/* walkthrough */
#wk{position:fixed;inset:0;z-index:70;display:none;flex-direction:column;background:radial-gradient(1200px 600px at 50% -10%,rgba(255,126,182,.14),transparent 60%),#000;color:var(--text)}
#wk.on{display:flex;animation:wkIn .5s cubic-bezier(.16,1,.3,1)}
@keyframes wkIn{from{opacity:0;transform:scale(1.04)}}
.wk-top{display:flex;align-items:center;gap:14px;padding:14px var(--gut);border-bottom:1px solid var(--line)}
.wk-top .t{flex:1;min-width:0}
.wk-top .t b{display:block;font:700 18px var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk-top .t small{color:var(--c);font:600 11px var(--sans);letter-spacing:.18em;text-transform:uppercase}
.wk-x{width:44px;height:44px;border-radius:50%;background:var(--ink-3);font-size:22px;flex:none}
.wk-prog{height:4px;background:var(--ink-3)}
.wk-prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--c),var(--ok));transition:width .5s cubic-bezier(.16,1,.3,1);box-shadow:0 0 18px var(--c)}
.wk-stage{flex:1;overflow:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:22px var(--gut) 30px}
.wk-card{max-width:980px;margin:0 auto}
.wk-card.in-r{animation:inR .45s cubic-bezier(.16,1,.3,1)}
.wk-card.in-l{animation:inL .45s cubic-bezier(.16,1,.3,1)}
@keyframes inR{from{opacity:0;transform:translateX(60px);filter:blur(8px)}}
@keyframes inL{from{opacity:0;transform:translateX(-60px);filter:blur(8px)}}
.wk-count{display:flex;align-items:center;gap:12px;color:var(--text-3);font:600 12px var(--sans);letter-spacing:.16em;text-transform:uppercase}
.wk-count .big{display:grid;place-items:center;width:58px;height:58px;border-radius:50%;background:var(--c);color:#000;font:700 26px var(--display);letter-spacing:0;animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
.wk-text{font:600 clamp(22px,3.4vw,32px)/1.3 var(--sans);margin:18px 0 6px;letter-spacing:-.005em}
.wk-card .mrow{font-size:17px}
.wk-card figure.shot{margin-top:18px;width:fit-content!important}
.wk-card figure.shot img{max-height:58vh;width:auto;max-width:100%;object-fit:contain;background:#fff}
.wk-nav{display:flex;gap:10px;padding:12px var(--gut) calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:rgba(0,0,0,.6)}
.wk-nav button{height:56px;border-radius:12px;font-weight:700;font-size:16px}
.wk-back{width:120px;box-shadow:inset 0 0 0 1px var(--line-2);color:var(--text-2)}
.wk-back:disabled{opacity:.35}
.wk-next{flex:1;background:var(--c);color:#000;display:flex;align-items:center;justify-content:center;gap:10px}
.wk-next svg{width:20px;height:20px}
.wk-hint{color:var(--text-3);font-size:12px;text-align:center;margin-top:14px}
.wk-done{text-align:center;padding:12vh 0}
.wk-done .ring{width:120px;height:120px;margin:0 auto 26px;border-radius:50%;display:grid;place-items:center;background:var(--ok);color:#000;animation:pop .7s cubic-bezier(.3,1.6,.5,1);position:relative}
.wk-done .ring::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--ok);animation:ripple 1.6s ease-out infinite}
@keyframes ripple{to{inset:-40px;opacity:0}}
.wk-done .ring svg{width:56px;height:56px}
.wk-done h2{font:700 clamp(32px,6vw,54px)/1.05 var(--display);margin:0 0 10px}
.wk-done p{color:var(--text-2)}
.spark{position:fixed;width:8px;height:8px;border-radius:2px;pointer-events:none;z-index:80;animation:spark 1.1s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}

/* lightbox */
#lb{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.94);display:none;place-items:center;padding:20px;overflow:auto}
#lb.on{display:grid}
#lb img{max-width:100%;max-height:86vh;border-radius:4px;background:#fff;cursor:zoom-in;transition:max-width .3s,max-height .3s}
#lb p{color:var(--text-2);text-align:center;font-size:14px;max-width:70ch;margin:12px auto 0}
#lb button{position:fixed;top:14px;right:14px;width:44px;height:44px;border-radius:50%;background:var(--ink-3);font-size:22px;z-index:1}
#lb.zoom{place-items:start;align-content:start}
#lb.zoom img{max-width:none;max-height:none;width:auto;cursor:zoom-out}

footer{padding:40px 0 60px;color:var(--text-3);font-size:13px;border-top:1px solid var(--line)}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}

@media(max-width:640px){
  .bar{height:auto;flex-wrap:wrap;padding:12px 0 10px;gap:10px}
  .brand b{font-size:21px}
  .brand span{display:none}
  .search{max-width:none;flex-basis:100%;order:3}
  .search kbd{display:none}
  .g-head{padding:30px 0 20px}
  .g-head .sum{font-size:16px}
  ol.steps>li{grid-template-columns:1fr;gap:6px;padding:16px}
  html{scroll-padding-top:236px}
  .dock{top:147px;padding:10px 12px;gap:10px}
  .dock .meter{min-width:96px}
  .go{flex:1 0 auto;justify-content:center;white-space:nowrap;padding:0 16px}
  .go svg{flex:none}
  .ghost{display:none}
  .dock .meter small span{display:none}
}
@media(pointer:coarse){.src{height:44px}.dock{top:118px}html{scroll-padding-top:200px}}
@media(pointer:coarse) and (max-width:640px){.dock{top:153px}html{scroll-padding-top:242px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- simplified layout (Oct 2026) — same pattern as the CSG guide ---------- */
.hero{padding:52px 0 26px}
.hero h1{font:700 clamp(40px,8vw,84px)/.98 var(--display);letter-spacing:-.015em;margin:16px 0 14px;max-width:14ch}
.hero h1 em{color:var(--c);font-style:italic}

<script>
const topMenu=(()=>{
  const btn=()=>document.getElementById('mnu-btn'), nav=()=>document.getElementById('mnu');
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  let wired=false;
  function place(){ const h=document.querySelector('header.top'); if(h) document.documentElement.style.setProperty('--mnu-top',(h.getBoundingClientRect().bottom+8)+'px'); }
  function open(){ place(); nav().classList.add('on'); btn().setAttribute('aria-expanded','true'); btn().setAttribute('aria-label','Close menu'); const cur=nav().querySelector('a[aria-current]')||nav().querySelector('a'); if(cur){ cur.scrollIntoView({block:'nearest'}); cur.focus({preventScroll:true}); } }
  function close(refocus){ if(!nav().classList.contains('on')) return; nav().classList.remove('on'); btn().setAttribute('aria-expanded','false'); btn().setAttribute('aria-label','Open menu'); if(refocus) btn().focus({preventScroll:true}); }
  function build(groups){
    nav().innerHTML=`<a class="mnu-home" href="#/">Home</a>`+groups.map(g=>`<div class="mnu-g" style="--c:${g.c||'var(--brass)'}">${g.href&&!(g.items||[]).length?`<a href="${esc(g.href)}" style="padding-left:12px;font-weight:600">${esc(g.name)}</a>`:`<h6><i></i>${esc(g.name)}</h6>${(g.items||[]).map(it=>`<a href="${esc(it.href)}">${esc(it.label)}</a>`).join('')}`}</div>`).join('');
    if(!wired){ wired=true;
      btn().addEventListener('click',e=>{ e.stopPropagation(); nav().classList.contains('on')?close(true):open(); });
      nav().addEventListener('click',e=>{ if(e.target.closest('a')) close(false); });
      document.addEventListener('click',e=>{ if(!e.target.closest('#mnu,#mnu-btn')) close(false); });
      document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&nav().classList.contains('on')){ e.stopImmediatePropagation(); close(true); } },true);
      addEventListener('hashchange',()=>{ close(false); sync(); });
      addEventListener('resize',place,{passive:true});
    }
    sync();
  }
  function sync(){
    const h=location.hash||'#/';
    let best=null,len=0;
    nav().querySelectorAll('a').forEach(a=>{ a.removeAttribute('aria-current'); const href=a.getAttribute('href'); const key=href.split('~')[0];
      if((h===href||h.split('~')[0]===key||(key!=='#/'&&h.startsWith(key+'/')))&&key.length>len){ best=a; len=key.length; } });
    if(best) best.setAttribute('aria-current','page');
  }
  return {build,sync,open,close};
})();
</script>

const $=s=>document.querySelector(s);
const RM=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rich=s=>esc(s).replace(/\[(.+?)\]\((https:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1 ↗</a>').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`(.+?)`/g,'<code>$1</code>');
const plain=s=>String(s??'').replace(/\[(.+?)\]\([^)]+\)/g,'$1').replace(/\*\*|`/g,'');
const SV={check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>',pin:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>',eye:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>',arr:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>'};

const slugify=s=>s.toLowerCase().replace(/&/g,' ').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');

const GROUPS=G.groups.map(g=>({name:g.name,secs:g.secs}));
const groupOf=si=>GROUPS.find(g=>g.secs.includes(si));

const secHref=(si,anchor)=>`#/do/${SECS[si].slug}${anchor?'~'+anchor:''}`;

/* ---------- progress memory (this device only) ---------- */
const DK='bapis-done-v1';
function getDone(){ try{return new Set(JSON.parse(localStorage.getItem(DK)||'[]'))}catch(_){return new Set()} }
function setDone(set){ try{localStorage.setItem(DK,JSON.stringify([...set]))}catch(_){} }

/* ---------- markup ---------- */
function figHtml(st){
  if(!st.imgs.length) return '';
  const tall=st.imgs.length>1 && st.imgs.every(im=>im.h>im.w*1.15);
  return `<div class="shots${tall?' pair':''}">${st.imgs.map(im=>`<figure tabindex="0" role="button" class="shot" style="width:${im.w}px" aria-label="Enlarge picture: ${esc(im.cap)}"><img loading="lazy" decoding="async" src="shots/${im.f}" width="${im.w}" height="${im.h}" alt="${esc(im.alt||im.cap)}"><figcaption>${rich(im.cap)}</figcaption></figure>`).join('')}</div>`;
}
/* CSG pattern: one action line, a visible "Heads up" only for real warnings, pictures always visible, the rest behind "More info" */
function stepInner(st){
  const extra=`${st.where?`<div class="mrow">${SV.pin}<span><b>Where:</b> ${rich(st.where)}</span></div>`:''}${st.result?`<div class="mrow">${SV.eye}<span><b>You'll see:</b> ${rich(st.result)}</span></div>`:''}${st.note?`<div class="callout"><span class="lbl">Tip</span>${rich(st.note)}</div>`:''}`;
  return `${st.warn?`<div class="callout warn"><span class="lbl">Heads up</span>${rich(st.warn)}</div>`:''}
    ${figHtml(st)}
    ${extra?`<details class="more"><summary><span>More info</span></summary>${extra}</details>`:''}`;
}
function stepHtml(st,id,n,done,i){
  return `<li id="${id}" class="rise${done?' done':''}" style="--i:${i}"><button class="num" type="button" data-sid="${id}" aria-pressed="${done}" aria-label="Mark step ${n} done"><span>${n}</span>${SV.check}</button><div class="step-body"><p class="do">${rich(st.text)}</p>${stepInner(st)}</div></li>`;
}
function tableHtml(t,id){
  return `<div class="tbl" id="${id}"><table><thead><tr>${t.head.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${t.rows.map((r,ri)=>`<tr id="${id}${ri}">${r.map((c,ci)=>`<td data-h="${esc(t.head[ci]||'')}">${rich(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
const moreHtml=s=>s?`<details class="more"><summary><span>More info</span></summary><p class="intro">${rich(s)}</p></details>`:'';
const panelHtml=(id,title,items)=>`<details class="panel" id="${id}"><summary><h3>${title}</h3></summary><ul>${items.map(x=>`<li>${rich(x)}</li>`).join('')}</ul></details>`;
function pickOptions(){
  return `<option value="">Choose a task…</option>`+GROUPS.map(g=>`<optgroup label="${esc(g.name)}">${g.secs.map(si=>`<option value="${esc(SECS[si].slug)}">${esc(G.sections[si].title)}</option>`).join('')}</optgroup>`).join('')
    +`<optgroup label="Whole guide"><option value="all">Every step, start to finish</option></optgroup>`;
}

/* ---------- views ---------- */
let VIEW='', CUR=null;
function setView(html,anim,after){
  const apply=()=>{ $('#view').innerHTML=html; if(after) after(); };
  if(anim && !RM() && document.startViewTransition && setView.ready) document.startViewTransition(apply);
  else { apply(); if(anim && !RM()){ const v=$('#view'); v.classList.remove('enter'); void v.offsetWidth; v.classList.add('enter'); } }
  setView.ready=true;
}

      ${secs}
      ${panelHtml('tips','Good to know',G.tips)}
      ${task?`<div class="pager">${prev?`<a href="${secHref(prev.si)}"><small>← Previous</small>${esc(prev.s.title)}</a>`:'<a href="#/"><small>← Back</small>All tasks</a>'}${next?`<a class="nx" href="${secHref(next.si)}"><small>Next →</small>${esc(next.s.title)}</a>`:'<a class="nx" href="#/"><small>Done →</small>All tasks</a>'}</div>`:''}
    </article>
    <aside class="toc" data-mode="${v.mode}">${toc}</aside>
  </div>`;
}
function showGuide(v,anchor,opts={}){
  const key=v.mode+':'+v.path, fresh=VIEW!==key;
  /* landing on an anchor: no entrance motion — a scaled/translated view makes scrollIntoView aim short */
  if(fresh){ CUR=v; VIEW=key; setView(guideHtml(v),!anchor,()=>{ paintDock(); spy(); if(anchor) document.querySelectorAll('#view .rise').forEach(x=>x.classList.remove('rise')); }); }
  const top=!anchor||(v.mode==='task'&&anchor===`s${v.sis[0]}`);
  const go=()=>{ if(!top){ const el=document.getElementById(anchor); if(el){ if(el.tagName==='DETAILS') el.open=true; if(el.tagName==='LI'&&!opts.quiet){ const m=el.querySelector('details.more'); if(m) m.open=true; }
      el.scrollIntoView({block:'start',behavior:fresh||RM()?'auto':'smooth'}); if(el.tagName==='LI'||el.tagName==='TR'){ el.classList.remove('hit'); void el.offsetWidth; el.classList.add('hit'); } } } else if(fresh) window.scrollTo(0,0); };
  if(fresh){ requestAnimationFrame(()=>requestAnimationFrame(go));
    /* web fonts can re-wrap the text above the target; settle once more if the reader hasn't moved */
    if(!top&&document.fonts&&document.fonts.status!=='loaded'){ const y0=()=>scrollY; let y; requestAnimationFrame(()=>requestAnimationFrame(()=>{ y=y0(); })); document.fonts.ready.then(()=>{ if(Math.abs(scrollY-y)<4) go(); }); } }
  else go();
}
function route(){
  let h=decodeURIComponent(location.hash.replace(/^#\/?/,''));
  if(h.startsWith('search/')){ const q=h.slice(7); if(qi.value.trim()!==q){ qi.value=q; $('#search').classList.toggle('has',!!q); } renderSearch(q); topMenu.sync(); return; }
  if(qi.value){ qi.value=''; $('#search').classList.remove('has'); }
  /* old one-page links (#/~s2, #/~s1-3, #/~tips) still land on the right task */
  if(h.startsWith('~')){ const a=h.slice(1), m=a.match(/^s(\d+)/), tgt=m&&G.sections[+m[1]]?`do/${SECS[+m[1]].slug}~${a}`:`all~${a}`; history.replaceState(null,'','#/'+tgt); h=tgt; }
  const [path,anchor='']=h.split('~');
  const sec=path.startsWith('do/')&&SECS.find(x=>x.slug===path.slice(3));
  if(sec) showGuide({mode:'task',path,sis:[sec.si]},anchor);
  else if(path==='all') showGuide({mode:'all',path,sis:ALL},anchor);
  else renderHome();
  topMenu.sync();
}

/* ---------- scroll spy (whole-guide page) ---------- */
let IO=null;
function spy(){
  if(IO) IO.disconnect();
  if(!CUR||CUR.mode!=='all') return;
  const secs=[...document.querySelectorAll('.g-sec')]; if(!secs.length||!('IntersectionObserver' in window)) return;
  const vis=new Map();
  IO=new IntersectionObserver(es=>{ es.forEach(e=>vis.set(e.target.id,e.isIntersecting?e.boundingClientRect.top:null));
    const on=secs.find(s=>vis.get(s.id)!=null); mark(on?on.id:null); },{rootMargin:'-200px 0px -55% 0px'});
  secs.forEach(s=>IO.observe(s));
}
function mark(id){ document.querySelectorAll('.toc[data-mode="all"] a').forEach(a=>a.classList.toggle('on',a.dataset.a===id)); }

/* ---------- progress ---------- */
function paintDock(){
  if(!CUR) return; const steps=stepsOf(CUR.sis), d=getDone(), n=steps.filter(x=>d.has(x.id)).length, b=$('.dock .bar-i'); if(!b) return;
  b.style.width=(n/steps.length*100)+'%';
  $('.dock .cnt').textContent=`${n} of ${steps.length} done`;
  $('.dock .go b').textContent=n&&n<steps.length?'Resume step-by-step':'Start step-by-step';
  document.querySelectorAll('.toc a').forEach(a=>{ const href=a.getAttribute('href'), m=href.match(/~s(\d+)$/)||[null,(SECS.find(x=>secHref(x.si)===href)||{}).si]; if(m[1]==null) return;
    const si=+m[1], ids=G.sections[si].steps.map((_,ti)=>`s${si}-${ti}`), k=ids.filter(x=>d.has(x)).length; const sm=a.querySelector('small'); if(sm) sm.textContent=`${k}/${ids.length}`; a.classList.toggle('all',k===ids.length); });
}

/* ---------- search (indexes the hidden More-info text too) ---------- */
const IDX=[];
G.sections.forEach((s,si)=>{
  IDX.push({href:secHref(si),kind:'Task',title:s.title,text:[s.title,s.nav,s.intro||'',s.introMore||''].join(' ')});
  s.steps.forEach((st,ti)=>IDX.push({href:secHref(si,`s${si}-${ti}`),kind:`${s.title} · Step ${ti+1}`,title:plain(st.text),text:[st.text,st.where||'',st.result||'',st.note||'',st.warn||'',...st.imgs.map(i=>i.cap)].join(' ')}));
  if(s.table) s.table.rows.forEach((r,ri)=>IDX.push({href:secHref(si,`s${si}-t${ri}`),kind:`${s.title} · Table`,title:plain(r[0]),text:r.join(' ')}));
});
G.before.forEach(t=>IDX.push({href:'#/all~before',kind:'Before you start',title:'Before you start',text:t}));
G.tips.forEach(t=>IDX.push({href:'#/all~tips',kind:'Good to know',title:'Good to know',text:t}));
IDX.forEach(r=>{ r.text=plain(r.text).replace(/\s+/g,' ').trim(); r.lc=r.text.toLowerCase(); });
const SYN={code:['pickup code','pick up code'],slip:['packing slip','receipt'],receipt:['slip','reprint'],reprint:['receipt'],print:['printer','slip'],cancel:['exit','unpack'],id:['identification','authentication'],sign:['signature'],pay:['payment'],return:['unpack','inventory'],stock:['inventory'],scan:['scanner','barcode'],ticket:['techspot'],help:['techspot','issue'],mobile:['xfinity mobile'],error:['retry','owner required'],owner:['primary account holder'],email:['pickup code']};
function search(q){
  const terms=q.toLowerCase().split(/\s+/).filter(Boolean); if(!terms.length) return [];
  const has=(r,t)=>r.lc.includes(t)||(SYN[t]||[]).some(x=>r.lc.includes(x))||(t.length>3&&t.endsWith('s')&&r.lc.includes(t.slice(0,-1)));
  return IDX.filter(r=>terms.every(t=>has(r,t))).map(r=>{ let sc=0; terms.forEach(t=>{ if(r.title.toLowerCase().includes(t)) sc+=4; if(r.lc.includes(t)) sc+=2; }); if(r.kind==='Task') sc+=1; return {r,sc}; }).sort((a,b)=>b.sc-a.sc).slice(0,40);
}
function snippet(text,terms){
  const lc=text.toLowerCase(); let at=-1;
  for(const t of terms){ const k=lc.indexOf(t); if(k>=0&&(at<0||k<at)) at=k; }
  let s=at>60?'…'+text.slice(at-50):text; if(s.length>200) s=s.slice(0,200)+'…';
  let out=esc(s); for(const t of terms){ if(t.length<2) continue; out=out.replace(new RegExp('('+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'),'<mark>$1</mark>'); }
  return out;
}
function renderSearch(q){
  const anim=VIEW!=='search'; VIEW='search'; CUR=null; if(IO) IO.disconnect();
  const terms=q.toLowerCase().split(/\s+/).filter(Boolean), res=search(q);
  setView(`<section class="s-head"><div class="eyebrow">Search this guide</div><h1>“${esc(q)}”</h1><p>${res.length?`${res.length} match${res.length===1?'':'es'}`:'No matches. Try a shorter word: pack, code, unpack, slip, ID, signature.'}</p><button type="button" id="s-back">← Back to the tasks</button></section>
  <div class="hits">${res.map(({r},k)=>`<a class="hit${anim?' rise':''}" style="--i:${k}" href="${r.href}"><div class="where">${esc(r.kind)}</div><h4>${esc(r.title)}</h4><p>${snippet(r.text,terms)}</p></a>`).join('')}</div>`,anim);
  window.scrollTo(0,0);
}
const qi=$('#q'); let qt=null;
qi.addEventListener('input',()=>{ $('#search').classList.toggle('has',!!qi.value); clearTimeout(qt); qt=setTimeout(()=>{ const v=qi.value.trim(); if(v) history.replaceState(null,'','#/search/'+encodeURIComponent(v)); else history.replaceState(null,'','#/'); route(); },140); });
qi.addEventListener('keydown',e=>{ if(e.key==='Enter'){ const first=$('a.hit'); if(first) first.click(); qi.blur(); } if(e.key==='Escape'){ qi.value=''; qi.dispatchEvent(new Event('input')); } });
$('#q-clear').addEventListener('click',()=>{ qi.value=''; qi.dispatchEvent(new Event('input')); qi.focus(); });
document.addEventListener('keydown',e=>{ const typing=/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName); if(!typing&&(e.key==='/'||((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'))&&!WK){ e.preventDefault(); qi.focus(); qi.select(); } if(e.key==='Escape'&&$('#lb').classList.contains('on')){ closeLB(); e.stopImmediatePropagation(); return; } if((e.key==='Enter'||e.key===' ')&&!typing&&document.activeElement.matches('figure.shot')){ e.preventDefault(); document.activeElement.click(); } });

/* ---------- lightbox ---------- */
let LBret=null;
function openLB(im){ LBret=document.activeElement; $('#lb img').src=im.src; $('#lb img').alt=im.alt; $('#lb p').textContent=im.alt; $('#lb').classList.remove('zoom'); $('#lb').classList.add('on'); $('#lb button').focus(); }
function closeLB(){ const was=$('#lb').classList.contains('on'); $('#lb').classList.remove('on','zoom'); if(was&&LBret&&LBret.focus&&document.contains(LBret)) LBret.focus({preventScroll:true}); LBret=null; }
$('#lb').addEventListener('click',e=>{ if(e.target.tagName==='IMG'){ $('#lb').classList.toggle('zoom'); return; } closeLB(); });

/* ---------- clicks ---------- */
document.addEventListener('click',e=>{
  if(e.target.closest('#s-back')){ location.hash='#/'; return; }
  const f=e.target.closest('figure.shot'); if(f){ openLB(f.querySelector('img')); return; }
  const nb=e.target.closest('.num'); if(nb){ const d=getDone(), id=nb.dataset.sid, li=nb.closest('li');
    if(d.has(id)){ d.delete(id); li.classList.remove('done'); nb.setAttribute('aria-pressed','false'); } else { d.add(id); li.classList.add('done'); nb.setAttribute('aria-pressed','true'); burst(nb,8); }
    setDone(d); paintDock(); return; }
  if(e.target.closest('#go')){ if(CUR) wkOpen(stepsOf(CUR.sis),CUR.mode==='task'?G.sections[CUR.sis[0]].title:G.title); return; }
  if(e.target.closest('#go-all')){ wkOpen(STEPS,G.title); return; }
  if(e.target.closest('#reset')){ const d=getDone(); if(CUR) stepsOf(CUR.sis).forEach(x=>d.delete(x.id)); setDone(d); document.querySelectorAll('ol.steps li.done').forEach(li=>{ li.classList.remove('done'); li.querySelector('.num').setAttribute('aria-pressed','false'); }); paintDock(); return; }
  /* same-hash anchor clicks still jump (hashchange won't fire) */
  const a=e.target.closest('a[href^="#/"]'); if(a&&a.getAttribute('href').includes('~')&&a.getAttribute('href')===location.hash){ e.preventDefault(); route(); }
});
function burst(el,n){ if(RM()) return; const r=el.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2, cols=['#5be3a0','#f0cf86','#ff7eb6','#5cc8ff','#ffb05c'];
  for(let k=0;k<n;k++){ const p=document.createElement('i'); p.className='spark'; const a=Math.random()*Math.PI*2, d=40+Math.random()*(n>12?160:60);
    p.style.cssText=`left:${cx}px;top:${cy}px;background:${cols[k%cols.length]};--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d}px;--r:${Math.random()*540}deg`; document.body.appendChild(p); setTimeout(()=>p.remove(),1200); } }

/* ---------- step-by-step walkthrough ---------- */
let WK=null;
function wkOpen(list,title){ const d=getDone(); let i=list.findIndex(x=>!d.has(x.id)); if(i<0) i=0;
  WK={i,list}; $('#wk-title').textContent=title||G.title; $('#wk').classList.add('on'); document.body.style.overflow='hidden'; wkRender(0); $('#wk-next').focus(); }
function wkClose(){ if(!WK) return; $('#wk').classList.remove('on'); document.body.style.overflow=''; const at=WK.list[Math.min(WK.i,WK.list.length-1)]; WK=null;
  if(CUR){ const v=CUR; VIEW=''; showGuide(v,at&&v.sis.includes(at.si)?at.id:'',{quiet:true}); } else { VIEW=''; renderHome(); } }
function wkRender(dir){ const L=WK.list, i=WK.i, stg=$('#wk-stage');
  if(i>=L.length){ $('#wk-sec').textContent='Finished'; $('#wk-bar').style.width='100%';
    stg.innerHTML=`<div class="wk-card wk-done in-r"><div class="ring">${SV.check}</div><h2>All ${L.length} steps done.</h2><p>${esc($('#wk-title').textContent)} — nice work.</p></div>`;
    $('#wk-next').innerHTML='Back to the guide'; $('#wk-back').disabled=false; burst($('.wk-done .ring'),36); return; }
  const x=L[i]; $('#wk-sec').textContent=x.sec; $('#wk-bar').style.width=(i/L.length*100)+'%';
  stg.innerHTML=`<div class="wk-card ${dir<0?'in-l':'in-r'}"><div class="wk-count"><span class="big">${i+1}</span><span>Step ${i+1} of ${L.length}<br>${esc(x.sec)} · ${x.ti+1}</span></div><p class="wk-text">${rich(x.st.text)}</p>${stepInner(x.st)}${wkTable(x)}<p class="wk-hint">Tap a picture to zoom · Swipe or use ← → keys</p></div>`;
  stg.scrollTop=0; $('#wk-back').disabled=i===0;
  $('#wk-next').innerHTML=i===L.length-1?`Done — finish ${SV.check}`:`Done — next step ${SV.arr}`; }
function wkTable(x){ const s=G.sections[x.si]; if(!s.table||!s.steps.length) return ''; const r=s.steps.findIndex(st=>/table below/i.test([st.text,st.where,st.result,st.note,st.warn].join(' '))); return x.ti===(r>=0?r:s.steps.length-1)?tableHtml(s.table,'wk-t'):''; }
function wkNext(){ if(!WK) return; if(WK.i>=WK.list.length){ wkClose(); return; } const d=getDone(); d.add(WK.list[WK.i].id); setDone(d); WK.i++; wkRender(1); }
function wkPrev(){ if(!WK||WK.i===0) return; WK.i--; wkRender(-1); }
$('#wk-next').addEventListener('click',wkNext); $('#wk-back').addEventListener('click',wkPrev); $('#wk-x').addEventListener('click',wkClose);
document.addEventListener('keydown',e=>{ if(!WK||$('#lb').classList.contains('on')) return; if(e.key==='ArrowRight'){e.preventDefault();wkNext();} else if(e.key==='ArrowLeft'){e.preventDefault();wkPrev();} else if(e.key==='Escape'){wkClose();} });
let tx=null; $('#wk-stage').addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
$('#wk-stage').addEventListener('touchend',e=>{ if(tx==null) return; const dx=e.changedTouches[0].clientX-tx; tx=null; if(Math.abs(dx)>70){ dx<0?wkNext():wkPrev(); } },{passive:true});

/* ---------- top-right menu ---------- */
topMenu.build([...GROUPS.map(g=>({name:g.name,c:'#ff7eb6',items:g.secs.map(si=>({label:G.sections[si].title,href:secHref(si)}))})),{name:'Whole guide',c:'#ff7eb6',href:'#/all',items:[]}]);

window.addEventListener('hashchange',route);
route();
</script>
</body>
