<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="theme-color" content="#000000">
<title>Internet Essentials: Agent Portal Guide</title>
<style>
  @font-face { font-family: 'Archivo'; font-style: normal; font-weight: 300 700; font-stretch: 62% 125%; font-display: swap;
    src: url(../../assets/fonts/archivo-latin.e3a28eade2.woff2) format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: 'Bodoni Moda'; font-style: normal; font-weight: 400 900; font-display: swap;
    src: url(../../assets/fonts/bodoni-moda-latin.c032219ef6.woff2) format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: 'Bodoni Moda'; font-style: italic; font-weight: 400 700; font-display: swap;
    src: url(../../assets/fonts/bodoni-moda-italic-latin.b737328c13.woff2) format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
</style>
<style>
/* Same design system as tools/csg-how-to (CSG How To Guides), so the two read as one set.
   Accent is CSG's "internet" blue. */
:root{
  --ink:#000;--ink-1:#07090c;--ink-2:#0d1116;--ink-3:#151b22;
  --line:rgba(255,255,255,.08);--line-2:rgba(255,255,255,.14);
  --text:#f2efe8;--text-2:#b9b4aa;--text-3:#7d7a74;
  --brass:#d4a94f;--brass-2:#f0cf86;--brass-dim:rgba(212,169,79,.16);
  --c:#5cc8ff;
  --warn:#ff8a65;--ok:#5be3a0;
  --display:'Bodoni Moda',Didot,'Times New Roman',serif;
  --sans:'Archivo',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:ui-monospace,'JetBrains Mono',Consolas,monospace;
  --r:4px;--gut:16px;--max:1180px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:190px}
body{margin:0;background:var(--ink);color:var(--text);font:400 16px/1.6 var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(900px 500px at 85% -10%,rgba(92,200,255,.10),transparent 60%),radial-gradient(700px 500px at -10% 110%,rgba(212,169,79,.07),transparent 60%)}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--brass-2);outline-offset:2px;border-radius:2px}
.wrap{position:relative;z-index:1;max-width:var(--max);margin:0 auto;padding:0 var(--gut)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.hair{height:1px;background:linear-gradient(90deg,transparent,var(--c) 20%,var(--c) 80%,transparent);opacity:.45}

/* ---------- header ---------- */
header.top{position:sticky;top:0;z-index:20;background:rgba(0,0,0,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:14px;height:64px}
.brand{display:flex;align-items:baseline;gap:10px;text-decoration:none;white-space:nowrap}
.brand b{font:700 24px/1 var(--display)}
.brand b em{color:var(--c)}
.brand span{font:600 10px/1 var(--sans);letter-spacing:.28em;text-transform:uppercase;color:var(--text-3)}
.search{position:relative;flex:1;max-width:520px;margin-left:auto}
.search input{width:100%;height:44px;padding:0 44px 0 42px;background:var(--ink-2);border:0;box-shadow:inset 0 0 0 1px var(--line-2);border-radius:999px;color:var(--text);font:500 15px var(--sans)}
.search input::placeholder{color:var(--text-3)}
.search input:focus{outline:none;box-shadow:inset 0 0 0 1px var(--c)}
.search input::-webkit-search-cancel-button{display:none}
.search svg{position:absolute;left:15px;top:13px;width:18px;height:18px;stroke:var(--text-3)}
.search kbd{position:absolute;right:12px;top:11px;font:500 11px var(--mono);color:var(--text-3);border:1px solid var(--line-2);border-radius:4px;padding:2px 6px}
.search .clear{position:absolute;right:6px;top:4px;width:36px;height:36px;border-radius:50%;color:var(--text-2);display:none;font-size:20px}
.search.has .clear{display:block}.search.has kbd{display:none}
nav.cats{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:0 0 12px}
nav.cats::-webkit-scrollbar{display:none}
nav.cats a{flex:none;display:flex;align-items:center;gap:8px;height:38px;padding:0 16px;border-radius:999px;text-decoration:none;color:var(--text-2);font:600 14px var(--sans);box-shadow:inset 0 0 0 1px var(--line);transition:.15s}
nav.cats a i{font:700 11px var(--sans);font-style:normal;color:var(--c);letter-spacing:.06em}
nav.cats a:hover{color:var(--text);box-shadow:inset 0 0 0 1px var(--line-2)}
nav.cats a[aria-current]{color:#000;background:var(--c);box-shadow:none}
nav.cats a[aria-current] i{color:#000}

/* ---------- guide page ---------- */
.g-head{padding:44px 0 28px}
.eyebrow{font:600 12px/1 var(--sans);letter-spacing:.28em;text-transform:uppercase;color:var(--c)}
.g-head h1{font:700 clamp(38px,7vw,76px)/1 var(--display);margin:14px 0 16px;max-width:18ch;letter-spacing:-.012em}
.g-head h1 em{background:linear-gradient(100deg,var(--c) 0%,#ffc2dc 40%,#fff2f8 50%,#ffc2dc 60%,var(--c) 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sheen 5s ease-in-out infinite;font-style:italic}
@keyframes sheen{0%,100%{background-position:100% 0}50%{background-position:0 0}}
.g-head .sum{font-size:18px;color:var(--text-2);max-width:62ch;margin:0}
.g-head .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:18px}
.tag{font:600 11px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;padding:5px 8px;border-radius:3px;background:var(--ink-3);color:var(--text-2)}
.layout{display:grid;grid-template-columns:1fr;gap:32px;padding:28px 0 80px}
@media(min-width:980px){.layout{grid-template-columns:minmax(0,1fr) 260px}}
.toc{display:none}
@media(min-width:980px){.toc{display:block;position:sticky;top:140px;align-self:start}}
.toc h5{margin:0 0 10px;font:600 11px var(--sans);letter-spacing:.24em;text-transform:uppercase;color:var(--text-3)}
.toc a{display:flex;justify-content:space-between;gap:8px;padding:7px 0 7px 14px;border-left:1px solid var(--line-2);text-decoration:none;color:var(--text-2);font-size:14px;transition:color .15s,border-color .15s}
.toc a small{color:var(--text-3);font-size:12px}
.toc a:hover,.toc a.on{color:var(--text);border-color:var(--c)}
.toc a.all small{color:var(--ok)}
.g-sec{margin-bottom:44px}
.g-sec h2{display:flex;align-items:center;gap:12px;font:700 28px/1.15 var(--display);margin:0 0 6px}
.g-sec h2::before{content:"";flex:none;width:22px;height:2px;background:var(--c)}
.g-sec .intro{color:var(--text-2);margin:0 0 18px}
.g-sec .intro b{color:var(--text)}
ol.steps{list-style:none;margin:0;padding:0;display:grid;gap:12px}
ol.steps>li{position:relative;display:grid;grid-template-columns:52px 1fr;gap:14px;padding:18px;border-radius:6px;background:var(--ink-1);box-shadow:inset 0 0 0 1px var(--line);transition:background .25s,box-shadow .25s,opacity .25s}
ol.steps>li.hit{box-shadow:inset 0 0 0 1px var(--brass);animation:glow 1.6s}
@keyframes glow{0%{background:rgba(212,169,79,.18)}100%{background:var(--ink-1)}}
.step-body{min-width:0}
.step-body .do{margin:8px 0 0;font-size:18px;line-height:1.5}
.step-body code{font:500 .9em var(--mono);background:var(--ink-3);color:var(--brass-2);padding:2px 6px;border-radius:3px}
.callout{margin-top:12px;padding:12px 14px;border-radius:4px;font-size:15px;background:var(--ink-2);box-shadow:inset 3px 0 0 var(--brass)}
.callout.warn{box-shadow:inset 3px 0 0 var(--warn)}
.callout .lbl{display:block;font:700 11px var(--sans);letter-spacing:.18em;text-transform:uppercase;margin-bottom:4px;color:var(--brass-2)}
.callout.warn .lbl{color:var(--warn)}
.callout a,.mrow a,.panel a{color:var(--brass-2)}
.shots{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}
figure.shot{width:fit-content;max-width:100%;margin:14px 0 0;border-radius:6px;overflow:hidden;background:#e8ebef;box-shadow:0 0 0 1px var(--line-2),0 12px 40px rgba(0,0,0,.5);cursor:zoom-in;position:relative}
figure.shot img{display:block;width:100%;height:auto;margin:0 auto;transition:transform .5s cubic-bezier(.16,1,.3,1)}
figure.shot:hover img{transform:scale(1.015)}
figure.shot figcaption{background:var(--ink-2);color:var(--text-3);font-size:13px;padding:8px 12px}
figure.shot::after{content:"Tap to enlarge";position:absolute;right:10px;top:10px;font:600 11px var(--sans);letter-spacing:.08em;padding:5px 8px;border-radius:3px;background:rgba(0,0,0,.72);color:#fff;opacity:0;transition:.2s}
figure.shot:hover::after{opacity:1}
/* tall phone-camera shots read better side by side than stacked */
@media(min-width:700px){.shots.pair figure.shot{max-width:calc(50% - 6px)}}
.panel{padding:20px;border-radius:6px;background:var(--ink-1);box-shadow:inset 0 0 0 1px var(--line);margin-bottom:28px}
.panel h3{margin:0 0 10px;font:700 22px var(--display)}
.panel ul{margin:0;padding-left:20px;color:var(--text-2)}
.panel li b{color:var(--text)}
.panel li+li{margin-top:6px}
.src{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 12px;border-radius:999px;text-decoration:none;font-weight:600;font-size:12px;box-shadow:inset 0 0 0 1px var(--line-2)}
.src:hover{box-shadow:inset 0 0 0 1px var(--c);color:var(--c)}
.tbl{margin-top:14px;border-radius:6px;overflow:auto;box-shadow:inset 0 0 0 1px var(--line)}
.tbl table{width:100%;border-collapse:collapse;font-size:15px}
.tbl th{text-align:left;font:600 11px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--c);background:var(--ink-2);padding:12px 14px;border-bottom:1px solid var(--line-2)}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--text)}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.hit td{background:rgba(212,169,79,.16)}
@media(max-width:640px){
  .tbl{box-shadow:none;overflow:visible}
  .tbl thead{display:none}
  .tbl table,.tbl tbody,.tbl tr,.tbl td{display:block;width:100%}
  .tbl tr{margin-bottom:10px;border-radius:6px;background:var(--ink-1);box-shadow:inset 0 0 0 1px var(--line);padding:6px 0}
  .tbl td{border:0;padding:6px 14px}
  .tbl td::before{content:attr(data-h);display:block;font:600 10px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--c)}
}

/* ---------- search ---------- */
.s-head{padding:40px 0 20px}
.s-head h1{font:700 clamp(32px,5vw,48px)/1.1 var(--display);margin:10px 0 0}
.s-head p{color:var(--text-2);margin:8px 0 0}
.s-head button{margin-top:14px;color:var(--text-2);text-decoration:underline;font-size:14px}
.hits{display:grid;gap:10px;padding-bottom:80px}
a.hit{display:block;padding:18px;border-radius:6px;text-decoration:none;background:var(--ink-1);box-shadow:inset 0 0 0 1px var(--line)}
a.hit:hover{background:var(--ink-2)}
a.hit .where{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--c);font-weight:600}
a.hit h4{margin:6px 0 4px;font:600 18px/1.3 var(--sans)}
a.hit p{margin:0;color:var(--text-2);font-size:15px}
mark{background:rgba(240,207,134,.25);color:var(--brass-2);border-radius:2px;padding:0 2px}

/* ---------- motion ---------- */
#view{view-transition-name:view}
::view-transition-old(view){animation:vtOut .28s cubic-bezier(.4,0,1,1) both}
::view-transition-new(view){animation:vtIn .55s cubic-bezier(.16,1,.3,1) both}
@keyframes vtOut{to{opacity:0;transform:translateY(-14px) scale(.985);filter:blur(6px)}}
@keyframes vtIn{from{opacity:0;transform:translateY(28px) scale(.975);filter:blur(10px)}}
#view.enter{animation:vtIn .55s cubic-bezier(.16,1,.3,1) both}
.rise{animation:rise .6s cubic-bezier(.16,1,.3,1) both;animation-delay:calc(min(var(--i,0),14) * 45ms)}
@keyframes rise{from{opacity:0;transform:translateY(22px) scale(.98)}}

/* step check-offs */
.num{position:relative;display:grid;place-items:center;width:44px;height:44px;border-radius:50%;font:700 19px var(--display);color:#000;background:var(--c);transition:transform .2s cubic-bezier(.3,1.6,.5,1),background .2s}
.num:hover{transform:scale(1.08)}
.num svg{position:absolute;width:22px;height:22px;opacity:0;transform:scale(.4);transition:.25s cubic-bezier(.3,1.6,.5,1)}
.num span{transition:.2s}
li.done .num{background:var(--ok);animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
li.done .num span{opacity:0;transform:scale(.4)}
li.done .num svg{opacity:1;transform:scale(1)}
@keyframes pop{40%{transform:scale(1.25);box-shadow:0 0 0 10px rgba(91,227,160,.18)}}
li.done{background:rgba(91,227,160,.035)!important;box-shadow:inset 0 0 0 1px rgba(91,227,160,.28)!important}
li.done .do{color:var(--text-2)}
.mrow{display:flex;gap:10px;align-items:flex-start;margin-top:10px;font-size:15px;color:var(--text-2)}
.mrow svg{flex:none;width:18px;height:18px;margin-top:2px;stroke:var(--c)}
.mrow b{color:var(--text);font-weight:600}

/* progress dock */
.dock{position:sticky;top:112px;z-index:15;margin:0 0 26px;padding:12px 14px;border-radius:8px;background:rgba(10,13,17,.86);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:inset 0 0 0 1px var(--line-2),0 10px 30px rgba(0,0,0,.4);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.dock .meter{flex:1;min-width:140px}
.dock .meter small{display:flex;justify-content:space-between;font-size:12px;color:var(--text-3);letter-spacing:.06em;margin-bottom:6px}
.dock .meter small b{color:var(--text)}
.bar-o{height:6px;border-radius:99px;background:var(--ink-3);overflow:hidden}
.bar-i{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--c),var(--ok));transition:width .6s cubic-bezier(.16,1,.3,1)}
.go{display:inline-flex;align-items:center;gap:10px;height:46px;padding:0 20px;border-radius:999px;background:var(--c);color:#000;font-weight:700;font-size:15px;letter-spacing:.02em;position:relative;overflow:hidden;transition:transform .15s}
.go:hover{transform:translateY(-1px)}
.go::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);transform:translateX(-120%);animation:sweep 3.2s 1s ease-in-out infinite}
@keyframes sweep{60%,100%{transform:translateX(120%)}}
.go svg{width:18px;height:18px}
.ghost{height:46px;padding:0 14px;border-radius:999px;color:var(--text-2);font-size:14px;box-shadow:inset 0 0 0 1px var(--line-2)}
.ghost:hover{color:var(--text)}

/* walkthrough */
#wk{position:fixed;inset:0;z-index:70;display:none;flex-direction:column;background:radial-gradient(1200px 600px at 50% -10%,rgba(92,200,255,.14),transparent 60%),#000;color:var(--text)}
#wk.on{display:flex;animation:wkIn .5s cubic-bezier(.16,1,.3,1)}
@keyframes wkIn{from{opacity:0;transform:scale(1.04)}}
.wk-top{display:flex;align-items:center;gap:14px;padding:14px var(--gut);border-bottom:1px solid var(--line)}
.wk-top .t{flex:1;min-width:0}
.wk-top .t b{display:block;font:700 18px var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk-top .t small{color:var(--c);font:600 11px var(--sans);letter-spacing:.18em;text-transform:uppercase}
.wk-x{width:44px;height:44px;border-radius:50%;background:var(--ink-3);font-size:22px;flex:none}
.wk-prog{height:4px;background:var(--ink-3)}
.wk-prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--c),var(--ok));transition:width .5s cubic-bezier(.16,1,.3,1);box-shadow:0 0 18px var(--c)}
.wk-stage{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:22px var(--gut) 30px}
.wk-card{max-width:980px;margin:0 auto}
.wk-card.in-r{animation:inR .45s cubic-bezier(.16,1,.3,1)}
.wk-card.in-l{animation:inL .45s cubic-bezier(.16,1,.3,1)}
@keyframes inR{from{opacity:0;transform:translateX(60px);filter:blur(8px)}}
@keyframes inL{from{opacity:0;transform:translateX(-60px);filter:blur(8px)}}
.wk-count{display:flex;align-items:center;gap:12px;color:var(--text-3);font:600 12px var(--sans);letter-spacing:.16em;text-transform:uppercase}
.wk-count .big{display:grid;place-items:center;width:58px;height:58px;border-radius:50%;background:var(--c);color:#000;font:700 26px var(--display);letter-spacing:0;animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
.wk-text{font:600 clamp(22px,3.4vw,32px)/1.3 var(--sans);margin:18px 0 6px;letter-spacing:-.005em}
.wk-card .mrow{font-size:17px}
.wk-card figure.shot{margin-top:18px;width:fit-content!important}
.wk-card figure.shot img{max-height:58vh;width:auto;max-width:100%;object-fit:contain;background:#fff}
.wk-nav{display:flex;gap:10px;padding:12px var(--gut) calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:rgba(0,0,0,.6)}
.wk-nav button{height:56px;border-radius:12px;font-weight:700;font-size:16px}
.wk-back{width:120px;box-shadow:inset 0 0 0 1px var(--line-2);color:var(--text-2)}
.wk-back:disabled{opacity:.35}
.wk-next{flex:1;background:var(--c);color:#000;display:flex;align-items:center;justify-content:center;gap:10px}
.wk-next svg{width:20px;height:20px}
.wk-hint{color:var(--text-3);font-size:12px;text-align:center;margin-top:14px}
.wk-done{text-align:center;padding:12vh 0}
.wk-done .ring{width:120px;height:120px;margin:0 auto 26px;border-radius:50%;display:grid;place-items:center;background:var(--ok);color:#000;animation:pop .7s cubic-bezier(.3,1.6,.5,1);position:relative}
.wk-done .ring::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--ok);animation:ripple 1.6s ease-out infinite}
@keyframes ripple{to{inset:-40px;opacity:0}}
.wk-done .ring svg{width:56px;height:56px}
.wk-done h2{font:700 clamp(32px,6vw,54px)/1.05 var(--display);margin:0 0 10px}
.wk-done p{color:var(--text-2)}
.spark{position:fixed;width:8px;height:8px;border-radius:2px;pointer-events:none;z-index:80;animation:spark 1.1s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}

/* lightbox */
#lb{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.94);display:none;place-items:center;padding:20px;overflow:auto}
#lb.on{display:grid}
#lb img{max-width:100%;max-height:86vh;border-radius:4px;background:#fff;cursor:zoom-in;transition:max-width .3s,max-height .3s}
#lb p{color:var(--text-2);text-align:center;font-size:14px;max-width:70ch;margin:12px auto 0}
#lb button{position:fixed;top:14px;right:14px;width:44px;height:44px;border-radius:50%;background:var(--ink-3);font-size:22px;z-index:1}
#lb.zoom{place-items:start;align-content:start}
#lb.zoom img{max-width:none;max-height:none;width:auto;cursor:zoom-out}

footer{padding:40px 0 60px;color:var(--text-3);font-size:13px;border-top:1px solid var(--line)}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}

@media(max-width:640px){
  .bar{height:auto;flex-wrap:wrap;padding:12px 0 10px;gap:10px}
  .brand b{font-size:21px}
  .brand span{display:none}
  .search{max-width:none;flex-basis:100%;order:3}
  .search kbd{display:none}
  .g-head{padding:30px 0 20px}
  .g-head .sum{font-size:16px}
  ol.steps>li{grid-template-columns:1fr;gap:6px;padding:16px}
  html{scroll-padding-top:230px}
  .dock{top:166px;padding:10px 12px;gap:10px}
  .go{flex:1;justify-content:center}
  .ghost{display:none}
  .dock .meter small span{display:none}
}

<script>
const G = {"id": "internet-essentials", "code": "HOW12791 + 9 more", "updated": "Sep 1, 2026", "title": "Internet Essentials: Agent Portal Guide", "summary": "Low-cost home internet for qualifying households. Get your Sales ID on the application so you get paid, walk the customer through every screen, then confirm the order made it into CSG.", "source": "https://celestial.cable.comcast.com/knowledge/article-info/?query=200826155424152", "before": ["Be on the store's **Retail WiFi**. The agent portal only opens on the Comcast network. Celestial lists it as \"must be on VPN\", and in the store the Retail WiFi covers that.", "**No Sales ID, no pay.** Before every application, check that your **Sales ID** is saved in the portal. It's the same **5-digit code you use to enter sales in CSG**.", "Have the customer there **with their phone**. They'll get a one-time passcode by text, and they may need to photograph a document or their ID.", "**Don't refresh the page** in the middle of an application. The applicant's data won't be saved.", "Quick eligibility check: Xfinity Internet is available at the address · **no Xfinity Internet in the last 90 days** · **no Comcast debt less than a year old** · on an assistance program (NSLP, housing assistance, Medicaid, SNAP, SSI and others) **or** household income at or below 200% of the Federal Poverty Level."], "tips": ["**Approvals are valid for 12 months.**", "An **existing IE customer who's moving** doesn't fill out a new application. Do the transfer in CSG.", "IE **can't be bundled**. Customers can still add Xfinity TV, Xfinity Home, NOW TV, NOW TV Latino, NOW StreamSaver and Xumo Stream Box. They **can't** get Xfinity Flex or the Seasonal Convenience Plan.", "Existing TV, Mobile or Voice customers who don't have Xfinity Internet **can** sign up for IE.", "New customers get an **XB6** gateway. Existing IE customers keep their XB3 unless they move tiers, and then CSG pops up an XB6 swap offer. Customers can use their own modem, but remind them the gateway is **included at no cost**.", "**Application status:** at [internetessentials.com](https://www.internetessentials.com), customers click **Application Status** and enter their phone number and last name. They can also call **1-855-8-INTERNET (1-855-846-8376)**.", "If ID was verified in the store, approval can take **three to five business days**. If the customer still hasn't heard back after that, chat the IE team in ECM.", "**Amnesty:** a household whose only Xfinity debt is **more than a year old** (from the final disconnect date) can still qualify, and that old debt is forgiven. It doesn't cover Xfinity Mobile debt, and they can't upgrade or add services for a year. CSG shows a CRE pop-up with the amnesty expiration date.", "New York residents have additional ways to qualify (senior citizen or disability rent increase exemptions, or a utility affordability benefit).", "Approved customers can buy a **Dell laptop for $149.99 plus tax**, one per household. The Welcome Kit explains how. Dell support: **1-800-624-9896**."], "sections": [{"title": "Log in & set your Sales ID", "nav": "Get paid", "intro": "Do this **first, every time you start an IE application**. Your Sales ID is how the sale gets credited to you. If it's missing, you don't get paid.", "steps": [{"text": "Connect the store computer or tablet to the **Retail WiFi**.", "warn": "The agent portal won't load on guest WiFi or cellular data. It has to be on the Comcast network.", "imgs": []}, {"text": "Go to [support.internetessentials.com/agent](https://support.internetessentials.com/agent) and sign in.", "result": "The agent portal opens on **New Application**, with **Hello [your name]** in the top right.", "imgs": []}, {"text": "In the top right, under your name, click **Update Sales ID**.", "where": "Top right: **Hello [name]** → **Update Sales ID** → Logout", "imgs": [{"f": "5a8c043c31.webp", "w": 960, "h": 417, "cap": "The agent portal. Update Sales ID sits under your name in the top right.", "alt": "Internet Essentials agent portal with the Please enter the Sales ID pop-up open over the New Application tab."}]}, {"text": "Type your **5-digit Sales ID** (the one you use in CSG) and click **Save**.", "warn": "Leave **I don't have a Sales ID** unchecked. If you check it, the application won't be tied to you.", "imgs": [{"f": "1473e58c88.webp", "w": 748, "h": 365, "cap": "Enter your 5-digit CSG Sales ID, then click Save.", "alt": "Please enter the Sales ID pop-up with a Sales ID field, an I don't have a Sales ID checkbox and a Save button."}]}, {"text": "Click the **New Application** tab to start.", "note": "Already started one? **Resume Application** and **Upload Documents** are both at the top of the New Application tab. **Check Application Status** is right under them.", "imgs": []}]}, {"title": "Address & identity", "nav": "Address & ID", "intro": "From Celestial HOW12791. Every Xfinity customer has to verify their identity before services can be ordered.", "steps": [{"text": "On **Let's get started**, type the **service address**, pick it from the list and click **Continue**.", "imgs": [{"f": "36efd71a0b.webp", "w": 520, "h": 1043, "cap": "Let's get started: enter the service address.", "alt": "Let's get started: enter the service address."}]}, {"text": "On **Let's get you signed up**, enter the customer's **first name, last name, phone number and email**. Check the **SMS consent** box, choose **English or Spanish**, and click **Next**.", "note": "If the customer gives a mobile number and opts in to texts, they get a **one-time passcode** to verify. That's the fastest way through.", "imgs": [{"f": "65cf5fcbcb.webp", "w": 520, "h": 907, "cap": "Name, phone, email, SMS consent and application language.", "alt": "Name, phone, email, SMS consent and application language."}]}, {"text": "Have the customer read you the **one-time passcode** from their text and enter it. Then click **Next**.", "result": "The code **expires in 5 minutes**. Use **Resend** if it didn't arrive, or **I would like to verify my identity another way**.", "imgs": [{"f": "6f82078097.webp", "w": 520, "h": 992, "cap": "Enter the one-time passcode sent to the customer's mobile.", "alt": "Enter the one-time passcode sent to the customer's mobile."}]}, {"text": "If asked, enter the customer's **Date of Birth** and **Social Security number**, then click **Next**.", "note": "This is **not a credit check**. Say so up front, because customers worry about it.", "warn": "No SSN, or the customer doesn't want to share it? Check **Alternate ID Verification**. More than 30 alternate IDs are accepted, including international documents. They'll have to **upload a selfie holding their ID** later. See *Upload documents & selfie* below.", "imgs": [{"f": "51e8f81a44.webp", "w": 520, "h": 934, "cap": "Date of Birth, SSN, or Alternate ID Verification.", "alt": "Date of Birth, SSN, or Alternate ID Verification."}]}]}, {"title": "Choose the plan", "nav": "Plan", "intro": "Internet Essentials or Internet Essentials Plus, plus any sponsor or promo code.", "steps": [{"text": "On **Tell us a little more**: leave the toggle on **No** for **Internet Essentials** (75/10 Mbps, $14.95/mo), or switch it to **Yes** for **Internet Essentials Plus** (100/20 Mbps, $29.95/mo).", "imgs": [{"f": "74bf3bf47d.webp", "w": 520, "h": 948, "cap": "Promo code field, IE Plus toggle and how-did-you-hear questions.", "alt": "Promo code field, IE Plus toggle and how-did-you-hear questions."}]}, {"text": "If the customer has a **Sponsorship or Promo code**, enter it in the field.", "warn": "With a sponsorship or promo code, **leave IE Plus set to No**. Any upgrade to IE Plus that a sponsor covers happens **after checkout**.", "imgs": []}, {"text": "Answer the two **how did you hear about Internet Essentials** questions (local organization or community center, and LiftZone), then click **Next**.", "imgs": []}]}, {"title": "Qualify the household", "nav": "Qualify", "intro": "Many customers are **approved on the spot** through their address or their kids' school. Everyone else picks a program and uploads proof.", "steps": [{"text": "On **Let's see how you qualify**, answer **Do you have any children under 18 living in your home?**", "imgs": [{"f": "fb7ba34419.webp", "w": 520, "h": 885, "cap": "Children under 18? Many families qualify through school lunch (NSLP).", "alt": "Children under 18? Many families qualify through school lunch (NSLP)."}]}, {"text": "If **Yes**, enter the **names of the children's schools**. The portal checks whether each one is in the **Community Eligibility Provision (CEP)** or the **National School Lunch Program (NSLP)**.", "result": "**Expedited approval** happens two ways: (1) **service address**, if the customer lives in a government-defined low-income area, or (2) **child's school**, if a child under 18 attends a CEP school or a school with high NSLP participation.", "imgs": []}, {"text": "Not expedited? On **Just a few more questions**, select **every program that applies**: Medicaid, Housing Assistance, SNAP, TANF, SSI, and more under **See more options**. They can also qualify **based on income**.", "imgs": [{"f": "1330293c7e.webp", "w": 520, "h": 975, "cap": "Select every assistance program the household is on.", "alt": "Select every assistance program the household is on."}]}, {"text": "Choose the **eligibility document** to submit for the program you picked.", "imgs": [{"f": "257fc6553a.webp", "w": 520, "h": 889, "cap": "Pick the document type, e.g. a Medicaid card or a housing assistance letter.", "alt": "Pick the document type, e.g. a Medicaid card or a housing assistance letter."}]}, {"text": "Upload it. Use **Browse Computer**, drag it in, or take a photo with the customer's phone. **One document per image**, and it has to be readable (JPG, PNG or PDF).", "result": "**Upload Later** and **Mail My Documents** are there too, but uploading now is fastest. The document review takes **two to three business days**, and the customer is notified once a decision is made.", "imgs": [{"f": "d9f3a52cea.webp", "w": 520, "h": 880, "cap": "Upload the qualifying document. JPG, PNG or PDF.", "alt": "Upload the qualifying document. JPG, PNG or PDF."}]}]}, {"title": "Installation & review", "nav": "Install & submit", "intro": "Approved customers pick how they get their equipment, then review and submit.", "steps": [{"text": "On **How would you like to receive your equipment?**, choose **I'll install services myself** or **I would like a tech to install**.", "note": "The **Getting Started Kit** (self-install) is **always free**, whether it's shipped or picked up in-store. A **professional install is $39.99** if a self-install option was available. If the address can't get a kit, pro install is **free**.", "imgs": [{"f": "1927fd484d.webp", "w": 520, "h": 947, "cap": "Self-install kit or tech install.", "alt": "Self-install kit or tech install."}]}, {"text": "Self-install: pick **In-store pickup** or **Standard shipping** (3–5 business days). Confirm the shipping address.", "imgs": [{"f": "ff85b88ded.webp", "w": 520, "h": 875, "cap": "Get a self-install kit: in-store pickup or standard shipping.", "alt": "Get a self-install kit: in-store pickup or standard shipping."}]}, {"text": "Tech install: pick a **date and time window**, and check that someone **18 or older** will be there.", "imgs": [{"f": "3ca43acdba.webp", "w": 520, "h": 840, "cap": "Schedule the technician appointment.", "alt": "Schedule the technician appointment."}]}, {"text": "On **Review & Confirm**, go over the monthly charges, equipment ($0), one-time charges and next bill **with the customer**.", "imgs": [{"f": "0363bd5ca7.webp", "w": 520, "h": 1423, "cap": "Review & Confirm for Internet Essentials ($14.95).", "alt": "Review & Confirm for Internet Essentials ($14.95)."}, {"f": "5b9cdc1ad2.webp", "w": 520, "h": 1229, "cap": "Review & Confirm for Internet Essentials Plus ($29.95).", "alt": "Review & Confirm for Internet Essentials Plus ($29.95)."}]}, {"text": "The **customer** checks both consent boxes (the order representation and the **Internet Essentials Terms & Conditions**), then click **Submit Order**.", "warn": "The consent belongs to the customer. Turn the screen toward them and let them read and check it themselves.", "imgs": []}]}, {"title": "Confirm the order reached CSG", "nav": "Verify in CSG", "intro": "**Check every order you submit.** An approved application can still get **worklisted** and never reach CSG. If that happens, nobody installs anything and the sale doesn't count.", "steps": [{"text": "On the **Order Summary** page (\"Order complete\"), **copy the Application ID**.", "note": "The account number can take **up to two minutes** to attach to the application. You can also check the account directly in CSG.", "imgs": [{"f": "786e0e56e7.webp", "w": 960, "h": 434, "cap": "Order complete. Copy the Application ID.", "alt": "Order complete. Copy the Application ID."}]}, {"text": "Open a **new tab** and go to the **Existing Application** tab: [support.internetessentials.com/en/agent/agentsearch](https://support.internetessentials.com/en/agent/agentsearch).", "imgs": [{"f": "b66ee4ba6d.webp", "w": 960, "h": 380, "cap": "The Existing Application search screen.", "alt": "The Existing Application search screen."}]}, {"text": "Paste the **Application Number** and click **Search**.", "imgs": [{"f": "4e39c0d8ab.webp", "w": 960, "h": 320, "cap": "Paste the application number and click Search.", "alt": "Paste the application number and click Search."}]}, {"text": "On **Customer Details**, check the **Account Number** field. Use the table below to read it.", "imgs": [{"f": "57efb141ee.webp", "w": 960, "h": 420, "cap": "Customer Details: Application Status and the account number section.", "alt": "Customer Details: Application Status and the account number section."}]}], "table": {"head": ["Account Number shows…", "What it means", "What you do"], "rows": [["**Worklisted**", "The order is **incomplete**.", "It needs agent work in **CSG** to finish."], ["**Blank**", "The account number hasn't attached yet.", "Click **Back** and search again to refresh."], ["**A 16-digit number**", "The order **was submitted to the biller**.", "You're done."]]}}, {"title": "Upload documents & selfie (customer)", "nav": "Docs & selfie", "intro": "From HOW14130 (customer-shareable). Customers do this on their own phone at **apply.internetessentials.com**, either in the store with you or at home later.", "steps": [{"text": "**Documents:** go to [apply.internetessentials.com](https://apply.internetessentials.com) and click **Upload Documents** at the top.", "imgs": [{"f": "d63e98a0e1.webp", "w": 520, "h": 1050, "cap": "Upload Documents is at the top of the page.", "alt": "Upload Documents is at the top of the page."}]}, {"text": "Enter the **Application ID** and **last name**, check the verification box, and click **Continue**.", "imgs": [{"f": "ac8e2507ce.webp", "w": 520, "h": 730, "cap": "Application ID and last name.", "alt": "Application ID and last name."}]}, {"text": "Click **Upload documents now** and pick the photo or file.", "imgs": [{"f": "8d4d415b45.webp", "w": 839, "h": 652, "cap": "Upload documents now.", "alt": "Upload documents now."}]}, {"text": "**Selfie with ID** (needed when no SSN was given): go to [apply.internetessentials.com](https://apply.internetessentials.com), click **Resume Application**, and enter the Application ID and last name.", "imgs": [{"f": "ffaa54b461.webp", "w": 372, "h": 487, "cap": "Resume Application. Enter the Application ID and last name.", "alt": "Resume Application. Enter the Application ID and last name."}]}, {"text": "On the selfie page, tap **Take Photo Now**, or **Upload From Saved Photos**, for a selfie **holding a valid ID**.", "note": "Acceptable IDs include US or foreign driver's licenses, US or foreign passports and permanent resident cards. Full list: [internetessentials.com/idforms](https://www.internetessentials.com/idforms). Name and picture must be visible, and nothing can cover the face.", "imgs": [{"f": "259ba72532.webp", "w": 470, "h": 822, "cap": "Alternate ID Verification: take a selfie holding your ID.", "alt": "Alternate ID Verification: take a selfie holding your ID."}]}, {"text": "When the browser asks, **allow camera access** for the site.", "imgs": [{"f": "53d8c51f6e.webp", "w": 314, "h": 480, "cap": "Allow camera access.", "alt": "Allow camera access."}]}, {"text": "If it says **We are unable to detect your camera**, click **Back**. Then choose **Upload From Device**, or **Upload Later** to finish (next steps get emailed).", "imgs": [{"f": "3e5526b8f5.webp", "w": 928, "h": 747, "cap": "No camera detected.", "alt": "No camera detected."}]}, {"text": "Tap the **white circle** to take the selfie holding the ID.", "imgs": [{"f": "008306ed76.webp", "w": 257, "h": 539, "cap": "Tap the capture button.", "alt": "Tap the capture button."}]}, {"text": "Check the picture. Tap **Retake** if it isn't clear, or **Use Image**.", "imgs": [{"f": "93efb2c7b2.webp", "w": 282, "h": 591, "cap": "Retake or Use Image.", "alt": "Retake or Use Image."}]}, {"text": "Review it and tap **Submit Image**.", "imgs": [{"f": "d76c446ac0.webp", "w": 281, "h": 592, "cap": "Image uploaded. Submit Image.", "alt": "Image uploaded. Submit Image."}]}, {"text": "The confirmation page shows **We've received your document(s) and ID**. The review takes **two to three business days**.", "note": "To delete a selfie and redo it, tap the **X** within **one hour** of uploading. **See more options** lets them add more.", "imgs": [{"f": "308bb0ab61.webp", "w": 253, "h": 526, "cap": "Upload confirmation.", "alt": "Upload confirmation."}, {"f": "13d3e1cd94.webp", "w": 470, "h": 247, "cap": "Uploaded selfie. The X removes it within one hour.", "alt": "Uploaded selfie. The X removes it within one hour."}]}]}, {"title": "In-store ID checks, kits & escalations", "nav": "Store help (ECM)", "intro": "For the things the portal can't do: rushing a document review, verifying ID in person, or handing out a Getting Started Kit.", "steps": [{"text": "**Verifying ID or documents in the store, or checking status:** open **Enterprise Case Management (ECM)** and choose the **Internet Essentials** problem type.", "where": "ECM → **Account Management** → **Internet Essentials**", "imgs": []}, {"text": "For **Reason for Escalation**, pick one of the **Service Center / Xfinity Store Use** items.", "note": "Customers who submitted without a selfie or SSN can have their **ID verified at the store**.", "imgs": []}, {"text": "Give the chat agent the customer's **IE application number** or **account number**, and tell them you **verified their ID** or documents.", "imgs": []}, {"text": "If the chat agent adds the approved service codes, **issue the customer their equipment**.", "imgs": []}, {"text": "**Rushing a document review:** once the customer has uploaded their documents, open an **ECM chat with IE Tier 2** and say it's an **expedited request with documents available**. Tier 2 reviews them in real time and updates the application.", "where": "ECM → Account Management → Internet Essentials", "imgs": []}, {"text": "**After approval** (once the application shows **Approved** in the portal and the IE Center of Excellence has reviewed it), a **Store Manager or Assistant Store Manager** adds the **Internet Essentials** or **IE Plus** campaign in CSG, together with the **IE Getting Started Kit** campaign, to give the kit out in-store.", "note": "Chat hours with the IE team: **8 a.m.–10 p.m. Eastern**, seven days a week. That's **7 a.m.–9 p.m. Central** for the Chicago stores. Phone support runs 8 a.m.–9 p.m. ET.", "imgs": []}, {"text": "After the order is placed, the customer gets a **Getting Started text** and an **order confirmation email** that walk them through creating their **Xfinity ID**.", "imgs": [{"f": "bcec4fb030.webp", "w": 270, "h": 154, "cap": "The Getting Started text from Xfinity Assistant.", "alt": "The Getting Started text from Xfinity Assistant."}, {"f": "9faa682911.webp", "w": 500, "h": 637, "cap": "Order confirmation email.", "alt": "Order confirmation email."}]}]}, {"title": "Upgrade IE → IE Plus in CSG", "nav": "Upgrade to Plus", "intro": "From HOW20969 and HOW22483. **New** customers get IE Plus with the toggle in the portal. **Existing** IE customers are upgraded in CSG.", "steps": [{"text": "In CSG, click **Select Order Workflow** → **Change of Service**.", "imgs": []}, {"text": "On **Available Campaigns**, type **IE** in **Keyword(s)** and click **Find**. Double-click **INTERNET ESS PLUS** and pick the Picklist Customization options.", "note": "HOW22483 calls this **campaign X34**.", "imgs": []}, {"text": "If the account is eligible, a pop-up says **UPGRADE DEVICE-OFFER XB6 IF THEY HAVE XB3**. Encourage the swap through the Getting Started Kit process. It improves their security.", "imgs": []}, {"text": "Click **OK** on the error message that appears.", "imgs": [{"f": "7f22a8145d.webp", "w": 475, "h": 200, "cap": "Click OK on the campaign error message.", "alt": "Click OK on the campaign error message."}]}, {"text": "In **Current Services**, remove **lehsdequip** and **le Svc** (Internet Essentials), then click **Calculate**.", "imgs": [{"f": "156286de4d.webp", "w": 500, "h": 197, "cap": "Remove lehsdequip and le Svc, then Calculate.", "alt": "Remove lehsdequip and le Svc, then Calculate."}]}, {"text": "Type **INS** in **Keyword(s)**, click **Find**, and double-click the **no-truck installation campaign** you want.", "result": "Some accounts show a **credit screening** pop-up. Credit screening **isn't required** for this upgrade. Click **Continue**.", "imgs": [{"f": "4d44cf018c.webp", "w": 960, "h": 464, "cap": "IE credit screening pop-up. Click Continue.", "alt": "IE credit screening pop-up. Click Continue."}]}, {"text": "Finish with the normal CSG **change of service** order entry steps.", "imgs": []}]}, {"title": "Other languages document.addEventListener('click',e=>{
  if(e.target.closest('#s-back')){ location.hash='#/'; return; }
  const f=e.target.closest('figure.shot'); if(f){ openLB(f.querySelector('img')); return; }
  const nb=e.target.closest('.num'); if(nb){ const d=getDone(), id=nb.dataset.sid, li=nb.closest('li');
    if(d.has(id)){ d.delete(id); li.classList.remove('done'); nb.setAttribute('aria-pressed','false'); } else { d.add(id); li.classList.add('done'); nb.setAttribute('aria-pressed','true'); burst(nb,8); }
    setDone(d); paintDock(); return; }
  if(e.target.closest('#go')){ wkOpen(); return; }
  if(e.target.closest('#reset')){ setDone(new Set()); document.querySelectorAll('ol.steps li.done').forEach(li=>{ li.classList.remove('done'); li.querySelector('.num').setAttribute('aria-pressed','false'); }); paintDock(); return; }
  /* same-hash anchor clicks still jump (hashchange won't fire) */
  const a=e.target.closest('a[href^="#/~"]'); if(a&&a.getAttribute('href')===location.hash){ e.preventDefault(); route(); }
});
function burst(el,n){ if(RM()) return; const r=el.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2, cols=['#5be3a0','#f0cf86','#ff7eb6','#5cc8ff','#ffb05c'];
  for(let k=0;k<n;k++){ const p=document.createElement('i'); p.className='spark'; const a=Math.random()*Math.PI*2, d=40+Math.random()*(n>12?160:60);
    p.style.cssText=`left:${cx}px;top:${cy}px;background:${cols[k%cols.length]};--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d}px;--r:${Math.random()*540}deg`; document.body.appendChild(p); setTimeout(()=>p.remove(),1200); } }

/* ---------- step-by-step walkthrough ---------- */
let WK=null;
function wkOpen(){ const d=getDone(); let i=STEPS.findIndex(x=>!d.has(x.id)); if(i<0) i=0;
  WK={i}; $('#wk-title').textContent=G.title; $('#wk').classList.add('on'); document.body.style.overflow='hidden'; wkRender(0); $('#wk-next').focus(); }
function wkClose(){ if(!WK) return; $('#wk').classList.remove('on'); document.body.style.overflow=''; const at=STEPS[Math.min(WK.i,STEPS.length-1)]; WK=null; VIEW=''; showGuide(at?at.id:''); }
function wkRender(dir){ const i=WK.i, stg=$('#wk-stage');
  if(i>=STEPS.length){ $('#wk-sec').textContent='Finished'; $('#wk-bar').style.width='100%';
    stg.innerHTML=`<div class="wk-card wk-done in-r"><div class="ring">${SV.check}</div><h2>All ${STEPS.length} steps done.</h2><p>${esc(G.title)} — nice work.</p></div>`;
    $('#wk-next').innerHTML='Back to the guide'; $('#wk-back').disabled=false; burst($('.wk-done .ring'),36); return; }
  const x=STEPS[i]; $('#wk-sec').textContent=x.sec; $('#wk-bar').style.width=(i/STEPS.length*100)+'%';
  stg.innerHTML=`<div class="wk-card ${dir<0?'in-l':'in-r'}"><div class="wk-count"><span class="big">${i+1}</span><span>Step ${i+1} of ${STEPS.length}<br>${esc(x.sec)} · ${x.ti+1}</span></div><p class="wk-text">${rich(x.st.text)}</p>${stepInner(x.st)}<p class="wk-hint">Tap a picture to zoom · Swipe or use ← → keys</p></div>`;
  stg.scrollTop=0; $('#wk-back').disabled=i===0;
  $('#wk-next').innerHTML=i===STEPS.length-1?`Done — finish ${SV.check}`:`Done — next step ${SV.arr}`; }
function wkNext(){ if(!WK) return; if(WK.i>=STEPS.length){ wkClose(); return; } const d=getDone(); d.add(STEPS[WK.i].id); setDone(d); WK.i++; wkRender(1); }
function wkPrev(){ if(!WK||WK.i===0) return; WK.i--; wkRender(-1); }
$('#wk-next').addEventListener('click',wkNext); $('#wk-back').addEventListener('click',wkPrev); $('#wk-x').addEventListener('click',wkClose);
document.addEventListener('keydown',e=>{ if(!WK||$('#lb').classList.contains('on')) return; if(e.key==='ArrowRight'){e.preventDefault();wkNext();} else if(e.key==='ArrowLeft'){e.preventDefault();wkPrev();} else if(e.key==='Escape'){wkClose();} });
let tx=null; $('#wk-stage').addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
$('#wk-stage').addEventListener('touchend',e=>{ if(tx==null) return; const dx=e.changedTouches[0].clientX-tx; tx=null; if(Math.abs(dx)>70){ dx<0?wkNext():wkPrev(); } },{passive:true});

window.addEventListener('hashchange',route);
route();
</script>
